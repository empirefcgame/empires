function endSeason(){
 // Who each player actually played for this season. Several transfer paths below run
 // before fameTick, so reading p.team there credited a player's trophies to whichever
 // club he had just moved to - meaning a man who won the league and then transferred
 // lost the fame for winning it. Fame is a record of what you did, not of where you
 // happen to be standing when the accounts are totted up.
 G.players.forEach(p=>{p.seasonClub=p.team;});
 // per-region final tables
 const RT={};REGIONS.forEach(r=>RT[r.key]=[0,1,2].map(tier=>standingsOf(r.key,tier)));
 const ureg=userRegionKey();
 const _playedTier=[0,1,2].find(x=>tierClubs(ureg,x).includes(G.userTeam));
 const _myRank=RT[ureg][_playedTier].indexOf(T(G.userTeam))+1;
 G._myRank=_myRank;G._playedTier=_playedTier;
 const promoted=new Set(),relegated=new Set();
 const base=[IN(8e6),IN(3e6),IN(1.2e6)];
 // income for every club, TV + placement
 REGIONS.forEach(r=>RT[r.key].forEach((tbl,tier)=>tbl.forEach((t,rank)=>{
   const tv=base[tier]+(PER_TIER-rank)*IN(220000);
   if(t.id===G.userTeam){t.budget+=tv;logAdd("Season TV and prize money received.",tv);}
   // AI wages are already deducted every matchday in aiFinanceTick, so the
   // season-end payment is TV and prize money only. Charging both meant AI
   // clubs paid 46 weeks of wages per 18-matchday season.
   else t.budget+=tv;
 })));
 // insolvent AI sells
 G.teams.forEach(t=>{
   if(t.id===G.userTeam)return;
   while(t.budget<0&&t.squad.length>SQUAD_MIN){
     const p=squadOf(t).sort((a,b)=>b.value-a.value)[0];
     t.budget+=Math.round(p.value*.9);
     releasePlayerToPool(p);
   }
 });
 // record league + cup titles
 REGIONS.forEach(r=>{const ch=RT[r.key][0][0];ch.leagueTitles++;
   (ch.leagueTitleSeasons=ch.leagueTitleSeasons||[]).push(G.season);
   if(ch.id===G.userTeam)creditPresident("league");});
 // Every regional cup, the user's included, is decided here at the latest: before
 // promotion, relegation and expulsion, so a club thrown out of the pyramid can never
 // be credited with the trophy. If the Super Cup already forced the resolution earlier
 // in the season-over flow, this is a no-op that reuses the cached result.
 ensureRegionalWinners();
 updatePrestige(RT);
 // promotion / relegation within each region (2 up / 2 down; bottom 2 of tier2 -> expansion)

 "Orrin","Willard","Emmett","Cyrus","Lucius","Otis","Josiah","Abner","Ezra","Gideon"];
const BB_SURNAMES=["Ingalls","Oleson","Garvey","Edwards","Wilder","Kendall","Dalton",
 "Baker","Alden","Beadle","Hanson","Carter","Terhune","Snider","Sprague","Larabee",
 "Kagan","Cooper","Nelson","Craig","Webb","Foster","Standish","Simms","Noe","Whipple",
 "Ellison","Mumford","Quinn","Peabody","Danvers","Bartlett","Hollis","Maddox","Renner"];
const BB_POS=["G","G","G","G","F","F","F","F","C","C"];

/* The founding twenty own their names permanently, retired or not. Without this a
   Season 8 draft could mint a second Charles Ingalls while the first man's scoring
   record was still on the board. */
const BB_RESERVED=new Set(BB_FOUNDERS.map(f=>f.name));
function bbRandomName(){
 for(let i=0;i<40;i++){
   const n=BB_GIVEN[ri(0,BB_GIVEN.length-1)]+" "+BB_SURNAMES[ri(0,BB_SURNAMES.length-1)];
   if(!BB_RESERVED.has(n))return n;
 }
 return BB_GIVEN[ri(0,BB_GIVEN.length-1)]+" "+BB_SURNAMES[ri(0,BB_SURNAMES.length-1)]+" Jr";
}
function bbP(id){return G.bb&&G.bb.idx?G.bb.idx.get(id):null;}
function bbT(id){
 if(!G.bb||typeof id!=="number"||id<BB_TEAM_BASE)return undefined;
 return G.bb.teams[id-BB_TEAM_BASE];
}
function bbSlot(t){return t?t.id-BB_TEAM_BASE:-1;}
function bbTeamName(t){return t.city+" "+t.nick;}
function bbReindex(){G.bb.idx=new Map();G.bb.players.forEach(p=>G.bb.idx.set(p.id,p));}

/* ---- player construction ---- */
function bbOvr(p){return Math.round(p.sc*0.42+p.df*0.29+p.pm*0.29);}
function bbMakeAttrs(p,target){
 // Build three attributes that average out to the target, shaped by position, so a
 // centre defends and rebounds and a guard passes without either being a clone.
 const bias=p.pos==="G"?{sc:2,df:-6,pm:8}:p.pos==="C"?{sc:0,df:8,pm:-8}:{sc:4,df:1,pm:-3};
 p.sc=clamp(Math.round(target+bias.sc+rnd(-6,6)),20,99);
 p.df=clamp(Math.round(target+bias.df+rnd(-6,6)),20,99);
 p.pm=clamp(Math.round(target+bias.pm+rnd(-6,6)),20,99);
 // nudge back onto the target so the shaping never drifts the whole player
 let guard=0;
 while(bbOvr(p)!==Math.round(target)&&guard++<40){
   const d=Math.round(target)-bbOvr(p),k=["sc","df","pm"][ri(0,2)];
   p[k]=clamp(p[k]+(d>0?1:-1),20,99);
 }
 p.ovr=bbOvr(p);
}
function bbAgeCurve(age){
 // 18 is raw, 27 is peak, decline bites at 31 and steepens
 if(age>=27&&age<=29)return 1;
 if(age<27)return 0.70+(age-18)*0.0333;
 return 1-Math.pow(age-29,1.55)*0.028;
}
function bbNewPlayer(age,pos,potTarget){
 const p={id:BB_ID_BASE+(G.bb.nextPid++),
  name:bbRandomName(),
  age,pos:pos||BB_POS[ri(0,9)],team:null,
  pot:clamp(Math.round(potTarget),35,97),
  gp:0,pts:0,reb:0,ast:0,cgp:0,cpts:0,creb:0,cast:0,rings:0,mvps:0,rookie:age<=20,
  wage:0,years:ri(1,4)};
 bbMakeAttrs(p,p.pot*bbAgeCurve(age));
 p.wage=bbWage(p);
 return p;
}
function bbNewFounder(f){
 const p={id:BB_ID_BASE+(G.bb.nextPid++),name:f.name,age:f.age,pos:f.pos,team:null,
  pot:clamp(Math.round(f.ovr/bbAgeCurve(f.age)),35,97),
  gp:0,pts:0,reb:0,ast:0,cgp:0,cpts:0,creb:0,cast:0,rings:0,mvps:0,rookie:f.age<=20,
  wage:0,years:ri(2,5)};
 bbMakeAttrs(p,f.ovr);
 p.wage=bbWage(p);
 return p;
}

/* ---- roster API. Nothing moves a player except these. ---- */
function bbRelease(p){
 if(p.team!=null){const t=bbT(p.team);if(t){const i=t.roster.indexOf(p.id);if(i>=0)t.roster.splice(i,1);}}
 p.team=null;
 if(!G.bb.fa.includes(p.id))G.bb.fa.push(p.id);
}
function bbAssign(p,tid){
 // Destination is validated before anything is touched. Checking it last meant a bad
 // tid could pull a man out of the pool and his old roster and leave him in limbo.
 const t=bbT(tid);if(!t)return;
 const i=G.bb.fa.indexOf(p.id);if(i>=0)G.bb.fa.splice(i,1);
 if(p.team!=null&&p.team!==tid){const o=bbT(p.team);if(o){const k=o.roster.indexOf(p.id);if(k>=0)o.roster.splice(k,1);}}
 if(!t.roster.includes(p.id))t.roster.push(p.id);
 p.team=tid;
}
function bbRetire(p){
 const i=G.bb.fa.indexOf(p.id);if(i>=0)G.bb.fa.splice(i,1);
 if(p.team!=null){const t=bbT(p.team);if(t){const k=t.roster.indexOf(p.id);if(k>=0)t.roster.splice(k,1);}}
 G.bb.idx.delete(p.id);
 const j=G.bb.players.indexOf(p);if(j>=0)G.bb.players.splice(j,1);
}

/* ---- schedule ----
   Circle method: twenty franchises pair off into ten games, and rotating the ring
   gives nineteen distinct rounds. Three of those rounds fire every football
   matchday, 54 games a season. A team meets most rivals three times and a few
   twice; the leftover pairings rotate with the season offset. Home is handed to
   whichever of the pair has had fewer so far, which lands everyone on 27. */
function bbSchedOk(){
 const s=G.bb&&G.bb.sched;
 return !!(s&&s.length===SEASON_LEN&&s[0]&&s[0].length===BB_PER_WEEK
   &&s[0][0]&&s[0][0].length===BB_TEAMS/2);
}
function bbBuildSchedule(){
 const B=BB_TEAM_BASE,n=BB_TEAMS,half=n/2;
 const ring=[];for(let i=1;i<n;i++)ring.push(i);
 const rounds=[];
 for(let r=0;r<n-1;r++){
   const pairs=[[0,ring[0]]];
   for(let i=1;i<half;i++)pairs.push([ring[i],ring[n-1-i]]);
   rounds.push(pairs);
   ring.unshift(ring.pop());
 }
 const off=((G.season||1)*7)%(n-1);
 const homeCount=new Array(n).fill(0);
 function place(a,b,d){
   const aHome=homeCount[a]<homeCount[b]||(homeCount[a]===homeCount[b]&&((a+d)%2===0));
   if(aHome){homeCount[a]++;return[B+a,B+b];}
   homeCount[b]++;return[B+b,B+a];
 }
 const weeks=[];
 let k=0;
 for(let w=0;w<SEASON_LEN;w++){
   const week=[];
   for(let g=0;g<BB_PER_WEEK;g++,k++){
     const r=rounds[(off+k)%(n-1)];
     week.push(r.map(([a,b])=>place(a,b,k)));
   }
   weeks.push(week);
 }
 return weeks;
}

/* ---- game simulation ---- */
const BB_MIN=[1.40,1.26,1.14,1.04,0.95,0.62,0.48,0.36,0.24,0.14];
/* Rating order is minutes order. A president who names his own five expresses it by
   moving those men to the front of the list, so the sim needs no special case and no
   hidden bonus: the five he picked simply play the most. */
function bbRoster(t){
 const r=t.roster.map(bbP).filter(Boolean).sort((a,b)=>b.ovr-a.ovr);
 const five=G.bb&&G.bb.userTeam===t.id&&G.bb.five;
 if(!five||!five.length)return r;
 const head=[];five.forEach(id=>{const p=r.find(x=>x.id===id);if(p&&head.indexOf(p)<0)head.push(p);});
 return head.concat(r.filter(p=>head.indexOf(p)<0));
}
function bbRating(t,key){
 const r=bbRoster(t);let s=0,w=0;
 for(let i=0;i<r.length&&i<10;i++){const m=BB_MIN[i];s+=r[i][key]*m;w+=m;}
 let v=w?s/w:60;
 if(G.bb&&G.bb.userTeam===t.id)v+=bbCoachBoost(key);
 return v;
}
function bbPlayGame(hi,ai){
 const h=bbT(hi),a=bbT(ai);
 if(!h||!a)throw new Error(`bbPlayGame: unknown franchise ${hi} v ${ai}`);
 const ho=bbRating(h,"sc")*0.62+bbRating(h,"pm")*0.38, hd=bbRating(h,"df");
 const ao=bbRating(a,"sc")*0.62+bbRating(a,"pm")*0.38, ad=bbRating(a,"df");
 let hs=Math.round(101+(ho-70)*0.72-(ad-70)*0.45+3.0+rnd(-16,16));
 let as=Math.round(101+(ao-70)*0.72-(hd-70)*0.45+rnd(-16,16));
 hs=Math.max(70,hs);as=Math.max(70,as);
 let ot=false;
 while(hs===as){ot=true;if(Math.random()<0.5)hs+=2;else as+=2;}   // overtime
 if(hs>as){h.w++;a.l++;}else{a.w++;h.l++;}
 h.pf+=hs;h.pa+=as;a.pf+=as;a.pa+=hs;
 bbBoxScore(h,hs);bbBoxScore(a,as);
 return{hi,ai,hs,as,ot};
}
function bbBoxScore(t,pts){
 const r=bbRoster(t);if(!r.length)return;
 let wsum=0;const w=r.map((p,i)=>{const x=(BB_MIN[i]||0.1)*(0.55+p.sc/140);wsum+=x;return x;});
 let left=pts;
 r.forEach((p,i)=>{
   const share=i===r.length-1?left:Math.round(pts*w[i]/wsum*rnd(0.75,1.25));
   const got=clamp(share,0,left);left-=got;
   p.gp++;p.pts+=got;
   p.reb+=Math.round((p.df/100)*(p.pos==="C"?11:p.pos==="F"?7:4)*rnd(0.6,1.4));
   p.ast+=Math.round((p.pm/100)*(p.pos==="G"?9:p.pos==="F"?4:2.5)*rnd(0.6,1.4));
 });
}

/* ---- the weekly tick, called once per football matchday ---- */
function bbTick(){
 const bb=G.bb;if(!bb||!bb.sched)return;
 const week=bb.sched[bb.day];if(!week)return;
 const mine=bb.userTeam;
 bb.lastWeek=[];
 bb.lastResult=null;
 week.forEach(round=>{
   round.forEach(([h,a])=>{
     const r=bbPlayGame(h,a);
     if(mine!=null&&(h===mine||a===mine)){
       const home=h===mine, opp=bbT(home?a:h);
       bb.lastWeek.push({md:G.matchday,home,opp:opp?bbTeamName(opp):"\u2014",
         pf:home?r.hs:r.as,pa:home?r.as:r.hs});
     }
   });
 });
 if(bb.lastWeek.length){
   const last=bb.lastWeek[bb.lastWeek.length-1];
   bb.lastResult=last;
 }
 bb.day++;
}

/* ---- standings, playoffs, awards ---- */
function bbStandings(){
 return G.bb.teams.slice().sort((a,b)=>
   (b.w-b.l)-(a.w-a.l)||(b.pf-b.pa)-(a.pf-a.pa)||a.id-b.id);
}
/* ================= THE INGALLS CUP =================
   Built to feel exactly like the Conrad Cup, because that is the experience worth
   having: a draw you can read, one round per tap, your tie highlighted, and a result
   you watch arrive rather than one that has already happened. G.bbLive mirrors
   G.contLive field for field, bbPlayRound mirrors contPlayRound, and bbRunCup is the
   atomic fallback for a president who is not in it. */
function bbCupField(){
 // Eight of twenty. Finish 9th and you watch it.
 return bbStandings().slice(0,BB_CUP_FIELD).map(t=>t.id);
}
function bbSeedOrder(ids){
 // 1v8, 4v5, 2v7, 3v6: top two cannot meet until the final.
 const o=[0,7,3,4,1,6,2,5];
 return o.map(i=>ids[i]).filter(x=>x!=null);
}
function bbCupGame(hi,ai,seedOf){
 // The higher seed carries the floor, the same edge the old bracket gave.
 const h=bbT(hi),a=bbT(ai);
 const ho=bbRating(h,"sc")*0.62+bbRating(h,"pm")*0.38, hd=bbRating(h,"df");
 const ao=bbRating(a,"sc")*0.62+bbRating(a,"pm")*0.38, ad=bbRating(a,"df");
 const edge=(seedOf[hi]<seedOf[ai])?3.2:-3.2;
 let hs=Math.round(101+(ho-70)*0.72-(ad-70)*0.45+edge+rnd(-16,16));
 let as=Math.round(101+(ao-70)*0.72-(hd-70)*0.45-edge+rnd(-16,16));
 hs=Math.max(70,hs);as=Math.max(70,as);
 let ot=false;
 while(hs===as){ot=true;if(Math.random()<0.5)hs+=2;else as+=2;}
 return{hs,as,ot};
}
function bbStartCup(){
 const ids=bbCupField();
 const seedOf={};ids.forEach((id,i)=>{seedOf[id]=i;});
 const mine=G.bb.userTeam;
 G.bb.lastRounds=0;G.bb.lastTitle=false;
 G.bbLive={alive:bbSeedOrder(ids),round:0,log:[],seedOf,
   qualified:ids.includes(mine),userOut:!ids.includes(mine),finished:false,lastRound:null};
 ids.forEach(id=>{const t=bbT(id);if(t)t.playoffs=(t.playoffs||0)+1;});
 if(G.bbLive.qualified)awardBadge("bb_qual");
 saveGame(true);
}
function bbPlayRound(st){
 if(st.finished)return;
 const rn=BB_ROUNDS[Math.min(st.round,BB_ROUNDS.length-1)];
 st.lastRound={name:rn,lines:[]};
 const mine=G.bb.userTeam;
 const next=[];
 for(let i=0;i<st.alive.length;i+=2){
   const h=st.alive[i],a=st.alive[i+1];
   if(a==null){next.push(h);continue;}
   const{hs,as,ot}=bbCupGame(h,a,st.seedOf);
   const win=hs>as?h:a;next.push(win);
   const line=`${bbTeamName(bbT(h))} ${hs}\u2013${as} ${bbTeamName(bbT(a))}${ot?" (OT)":""}`;
   st.log.unshift({round:rn,line});
   st.lastRound.lines.push({line,user:h===mine||a===mine,won:win===mine});
   if(h===mine||a===mine){
     if(win===mine){
       const pr=IN(BB_PRIZE[Math.min(st.round,BB_PRIZE.length-1)]);
       if(pr>0&&userTeamObj()){userTeamObj().budget+=pr;logAdd(`${BB_CUP}: won a ${rn}.`,pr);}
       G.bb.lastRounds=(G.bb.lastRounds||0)+1;
     }else{st.userOut=true;logAdd(`${BB_CUP}: knocked out in the ${rn}.`);}
   }
 }
 st.alive=next;st.round++;
 if(st.alive.length<=1)bbFinishCup(st);
}
function bbFinishCup(st){
 if(st.finished)return;
 const champ=bbT(st.alive[0]);
 if(champ){
   champ.titles=(champ.titles||0)+1;
   (champ.titleSeasons=champ.titleSeasons||[]).push(G.season);
   bbRoster(champ).forEach(p=>p.rings++);
   const aw=bbAwards();
   G.bb.history.push({season:G.season,champ:bbTeamName(champ),champId:champ.id,
     record:`${champ.w}-${champ.l}`,mvp:aw.mvp||null,mvpTeam:aw.mvpTeam||null,
     mvpTeamId:aw.mvpTeamId==null?null:aw.mvpTeamId});
   if(G.bb.history.length>60)G.bb.history.shift();
   G.bb.lastPlayoffs={champ:bbTeamName(champ),log:st.log.slice(),
     awards:aw,season:G.season};
   G.bb.lastTitle=(G.bb.userTeam!=null&&champ.id===G.bb.userTeam);
   if(G.bb.lastTitle&&userTeamObj()){
     const pr=IN(BB_TITLE_BONUS);userTeamObj().budget+=pr;
     logAdd(`${BB_CUP}: CHAMPIONS!`,pr);
   }
 }
 st.finished=true;
}
function bbRunCup(){
 // atomic, for a president who does not own a franchise or missed the cut
 bbStartCup();
 while(!G.bbLive.finished)bbPlayRound(G.bbLive);
}
function bbAwards(){
 const per=p=>p.gp?{pts:p.pts/p.gp,reb:p.reb/p.gp,ast:p.ast/p.gp}:{pts:0,reb:0,ast:0};
 const played=G.bb.players.filter(p=>p.gp>=10&&p.team!=null);
 if(!played.length)return{};
 const winPct=t=>t.w+t.l?t.w/(t.w+t.l):0;
 const score=p=>{const s=per(p);return s.pts+s.reb*0.9+s.ast*1.1+winPct(bbT(p.team))*9;};
 const best=(arr,f)=>arr.slice().sort((a,b)=>f(b)-f(a))[0];
 const mvp=best(played,score);
 if(mvp)mvp.mvps++;
 return{mvp:mvp&&mvp.name,mvpTeam:mvp&&bbTeamName(bbT(mvp.team)),
   mvpId:mvp&&mvp.id,mvpTeamId:mvp&&mvp.team};
}

/* ---- season turnover ---- */
function bbEndSeason(){
 const bb=G.bb;if(!bb)return;
 while(bb.day<SEASON_LEN)bbTick();          // belt and braces if a matchday was skipped
 // The Ingalls Cup is played on the season-over screen, one round per tap, after the
 // Super Cup. If it is already settled we use it; if the president was not in it and
 // never tapped through, it resolves here so the trophy is always awarded.
 if(!(G.bbLive&&G.bbLive.finished))bbRunCup();
 G.bbLive=null;

 // career totals banked, season counters cleared
 bb.players.forEach(p=>{p.cgp+=p.gp;p.cpts+=p.pts;p.creb+=p.reb;p.cast+=p.ast;
   p.gp=0;p.pts=0;p.reb=0;p.ast=0;p.rookie=false;});

 // ageing, then retirement
 const order=bbStandings().map(t=>t.id);
 bb.players.slice().forEach(p=>{
   p.age++;
   // Development cuts both ways. One-sided growth inflates the whole league year on
   // year and makes every past record easier than the last.
   let up=0.30;
   if(p.age<=25&&G.bb.userTeam!=null&&p.team===G.bb.userTeam){
     up+=[0,0.05,0.10,0.16][G.bb.barn||0];
     if(G.bb.coach)up+=BB_COACH_TIERS[G.bb.coach.tier].dev+(G.bb.coach.trait==="teacher"?0.06:0);
   }
   if(p.age<=25){const r=Math.random();
     if(r<up)p.pot=clamp(p.pot+ri(1,3),35,97);
     else if(r<up+0.28)p.pot=clamp(p.pot-ri(1,3),35,97);}
   bbMakeAttrs(p,p.pot*bbAgeCurve(p.age));
 });
 bbOwnerSeasonTick();     // finance, contracts and the agent, before the roster churn
 bb.players.slice().forEach(p=>{
   // A 0.28 slope emptied the league at 34 and nobody ever reached 35. Softer, so the
   // back end of a career is a tail rather than a cliff.
   const retire=p.age>=36||(p.age>=33&&Math.random()<(p.age-32)*0.18)||p.ovr<38;
   if(retire)bbRetire(p);
 });

 // retirement can take a man whose renewal was already on the desk, and the named
 // five can hold ids that have since retired or been sold
 bb.renewals=(bb.renewals||[]).filter(r=>bbP(r.pid));
 if(bb.five)bb.five=bb.five.filter(id=>{const p=bbP(id);return p&&p.team===bb.userTeam;});
 if(bb.five&&!bb.five.length)bb.five=null;

 // trim the free agent pool from the bottom before the draft refills it
 bb.fa.sort((a,b)=>{const x=bbP(a),y=bbP(b);return (y?y.ovr:0)-(x?x.ovr:0);});
 while(bb.fa.length>BB_FA_MAX){const p=bbP(bb.fa[bb.fa.length-1]);if(p)bbRetire(p);else bb.fa.pop();}

 bbDraft(order);
 // The president is padded only to the mid-season floor. Filling him to ten behind his
 // back would hand him men he never signed and undo cuts he chose to make.
 bbFillRosters(order,false);
 bbFranchisePrestige();

 bb.teams.forEach(t=>{t.w=0;t.l=0;t.pf=0;t.pa=0;});
 bb.lastResult=null;bb.lastWeek=[];
 bb.sched=bbBuildSchedule();bb.day=0;
 bb.season=G.season+1;
}
function bbDraft(order){
 // Reverse standings order. The class is sized to actual demand plus a handful who
 // go undrafted, so rosters never overflow and the pool never runs dry.
 const need=G.bb.teams.reduce((n,t)=>n+Math.max(0,BB_ROSTER-t.roster.length),0);
 const size=need+6;
 const cls=[];
 for(let i=0;i<size;i++){
   const age=ri(18,20);
   const p=bbNewPlayer(age,null,rnd(44,86));
   p.rookie=true;G.bb.players.push(p);G.bb.idx.set(p.id,p);G.bb.fa.push(p.id);
   cls.push(p);
 }
 cls.sort((a,b)=>b.pot-a.pot);
 const picks=order.slice().reverse();
 G.bb.draftPicks=[];
 let n=0;
 for(let round=0;round<BB_ROSTER&&n<cls.length;round++){
   for(const tid of picks){
     const t=bbT(tid);if(!t||t.roster.length>=BB_ROSTER)continue;
     const p=cls[n];if(!p)break;
     // The president is never auto-assigned a prospect. Hold at most as many
     // unsigned picks as he has holes, so a 6-man tanking roster is not handed
     // the whole class.
     if(tid===G.bb.userTeam){
       const held=(G.bb.draftPicks||[]).length;
       const holes=BB_ROSTER-t.roster.length-held;
       if(holes>0&&p.team==null)G.bb.draftPicks.push(p.id);
     }
     else if(p.team==null)bbAssign(p,tid);
     n++;if(n>=cls.length)break;
   }
 }
}
function bbSignDraftPick(pid){
 const f=bbMine();if(!f)return;
 const p=bbP(pid);if(!p||p.team!=null)return toast("He has gone elsewhere.");
 if(!(G.bb.draftPicks||[]).includes(pid))return;
 if(f.roster.length>=BB_ROSTER)return toast("The roster is full. Release someone first.");
 p.wage=bbWage(p);p.years=ri(3,4);p.drafted=true;bbAssign(p,f.id);
 G.bb.draftPicks=G.bb.draftPicks.filter(x=>x!==pid);
 logAdd(`${p.name} signs his first ${BB_LEAGUE} deal at ${money(p.wage)}/yr.`);
 saveGame(true);render();
}
function bbFillRosters(order,userTo10){
 // Worst records pick first from the free agent pool, best available by rating. The
 // president's franchise is skipped here: the market never signs an expensive star
 // onto his roster without his say-so. His shortfalls are covered by cheap bodies on
 // league-minimum money instead, and only down to six mid-season (userTo10 false) so a
 // man he cut to make room does not respawn on the next reload.
 const picks=order.slice().reverse();
 let guard=0;
 while(guard++<400){
   let moved=false;
   for(const tid of picks){
     if(tid===G.bb.userTeam)continue;
     const t=bbT(tid);if(t.roster.length>=BB_ROSTER)continue;
     const avail=G.bb.fa.map(bbP).filter(Boolean).sort((a,b)=>b.ovr-a.ovr);
     if(!avail.length)break;
     bbAssign(avail[0],tid);moved=true;
   }
   if(!moved)break;
 }
 G.bb.teams.forEach(t=>{
   const floor=t.id===G.bb.userTeam?(userTo10?BB_ROSTER:6):BB_ROSTER;
   while(t.roster.length<floor){
     const p=bbNewPlayer(ri(21,28),null,rnd(42,58));
     G.bb.players.push(p);G.bb.idx.set(p.id,p);bbAssign(p,t.id);
   }
 });
}
function bbFranchisePrestige(){
 // Franchise standing, for Pass 2 pricing. Decays, so a dynasty that stops winning
 // becomes affordable again.
 G.bb.teams.forEach(t=>{
   t.prestige=Math.max(0,(t.prestige||30)*0.93);
   const pct=t.w+t.l?t.w/(t.w+t.l):0.5;
   t.prestige=clamp(t.prestige+(pct-0.5)*22,0,100);
 });
 const recent=G.bb.history.slice(-4);
 recent.forEach(h=>{const t=bbT(h.champId);if(t)t.prestige=clamp(t.prestige+9,0,100);});
}

/* ---- world construction ---- */
/* ===== PRAIRIE LEAGUE, PASS 2: OWNERSHIP =====
   A franchise is a trophy, not an investment. Run well it roughly washes its face.
   Run hard, chasing a title with a payroll over the ceiling, it bleeds through the
   luxury tax straight out of the football budget, which is the whole point of putting
   both on one balance sheet. */

const BB_AGENT_WAGE=40000;                 // £/wk, the Mercantile Agent
const BB_PRICE={cellar:0.9e9,middling:1.7e9,contender:3.0e9};
const BB_CEILING=62e6;                     // payroll ceiling, a wage figure
const BB_TAX=[[20e6,1.5],[30e6,2.5],[Infinity,4]];
const BB_ARENA_UPKEEP=11e6, BB_TICKET=200, BB_TRAVEL=6e6;   // 27 home dates a season
const BB_TITLE_BONUS=38e6, BB_ROUND_BONUS=9e6, BB_SPONSOR=26e6;
const BB_BARN=[0,55e6,140e6,300e6];        // training barn levels
const BB_BARN_UPKEEP=[0,7e6,16e6,32e6];
const BB_COACH_TIERS=[null,
 {label:"Schoolmaster",wage:900000,boost:1.0,dev:0.04},
 {label:"Drill Coach",wage:2600000,boost:2.2,dev:0.08},
 {label:"Head of the Grange",wage:6200000,boost:3.6,dev:0.13}];
const BB_COACH_TRAITS={
 teacher:{label:"Teacher",desc:"Under-25s on your roster develop faster."},
 drillmaster:{label:"Drillmaster",desc:"The whole roster defends better."},
 showman:{label:"Showman",desc:"The whole roster scores more."}};

function bbAgentWage(){return IN(BB_AGENT_WAGE);}
function bbCeiling(){return INW(BB_CEILING);}
function bbMine(){return G.bb&&G.bb.userTeam!=null?bbT(G.bb.userTeam):null;}
function bbOwns(){return !!bbMine();}

/* ---- wages, fees and contracts ---- */
function bbWage(p){
 const x=Math.max(0,(p.ovr-40)/58);
 return Math.max(INW(400000),Math.round(INW(500000+Math.pow(x,2.6)*45e6)/50000)*50000);
}
function bbAsk(p){
 // What a free agent wants. Younger men with room to grow ask above their rating.
 const youth=p.age<=23?1.18:p.age<=26?1.06:p.age>=32?0.86:1;
 return Math.max(INW(400000),Math.round(bbWage(p)*youth/50000)*50000);
}
function bbFee(p){
 // A transfer fee for a contracted man. Steep on rating so no amount of football money
 // buys a superstar at a discount, and it climbs with the years left on his deal.
 const yrs=clamp(p.years||1,1,5);
 const base=bbWage(p)*(3.2+yrs*0.9);
 const age=p.age<=24?1.35:p.age<=28?1.15:p.age>=33?0.55:0.85;
 return Math.max(IN(2e6),Math.round(base*age/100000)*100000);
}
function bbPayroll(t){return bbRoster(t).reduce((s,p)=>s+(p.wage||bbWage(p)),0);}
function bbTaxOn(payroll){
 let over=Math.max(0,payroll-bbCeiling()),bill=0;
 for(const[band,rate]of BB_TAX){const slice=Math.min(over,INW(band));bill+=slice*rate;over-=slice;if(over<=0)break;}
 return Math.round(bill);
}

/* ---- franchise valuation and grading ---- */
function bbTalent(t){const r=bbRoster(t);return r.length?r.reduce((s,p,i)=>s+p.ovr*(BB_MIN[i]||0.1),0)/r.reduce((s,p,i)=>s+(BB_MIN[i]||0.1),0):55;}
function bbGrade(t){
 const score=bbTalent(t)+(t.prestige||0)*0.28+(t.titles||0)*4;
 return score>=82?"contender":score>=71?"middling":"cellar";
}
function bbValue(t){
 const g=bbGrade(t);
 const wobble=1+((bbSlot(t)%7)-3)*0.035;
 return Math.round(IN(BB_PRICE[g]*wobble)/1e6)*1e6;
}

/* ---- the Mercantile Agent ----
   Mirrors the shoe liaison exactly: hire him, he works a season, then he puts two
   franchises on the block. Ignore them for a season and the openings lapse and he
   goes back out looking. */
function bbAgentGate(){
 const t=userTeamObj();if(!t)return false;
 return (t.prestige||0)>=80||(t.contTitles||0)>=1;
}
function bbHireAgent(){
 if(!bbAgentGate())return toast(`The ${BB_LEAGUE} does not return calls from clubs at your level yet.`);
 G.bb.agent=true;G.bb.agentCycle={phase:"evaluating",since:G.season};
 logAdd(`Hired a Mercantile Agent (${money(bbAgentWage())}/wk). He begins a season working the ${BB_LEAGUE}.`);
 saveGame(true);render();
}
function bbFireAgent(){G.bb.agent=false;G.bb.agentCycle=null;
 logAdd("Released the Mercantile Agent.");saveGame(true);render();}
function bbBuildOpenings(){
 // Two a year, drawn from franchises nobody owns. Weighted so a contender is a rarer
 // sight than a cellar club, and priced accordingly.
 const pool=G.bb.teams.filter(t=>t.id!==G.bb.userTeam);
 const by={cellar:[],middling:[],contender:[]};
 pool.forEach(t=>by[bbGrade(t)].push(t));
 const want=[];
 const roll=()=>{const r=Math.random();return r<0.45?"cellar":r<0.82?"middling":"contender";};
 for(let i=0;i<2;i++){
   let g=roll(),guard=0;
   while((!by[g].length)&&guard++<6)g=roll();
   if(!by[g].length){const all=pool.filter(t=>!want.includes(t.id));if(!all.length)break;
     want.push(all[ri(0,all.length-1)].id);continue;}
   let cand=by[g].filter(t=>!want.includes(t.id));
   if(!cand.length){cand=pool.filter(t=>!want.includes(t.id));if(!cand.length)break;}
   want.push(cand[ri(0,cand.length-1)].id);
 }
 return want.map(id=>{const t=bbT(id);
   return{tid:id,price:bbValue(t),grade:bbGrade(t),payroll:bbPayroll(t),talent:Math.round(bbTalent(t))};});
}
function bbAgentTick(){
 const bb=G.bb;if(!bb)return;
 if(!bb.agent||bb.userTeam!=null){bb.agentCycle=null;return;}
 if(!bb.agentCycle){bb.agentCycle={phase:"evaluating",since:G.season};return;}
 if(bb.agentCycle.phase==="evaluating"){
   const offers=bbBuildOpenings();
   if(offers.length)bb.agentCycle={phase:"offered",offers,since:G.season};
 }else{
   // an ignored set of openings lapses, and he goes back out
   bb.agentCycle={phase:"evaluating",since:G.season};
   logAdd(`The ${BB_LEAGUE} openings lapsed. Your agent starts again.`);
 }
}
function bbBuyFranchise(idx){
 const cyc=G.bb.agentCycle;if(!cyc||cyc.phase!=="offered")return;
 const o=cyc.offers[idx];if(!o)return;
 const t=userTeamObj();if(!t)return;
 if(t.budget<o.price)return toast(`Short by ${money(o.price-t.budget)}.`);
 const f=bbT(o.tid);if(!f)return;
 t.budget-=o.price;
 logAdd(`Bought the ${bbTeamName(f)} of the ${BB_LEAGUE}.`,-o.price);
 f.city=t.name;f.nick="Basketball";f.owned=true;
 G.bb.userTeam=o.tid;G.bb.agentCycle=null;G.bb.agent=false;
 G.bb.five=null;G.bb.barn=0;G.bb.coach=null;G.bb.renewals=[];
 G.bb.paid=o.price;G.bb.paidInfl=inflIndex();G.bb.titlesAtBuy=f.titles||0;
 G.bb.finHistory=[];G.bb.draftPicks=[];awardBadge("bb_owner");
 (G.news=G.news||[]).unshift({season:G.season,
   text:`${t.name} buy into the ${BB_LEAGUE}. The franchise plays on as ${bbTeamName(f)}.`});
 toast(`You own a ${BB_LEAGUE} franchise.`);
 saveGame(true);render();
}
function bbSaleValue(){
 // What the market pays YOU. Anchored to the price paid, grown by inflation, plus a
 // premium per title won under your ownership. Roster talent is deliberately excluded:
 // pricing the sale off the roster let a president buy a cellar club, spend on stars
 // and flip it as a contender for more than the stars cost. Titles cannot be bought
 // directly, so titles are what the resale market pays for.
 const f=bbMine();if(!f)return 0;
 const grown=(G.bb.paid||bbValue(f))*(inflIndex()/Math.max(0.01,G.bb.paidInfl||1));
 const titles=Math.max(0,(f.titles||0)-(G.bb.titlesAtBuy||0));
 return Math.round((grown*0.82+IN(120e6)*titles)/1e6)*1e6;
}
function bbSellFranchise(){
 const f=bbMine(),t=userTeamObj();if(!f||!t)return;
 const price=bbSaleValue();
 t.budget+=price;
 logAdd(`Sold the ${bbTeamName(f)}.`,price);
 f.city=BB_FRANCHISES[bbSlot(f)].city;f.nick=BB_FRANCHISES[bbSlot(f)].nick;f.owned=false;
 // the next owner does not inherit whatever short roster you left behind
 bbFillRosters(bbStandings().map(x=>x.id),true);
 G.bb.userTeam=null;G.bb.five=null;G.bb.coach=null;G.bb.barn=0;G.bb.renewals=[];
 G.bb.paid=null;G.bb.paidInfl=null;G.bb.titlesAtBuy=0;G.bb.finHistory=[];G.bb.draftPicks=[];
 G.bb.lastResult=null;G.bb.lastWeek=[];
 if(TAB==="hoops")TAB="office";
 toast(`Franchise sold for ${money(price)}.`);
 saveGame(true);render();
}

/* ---- squad building with real money ---- */
function bbSignChance(p,offer){
 // How likely a free agent is to take your number. Rival interest is the count of
 // franchises with a roster hole and room under the ceiling.
 const ask=bbAsk(p);
 const rivals=G.bb.teams.filter(t=>t.id!==G.bb.userTeam&&t.roster.length<BB_ROSTER).length;
 const over=offer/ask;
 const base=clamp((over-0.92)/0.55,0,1);
 const pull=clamp(1-rivals*0.045,0.35,1);
 const pres=bbMine()?clamp((bbMine().prestige||0)/220,0,0.28):0;
 return clamp(base*pull+pres,0.02,0.97);
}
function bbSignFreeAgent(pid,offer){
 const f=bbMine();if(!f)return;
 const p=bbP(pid);if(!p||p.team!=null)return toast("He has already signed elsewhere.");
 if(f.roster.length>=BB_ROSTER)return toast("The roster is full. Release someone first.");
 const t=userTeamObj();
 if(t.budget<offer)return toast(`You cannot cover a ${money(offer)} wage.`);
 const chance=bbSignChance(p,offer);
 if(Math.random()<chance){
   p.wage=offer;p.years=ri(2,4);bbAssign(p,f.id);
   logAdd(`${p.name} signs for the ${bbTeamName(f)} at ${money(offer)}/yr.`);
   toast(`${p.name} signs.`);
 }else{
   // he signs elsewhere, and the pool is one man shorter
   const rivals=G.bb.teams.filter(x=>x.id!==f.id&&x.roster.length<BB_ROSTER);
   if(rivals.length){const r=rivals[ri(0,rivals.length-1)];p.wage=bbAsk(p);p.years=ri(2,4);bbAssign(p,r.id);
     toast(`${p.name} turned you down and signed for the ${bbTeamName(r)}.`);}
   else toast(`${p.name} turned you down.`);
 }
 saveGame(true);render();
}
function bbBuyPlayer(pid){
 const f=bbMine();if(!f)return;
 const p=bbP(pid);if(!p||p.team==null||p.team===f.id)return;
 if(f.roster.length>=BB_ROSTER)return toast("The roster is full. Release someone first.");
 const seller=bbT(p.team);
 const fee=bbFee(p);
 const t=userTeamObj();
 if(t.budget<fee)return toast(`Short by ${money(fee-t.budget)}.`);
 t.budget-=fee;
 logAdd(`Bought ${p.name} from the ${bbTeamName(seller)}.`,-fee);
 bbAssign(p,f.id);p.wage=bbWage(p);p.years=ri(2,4);
 // the seller replaces him at once so no roster is ever illegal
 bbFillRosters(bbStandings().map(x=>x.id),false);
 toast(`${p.name} joins for ${money(fee)}.`);
 saveGame(true);render();
}
function bbReleasePlayer(pid){
 const f=bbMine();if(!f)return;
 const p=bbP(pid);if(!p||p.team!==f.id)return;
 if(f.roster.length<=6)return toast("You cannot go below six men.");
 // Full current-year wage plus 45% of the seasons left on the deal. Anything less
 // and cutting the roster in the final week dodges the payroll and the luxury tax
 // for men who played the whole season.
 const t=userTeamObj(),pay=Math.round((p.wage||bbWage(p))*(1+Math.max(0,(p.years||1)-1)*0.45));
 if(t.budget<pay)return toast(`His settlement is ${money(pay)}. You cannot cover it.`);
 t.budget-=pay;
 logAdd(`Released ${p.name}. Wages and settlement paid.`,-pay);
 bbRelease(p);p.years=0;
 saveGame(true);render();
}
function bbRenew(pid,offer){
 const f=bbMine();if(!f)return;
 const r=(G.bb.renewals||[]).find(x=>x.pid===pid);if(!r)return;
 const p=bbP(pid);if(!p)return;
 const chance=bbSignChance(p,offer);
 G.bb.renewals=G.bb.renewals.filter(x=>x.pid!==pid);
 if(Math.random()<chance){
   p.wage=offer;p.years=ri(2,4);
   logAdd(`${p.name} re-signs at ${money(offer)}/yr.`);toast(`${p.name} stays.`);
 }else{
   bbRelease(p);toast(`${p.name} rejected the offer and left.`);
   logAdd(`${p.name} turned down a new deal and walked.`);
 }
 saveGame(true);render();
}
function bbBuildBarn(){
 const f=bbMine(),t=userTeamObj();if(!f||!t)return;
 const lvl=(G.bb.barn||0)+1;if(lvl>3)return;
 const cost=IN(BB_BARN[lvl]);
 if(t.budget<cost)return toast(`Short by ${money(cost-t.budget)}.`);
 t.budget-=cost;G.bb.barn=lvl;
 logAdd(`Built the training barn to level ${lvl}.`,-cost);
 saveGame(true);render();
}
function bbHireCoach(tier){
 const f=bbMine(),t=userTeamObj();if(!f||!t)return;
 const c=BB_COACH_TIERS[tier];if(!c)return;
 const traits=Object.keys(BB_COACH_TRAITS);
 G.bb.coach={name:bbRandomName(),
   tier,trait:traits[ri(0,traits.length-1)],wage:IN(c.wage)};
 logAdd(`${G.bb.coach.name} takes over the ${bbTeamName(f)} as ${c.label}.`);
 saveGame(true);render();
}
function bbFireCoach(){if(!G.bb.coach)return;
 // Severance is the full year. Without it, hiring the best coach at kickoff and firing
 // him the week before the books close bought a season of his boost for nothing.
 const t=userTeamObj(),sev=G.bb.coach.wage;
 if(t&&t.budget<sev)return toast(`His severance is ${money(sev)}. You cannot cover it.`);
 if(t){t.budget-=sev;logAdd(`${G.bb.coach.name} leaves the ${BB_LEAGUE} bench. Severance paid.`,-sev);}
 G.bb.coach=null;saveGame(true);render();}

/* ---- the annual reckoning ---- */
function bbFinance(){
 const f=bbMine();if(!f)return null;
 const t=userTeamObj();if(!t)return null;
 const gp=f.w+f.l,pct=gp?f.w/gp:0.5;
 const fill=clamp(0.46+pct*0.42+(f.prestige||0)/380,0.3,1);
 const gate=Math.round(f.arena*(BB_GAMES/2)*IN(BB_TICKET)*fill);
 const sponsor=Math.round(IN(BB_SPONSOR)*(0.45+(f.prestige||0)/100));
 const payroll=bbPayroll(f);
 const tax=bbTaxOn(payroll);
 const coach=G.bb.coach?G.bb.coach.wage:0;
 const barn=IN(BB_BARN_UPKEEP[G.bb.barn||0]);
 const upkeep=IN(BB_ARENA_UPKEEP)+IN(BB_TRAVEL)+coach+barn;
 // Cup purses post when the ties are played. The annual books must not add them again.
 const rounds=0,title=0;
 const income=gate+sponsor+rounds+title;
 const costs=payroll+tax+upkeep;
 return{gate,sponsor,rounds,title,income,payroll,tax,upkeep,coach,barn,costs,net:income-costs};
}
function bbSettleFinance(){
 const fin=bbFinance();if(!fin)return;
 const t=userTeamObj();if(!t)return;
 t.budget+=fin.net;
 logAdd(`${BB_LEAGUE}: ${money(fin.income)} in, ${money(fin.costs)} out.`,fin.net);
 if(fin.tax>0)logAdd(`${BB_LEAGUE} luxury tax on a ${money(fin.payroll)} payroll.`,0);
 // a running ledger so a president can see the trend, not just this year's snapshot
 const f=bbMine();
 (G.bb.finHistory=G.bb.finHistory||[]).push({season:G.season,net:fin.net,
   income:fin.income,costs:fin.costs,tax:fin.tax,
   record:f?`${f.w}-${f.l}`:"",title:!!G.bb.lastTitle});
 if(G.bb.finHistory.length>40)G.bb.finHistory.shift();
}

/* ---- ownership hooks into the season turnover ---- */
function bbOwnerSeasonTick(){
 // lastRounds and lastTitle are set as the cup is played, round by round, so they are
 // read here rather than recomputed. Clearing them would wipe the prize money.
 const bb=G.bb;
 const f=bbMine();
 if(f){
   const h=bb.history[bb.history.length-1];
   if(f.w>=40)awardBadge("bb_60");
   if(f.w>=48)awardBadge("bb_perfectstart");
   if(h&&h.mvpTeamId===f.id)awardBadge("bb_mvp");
   if(bb.lastTitle){
     awardBadge("bb_champ");
     if((f.titles||0)-(bb.titlesAtBuy||0)>=3)awardBadge("bb_dynasty");
     const prev=bb.history[bb.history.length-2];
     if(prev&&prev.champId===f.id)awardBadge("bb_backtoback");
     if(bbRoster(f).some(p=>p.drafted))awardBadge("bb_homegrown");
     // lastCont carries winnerId, not a name; matching on name would never have fired
     if(G.lastCont&&G.lastCont.season===G.season&&G.lastCont.winnerId===G.userTeam)
       awardBadge("bb_double");
   }
   const fin=bbFinance();
   if(fin){if(fin.tax>=IN(100e6))awardBadge("bb_taxman");
     if(fin.net>0)awardBadge("bb_profit");}
   bbSettleFinance();
 }
 // contracts run down, and your expiring men become decisions rather than departures
 bb.renewals=[];
 bb.players.forEach(p=>{
   if(p.team==null)return;
   p.years=Math.max(0,(p.years||1)-1);
   if(p.years>0)return;
   if(f&&p.team===f.id)bb.renewals.push({pid:p.id,ask:bbAsk(p)});
   else p.years=ri(2,4),p.wage=bbWage(p);          // AI re-signs its own without drama
 });
 bbAgentTick();
}
function bbExpireRenewals(){
 // Anyone you did not answer during the window walks when the season kicks off.
 const bb=G.bb;if(!bb||!bb.renewals||!bb.renewals.length)return;
 bb.renewals.forEach(r=>{const p=bbP(r.pid);
   if(p&&p.team===bb.userTeam){bbRelease(p);p.years=0;
     logAdd(`${p.name} left the ${BB_LEAGUE} roster. His deal went unanswered.`);}});
 bb.renewals=[];
 // prospects he never signed rejoin the open pool
 (bb.draftPicks||[]).forEach(id=>{const p=bbP(id);
   if(p&&p.team==null&&!bb.fa.includes(id))bb.fa.push(id);});
 bb.draftPicks=[];
 bbFillRosters(bbStandings().map(t=>t.id),false);
}

/* ---- what ownership changes about the games themselves ---- */
function bbCoachBoost(key){
 const c=G.bb&&G.bb.coach;if(!c)return 0;
 let b=BB_COACH_TIERS[c.tier].boost;
 if(c.trait==="drillmaster"&&key==="df")b+=1.4;
 if(c.trait==="showman"&&key==="sc")b+=1.4;
 return b;
}


/* The projected-bracket card lived here. It is gone: the gold cut line on the league
   table says the same thing in one row, and the cup itself is now played round by round
   on the season-over screen where it belongs. */
/* ---- the league table ---- */
function bbStandingsCard(open){
 const bb=G.bb;
 const last=bb.history.length?bb.history[bb.history.length-1]:null;
 const mine=bbMine();
 const card=$(`<details class="card" style="padding:12px"${open?" open":""}></details>`);
 card.appendChild($(`<summary style="cursor:pointer;font-weight:700;font-size:15px">${BB_LEAGUE} table
   <span class="muted" style="font-weight:600;font-size:12px">\u00B7 tap to ${open?"hide":"show"}</span></summary>`));
 // One table, one string. $ parses through a div, and the HTML parser discards a bare
 // <tr> in that context, so $(`<tr>...`) returns null and appendChild(null) throws.
 const rows=bbStandings().map((t,i)=>{
   const diff=t.pf-t.pa, me=mine&&t.id===mine.id;
   return `<tr${i===BB_CUP_FIELD-1?' style="border-bottom:2px solid var(--honey)"':''}>
     <td class="muted">${i+1}</td>
     <td class="l"${me?' style="color:var(--honey);font-weight:700"':''}>${bbTeamName(t)}${t.titles?` <span class="gold small">\u2605${t.titles}</span>`:""}</td>
     <td class="r">${t.w}</td><td class="r">${t.l}</td>
     <td class="r ${diff>0?"res-w":diff<0?"res-l":"muted"}">${diff>0?"+":""}${diff}</td></tr>`;
 }).join("");
 card.appendChild($(`<table style="margin-top:8px"><thead><tr><th>#</th><th class="l">Franchise</th><th class="r">W</th><th class="r">L</th><th class="r">DIFF</th></tr></thead><tbody>${rows}</tbody></table>`));
 card.appendChild($(`<div class="small muted" style="margin-top:6px">The gold line is the cut for the ${BB_CUP}: top ${BB_CUP_FIELD} of ${BB_TEAMS} qualify. \u2605 counts titles won.</div>`));
 if(last){
   card.appendChild($(`<div class="divider"></div>`));
   card.appendChild($(`<div class="logline"><span class="muted">Season ${last.season} champions</span><span class="gold">${last.champ} (${last.record})</span></div>`+
     (last.mvp?`<div class="logline"><span class="muted">MVP</span><span class="gold">${last.mvp}${last.mvpTeam?` \u00B7 ${last.mvpTeam}`:""}</span></div>`:"")));
 }
 const lead=bb.players.slice().sort((a,b)=>(b.cpts+b.pts)-(a.cpts+a.pts)).slice(0,5);
 if(lead.length&&(lead[0].cpts+lead[0].pts)>0){
   card.appendChild($(`<div class="divider"></div>`));
   card.appendChild($(`<div class="small" style="margin-bottom:4px"><b>Career scoring, active players</b></div>`));
   card.appendChild($(lead.map(p=>{
     const tm=p.team!=null?bbTeamName(bbT(p.team)):"free agent";
     return `<div class="logline"><span>${p.name} <span class="muted small">${p.pos} \u00B7 ${p.age}y \u00B7 ${tm}</span></span><span class="gold">${p.cpts+p.pts}</span></div>`;
   }).join("")));
 }

}
/* kept for the Office card, which wants the table collapsed by default */

function assertBBIntegrity(where){
 const bb=G.bb;if(!bb)return;
 const w=m=>{throw new Error(`BB integrity [${where}]: ${m}`)};
 if(bb.teams.length!==BB_TEAMS)w(`${bb.teams.length} franchises`);
 const held=new Map();
 bb.teams.forEach(t=>{
   const min=t.id===bb.userTeam?6:BB_ROSTER;
   if(t.roster.length<min||t.roster.length>BB_ROSTER)w(`${bbTeamName(t)} has ${t.roster.length} on the roster`);
   t.roster.forEach(id=>{
     const p=bbP(id);
     if(!p)w(`${bbTeamName(t)} holds unknown id ${id}`);
     if(id<BB_ID_BASE)w(`id ${id} is below the basketball offset`);
     if(held.has(id))w(`${p.name} is on two rosters`);
     held.set(id,t.id);
     if(p.team!==t.id)w(`${p.name} points at ${p.team} but sits on ${t.id}`);
   });
 });
 bb.fa.forEach(id=>{
   const p=bbP(id);
   if(!p)w(`free agent pool holds unknown id ${id}`);
   if(p.team!=null)w(`${p.name} is a free agent and on a roster`);
 });
 bb.players.forEach(p=>{
   if(p.team!=null&&held.get(p.id)!==p.team)w(`${p.name} is orphaned from ${p.team}`);
   if(p.team==null&&!bb.fa.includes(p.id))w(`${p.name} is clubless and outside the pool`);
   if(p.age<18||p.age>36)w(`${p.name} is ${p.age}`);
 });
}
function bbRepair(){
 // Production self-heal. Mirrors repairWorld: never throws, logs what it moved.
 const bb=G.bb;if(!bb)return;
 bbReindex();
 const held=new Map();
 bb.teams.forEach(t=>{
   if(!Array.isArray(t.roster))t.roster=[];
   t.roster=t.roster.filter(id=>bb.idx.has(id)&&!held.has(id)&&held.set(id,t.id));
   t.roster.forEach(id=>{bb.idx.get(id).team=t.id});
 });
 bb.players.forEach(p=>{if(p.team!=null&&held.get(p.id)!==p.team)p.team=null;});
 bb.fa=bb.fa.filter(id=>bb.idx.has(id)&&bb.idx.get(id).team==null);
 bb.players.forEach(p=>{if(p.team==null&&!bb.fa.includes(p.id))bb.fa.push(p.id);});
 bbFillRosters(bb.teams.map(t=>t.id),false);
}

const PRESTIGE_MAX=100;
function conradFloor(t){
 // A recent Conrad Cup is the strongest single prestige signal there is, and it holds
 // its floor against seasonal decay. It is not, on its own, a claim to being the most
 // prestigious club in the world.
 //
 // The floor used to be flat: one win pinned any club to 82, two to 92. A club that had
 // never won anything could fluke a continental night and wake up ranked first on Earth,
 // which is not how standing works. A one-off winner is a famous club now; the clubs
 // above it are the ones that have been winning things for years. So the floor is
 // anchored to the resume the club already had, and the crown lifts it from there.
 if(!t)return 0;
 const all=(G.cups.continental||[]).filter(e=>e.winner===t.name&&e.region===t.region);
 const recent=all.filter(e=>e.season>=G.season-3).length;
 if(!recent)return 0;
 const resume=(t.leagueTitles||0)*2+(t.cupTitles||0)*1.5+all.length*6;
 const base=recent>=2?70:58;
 return clamp(base+resume,0,recent>=2?92:82);
}
function updatePrestige(RT){
 // everything decays a little each season, so past glory fades without new results
 G.teams.forEach(t=>{t.prestige=Math.max(0,(t.prestige||0)*0.94);});
 REGIONS.forEach(r=>{
   RT[r.key].forEach((tbl,tier)=>{
     const weight=[1,0.5,0.25][tier];
     tbl.forEach((t,rank)=>{
       let gain=0;
       if(rank===0)gain=12*weight;            // champions
       else if(rank===1)gain=7*weight;
       else if(rank<PER_TIER/2)gain=3*weight; // respectable top half
       else if(rank>=PER_TIER-2)gain=-2;      // relegation form hurts everywhere
       t.prestige=clamp((t.prestige||0)+gain,0,PRESTIGE_MAX);
     });
   });
 });
 // regional cup winner
 if(G.cup&&G.cup.winner!==null&&T(G.cup.winner))
   T(G.cup.winner).prestige=clamp((T(G.cup.winner).prestige||0)+6,0,PRESTIGE_MAX);
 // recent continental champions hold their floor against decay
 G.teams.forEach(t=>{const fl=conradFloor(t);if((t.prestige||0)<fl)t.prestige=fl;});
}

function sparkline(vals,h){
 if(!vals||vals.length<2)return"";
 const w=240,ht=h||42,max=Math.max(...vals),min=Math.min(...vals),rng=Math.max(1,max-min);
 const pts=vals.map((v,i)=>{
   const x=(i/(vals.length-1))*w;
   const y=ht-4-((v-min)/rng)*(ht-8);
   return x.toFixed(1)+","+y.toFixed(1);}).join(" ");
 const last=vals[vals.length-1],lx=w,ly=(ht-4-((last-min)/rng)*(ht-8)).toFixed(1);
 return `<svg viewBox="0 0 ${w} ${ht}" width="100%" height="${ht}" preserveAspectRatio="none" style="display:block">
   <polyline points="${pts}" fill="none" stroke="var(--honey)" stroke-width="2" vector-effect="non-scaling-stroke"/>
   <circle cx="${lx-2}" cy="${ly}" r="3" fill="var(--honey2)"/></svg>`;
}

function simulateRegionalCup(regionKey,RT){
 // Quick single-elimination for non-user regions so cupTitles stay accurate.
 // 30 clubs → seed by position points, run knockout rounds to a winner.
 const clubs=[];
 // Belt and braces: RT is a snapshot, so verify each entry is still a live club.
 [0,1,2].forEach(tier=>RT[regionKey][tier].forEach((t,i)=>{
   if(!t||!T(t.id))return;
   clubs.push({t:T(t.id),seed:t.st.Pts+(2-tier)*100});}));
 clubs.sort((a,b)=>b.seed-a.seed);
 let alive=clubs.map(c=>c.t);
 // pad to next power of 2 with byes (already 30, so 32 with 2 byes)
 while(alive.length<32)alive.push(null);
 while(alive.length>1){
   const next=[];
   for(let i=0;i<alive.length;i+=2){
     const h=alive[i],a=alive[i+1];
     if(!h){next.push(a);continue}if(!a){next.push(h);continue}
     const hxi=squadOf(h).filter(p=>p&&p.inj<=0&&!p.susp).slice(0,11);
     const axi=squadOf(a).filter(p=>p&&p.inj<=0&&!p.susp).slice(0,11);
     if(!hxi.length){next.push(a);continue}if(!axi.length){next.push(h);continue}
     let[hg,ag]=simMatch(hxi,axi,NEU,NEU,teamBoost(h.id),teamBoost(a.id),1.5);
     if(hg===ag){Math.random()<.5?hg++:ag++;}
     next.push(hg>=ag?h:a);
   }
   alive=next;
 }
 const winner=alive[0];if(!winner)return;
 winner.cupTitles=(winner.cupTitles||0)+1;
 winner.prestige=clamp((winner.prestige||0)+6,0,PRESTIGE_MAX);
 G.cups.regional.push({season:G.season,region:regionKey,winner:winner.name});
 return winner;
}

 return qualifiers;
}
/* ---- The Super Cup: the four regional cup winners, played after the Conrad Cup ----
   Two rounds, four clubs, and the same round-by-round experience a president gets in
   the Conrad Cup when he qualifies for it. */
const SUPER_CUP="May 1st Cup";
const SUPER_ROUNDS=["Semifinal","Final"];
const SUPER_PRIZE=[700000,1400000];
const SUPER_TITLE_BONUS=2000000;
/* The regional cup winners have to exist BEFORE endSeason, because the Super Cup is
   played while the season's clubs are still in their season's places. Resolved once,
   cached against the season, and reused by endSeason so no cup is ever run twice. */
function ensureRegionalWinners(){
 if(G.regionalWinners&&G.regionalWinners.season===G.season)return G.regionalWinners;
 const RT={};REGIONS.forEach(r=>RT[r.key]=[0,1,2].map(tier=>standingsOf(r.key,tier)));
 const ureg=userRegionKey();
 const byRegion={};
 REGIONS.forEach(r=>{
   if(r.key===ureg){
     const w=G.cup&&G.cup.winner!=null?G.cup.winner:null;
     if(w!=null&&T(w)){
       T(w).cupTitles=(T(w).cupTitles||0)+1;
       G.cups.regional.push({season:G.season,region:r.key,winner:T(w).name});
       if(w===G.userTeam)creditPresident("cup");
     }
     byRegion[r.key]=w;
   }else{
     const win=simulateRegionalCup(r.key,RT);
     byRegion[r.key]=win?win.id:null;
   }
 });
 G.regionalWinners={season:G.season,byRegion};
 return G.regionalWinners;
}
function superQualifiers(){
 const w=ensureRegionalWinners();
 return REGIONS.map(r=>w.byRegion[r.key]).filter(id=>id!=null&&T(id));
}
function superPlayRound(st){
 if(st.finished)return;
 if(!st.userOut&&G.coachAuto&&coachTier()>0){coachRunSetup();G._coachPlanKey=coachPlanKey();}
 const rn=SUPER_ROUNDS[Math.min(st.round,SUPER_ROUNDS.length-1)];
 st.lastRound={name:rn,lines:[]};
 const next=[];
 for(let i=0;i<st.alive.length;i+=2){
   const h=st.alive[i],a=st.alive[i+1];
   if(a==null){next.push(h);continue;}          // odd field: a bye rather than a crash
   let[hg,ag]=simMatch(teamXI(h),teamXI(a),teamTac(h),teamTac(a),teamBoost(h),teamBoost(a),0);
   let pens=false;if(hg===ag){pens=true;if(Math.random()<.5)hg++;else ag++;}
   const wnr=hg>ag?h:a;next.push(wnr);
   const line=`${T(h).name} ${hg}\u2013${ag} ${T(a).name}${pens?" (pens)":""}`;
   st.log.unshift({round:rn,line});
   st.lastRound.lines.push({line,user:h===G.userTeam||a===G.userTeam,won:wnr===G.userTeam});
   if(h===G.userTeam||a===G.userTeam){
     if(wnr===G.userTeam){const pr=IN(SUPER_PRIZE[Math.min(st.round,SUPER_PRIZE.length-1)]);
       T(G.userTeam).budget+=pr;logAdd(`${SUPER_CUP}: won a ${rn}.`,pr);}
     else{st.userOut=true;logAdd(`${SUPER_CUP}: knocked out in the ${rn}.`);}
   }
 }
 st.alive=next;st.round++;
 if(st.alive.length<=1)superFinish(st);
}
function superFinish(st){

function simNations(A,B){
 const diff=A.rating-B.rating;
 const xgA=clamp(1.3*Math.exp(diff/20),.1,6),xgB=clamp(1.3*Math.exp(-diff/20),.1,6);
 let ga=poisson(xgA),gb=poisson(xgB),pens=false;
 if(ga===gb){pens=true;if(Math.random()<1/(1+Math.exp(-diff/8)))ga++;else gb++;}
 return{ga,gb,pens};
}
const WC_XP_CAP=3;              // most a player can gain from one tournament
function awardXP(p,amt){

 let left=scaled;const order=shuffle(attrsFor(p.pos).slice());
 for(const a of order){if(left<=0)break;const add=Math.min(left,1);p[a]=clamp(p[a]+add,18,99);left-=add;}
 setOvr(p);p.value=valueOf(p);
 if(p.team==null||inAcademy(p))p.wage=freeAgentWage(p);   // contracted seniors keep their agreed wage
}

function runTippyCup(){

 if(teams.length<2)return;

 teams.forEach(n=>{squads[n.country]=n.squad.map(p=>p.id);n.squad.forEach(p=>gamesPlayed[p.id]=0);
   n.core=n.squad.slice(0,14).map(p=>p.id);});

 // seed 1v4, 2v3 when a full field of four is available
 let alive=teams.length>=4?[teams[0],teams[3],teams[1],teams[2]]:shuffle(teams.slice());

 while(alive.length>1){
   const rn=roundName(alive.length);const next=[];
   if(alive.length===2)finalists=alive.map(n=>n.country);

     (B.core||[]).forEach(id=>gamesPlayed[id]=(gamesPlayed[id]||0)+1);
     const{ga,gb,pens}=simNations(A,B);

   }

 }
 const champ=alive[0].country;

/* ======================= THE INNOVATION LAB =======================
   A president with more money than problems is a president with nothing to do, and the
   late game of a management sim always ends the same way: a bank balance that no longer
   means anything. This is the answer. Every close season the club is offered a short
   menu of research projects - real money, real years, and a real chance the whole thing
   comes to nothing. They are not upgrades you buy. They are bets you place.

   What makes them worth the risk is that a project which lands does not pay a dividend,
   it changes a RULE. Your injuries heal faster forever. Your academy screens for ceiling
   instead of ability. You can read the potential of every player alive without paying a
   scout. The money is gone either way; what you are buying is a permanent structural
   edge over ninety clubs who do not have one.

   Failure is the point. A guaranteed purchase is a shop, not a gamble, and a shop does
   not make a currency mean anything. Each failed attempt raises the price of trying that
   project again by a quarter, so chasing a moonshot you keep missing gets genuinely
   expensive - which is exactly the shape of real research spending. */

/* Odds are deliberately long and they get longer as the prize gets bigger: the cheapest
   project on the board is under a third, and the one that would change your academy
   forever is one in eight. A moonshot you can expect to land is not a moonshot, it is a
   purchase, and a purchase does not make a bank balance mean anything. What a president
   is owed in exchange for those odds is complete information BEFORE he commits: every
   project states its exact effect as a number, its exact price, its exact duration and
   its exact chance. The gamble should be honest, not obscure. */
const RND_OFFER_COUNT=3;
function rndState(){
 if(!G.rnd)G.rnd={done:{},failed:{},active:[],offers:[],history:[]};
 if(!G.rnd.done)G.rnd.done={};
 if(!G.rnd.failed)G.rnd.failed={};
 if(!Array.isArray(G.rnd.active))G.rnd.active=[];
 if(!Array.isArray(G.rnd.offers))G.rnd.offers=[];
 // A permanent record of every project ever commissioned and how it turned out. A
 // failure used to leave one line in the finance log and nothing else, so a president
 // could sink hundreds of millions into the lab across a career with no way to look
 // back at what he had bought and what had burned.
 if(!Array.isArray(G.rnd.history)){
   G.rnd.history=[];
   // backfill for careers that predate the record: successes carry their season,
   // failures only ever stored a count, so those are logged without one
   Object.keys(G.rnd.done).forEach(k=>{
     if(RND_PROJECTS[k])G.rnd.history.push({key:k,season:G.rnd.done[k],ok:true,cost:null});
   });
   Object.keys(G.rnd.failed).forEach(k=>{
     if(!RND_PROJECTS[k])return;
     for(let i=0;i<G.rnd.failed[k];i++)G.rnd.history.push({key:k,season:null,ok:false,cost:null});
   });
   G.rnd.history.sort((a,b)=>(a.season||0)-(b.season||0));
 }
 return G.rnd;
}
/* Everything the president has ever spent in the lab, and what he got for it. */
function rndLedger(){
 const h=rndState().history;
 let spent=0,landed=0,burned=0,known=0;
 h.forEach(e=>{
   if(e.cost!=null){spent+=e.cost;known++;if(!e.ok)burned+=e.cost;}
   if(e.ok)landed++;
 });
 return{spent,landed,burned,attempts:h.length,costKnown:known};
}
function hasRnD(key){const r=G&&G.rnd;return !!(r&&r.done&&r.done[key]);}
function rndActive(key){return rndState().active.some(a=>a.key===key);}
/* Each failure makes the next attempt at that project a quarter dearer. */
/* Expected total spend before a project lands, counting the attempts that fail AND the
   fact that each failure raises the price of the next go. The old cost/chance formula
   assumed every attempt cost the same, which understated the 12% projects by ~60%. */
function rndExpectedSpend(key){
 const p=RND_PROJECTS[key];if(!p)return 0;
 const chance=clamp(p.chance,0.001,1);
 const fails0=Math.min(6,(rndState().failed[key]||0));
 let e=0,surv=1;
 for(let n=0;n<400;n++){
   const step=Math.min(6,fails0+n);
   e+=surv*IN(Math.round(p.cost*Math.pow(1.12,step)));
   surv*=(1-chance);
   if(surv<1e-9)break;
 }
 return Math.round(e);
}
function rndCost(key){
 const p=RND_PROJECTS[key];if(!p)return 0;
 // Each failure raises the price of trying again, but gently and with a ceiling: with
 // odds this long a president will fail often, and compounding a quarter each time
 // would price a determined one out of his own research department by the third go.
 const fails=Math.min(6,(rndState().failed[key]||0));
 return IN(Math.round(p.cost*Math.pow(1.12,fails)));
}
function rndDrawOffers(){
 const r=rndState();
 const pool=Object.keys(RND_PROJECTS).filter(k=>!r.done[k]&&!rndActive(k));
 r.offers=shuffle(pool.slice()).slice(0,RND_OFFER_COUNT);
}

   game's own configuration and starving the transfer market to do it. */
function cullSurplusPlayers(){

 G.teams.forEach(t=>{t.squad.forEach(id=>held.add(id));(t.academy||[]).forEach(id=>held.add(id));});
 const cuttable=G.freeAgents.map(P).filter(p=>p&&!held.has(p.id))
   .sort((a,b)=>(b.age-a.age)||(a.ovr-b.ovr));   // oldest, weakest first

 if(!cut.size)return 0;

/* ======================= THE TRANSFER MARKET =======================
   The old model was linear - OVR times a million - with a flat \u00A3200M FLOOR under
   anyone carrying a Marquee badge. That floor was the whole problem. It meant an
   eighty-five rated forward with one Golden Boot and a twenty-two year old with a
   promising couple of seasons both priced identically to the best player on earth,
   because the badge was binary and the floor did not care what was behind it. Buy a
   cheap prospect, wait for the badge, sell for three hundred million. That is not a
   transfer market, it is a printing press.

   So: no floor, and a curve instead of a line. Each point of OVR is worth about 12.7%
   more than the last, which means the money bunches at the very top exactly as it does
   in reality - a squad player is cheap, a very good player is expensive, and the best
   player alive is in a bracket of his own. Fame is a multiplier on top rather than an
   override, worth up to a third extra, because a famous player genuinely does sell
   shirts. And there is a hard ceiling on the whole thing: the record fee, which rises
   with inflation and nothing else. Nobody is ever worth more than the record. */
const XFER_ANCHOR=20000000;    // what a 75-rated player costs
const XFER_K=0.12;             // each OVR point above him is ~12.7% dearer
const XFER_RECORD=225000000;   // the world record fee, in season-1 money
function marketRating(p){
 // What the market is actually buying: what he is now, plus a hard-headed discount on
 // what he might become. Used for pricing AND for deciding who ends up where, so a
 // sixteen-year-old with a ninety-eight ceiling is never mistaken for a spare part.
 if(!p)return 0;
 const gap=Math.max(0,effPot(p)-p.ovr);
 const yrs=Math.max(0,24-p.age)/8;                 // credit only for time to realise it
 return p.ovr+gap*clamp(yrs,0,1)*0.55;
}
function transferFee(p){
 if(!p)return 0;
 let fee=XFER_ANCHOR*Math.exp(XFER_K*(p.ovr-75))*inflIndex();
 // Age: the same rating is worth far more with a decade ahead of it than behind it.
 if(p.age<=21)fee*=1.30; else if(p.age<=25)fee*=1.12; else if(p.age<=29)fee*=1.0;
 else if(p.age<=32)fee*=0.78; else if(p.age<=35)fee*=0.55; else fee*=0.38;
 // Ceiling, priced properly rather than as a flat 15% nod. A big gap on a young player
 // is most of what you are paying for, and it is why prospects are not cheap any more.
 const gap=Math.max(0,effPot(p)-p.ovr);
 if(p.age<24&&gap>0)fee*=1+Math.min(0.95,gap*0.045);
 // the selling club's identity moves the asking price
 const seller=p.team!=null?T(p.team):null;
 if(seller&&seller.id!==G.userTeam){
   if(seller.trait==="selling")fee*=0.75;          // motivated seller
   if(seller.trait==="hoarder")fee*=1.65;          // will not be moved cheaply
   if(seller.trait==="youth"&&p.age<24)fee*=1.35;  // protects its prospects
 }
 // Fame is a premium, not an override: a household name sells shirts and shifts tickets.
 fee*=1+clamp((fameOf(p)-50)/50,0,1)*0.33;
 fee=Math.min(fee,IN(XFER_RECORD));                // nobody beats the record
 return Math.max(IN(400000),Math.round(fee/100000)*100000);
}
/* A free agent costs no transfer fee, only the cost of persuading him to come: an
   agent's cut and a signing bonus. It is a modest discount on the same market price
   rather than a separate, much cheaper price list - which is what turned the free
   agent screen into a shop full of underpriced prodigies you could flip for ten times
   the money. The real cost of a free agent was always meant to be his WAGE, not his
   fee, and freeAgentWage already makes a famous one the best paid man at the club. */
function freeAgentFee(p){return Math.max(IN(200000),Math.round(transferFee(p)*0.75/100000)*100000);}

function aiTransferPower(t){

 const sq=squadOf(t).filter(Boolean).sort((a,b)=>a.ovr-b.ovr);
 const spare=Math.max(0,sq.length-SQUAD_MIN);

   the free-agent pool, so the world keeps moving instead of quietly breaking the cap. */
function aiFundAndMakeRoom(t,exceptId){

 while((t.budget<0||t.squad.length>SQUAD_MAX)&&t.squad.length>SQUAD_MIN&&guard++<8){
   const keepers=squadOf(t).filter(x=>x&&x.pos==="GK").length;

     .filter(p=>p.id!==exceptId&&(p.pos!=="GK"||keepers>2))
     .sort((a,b)=>a.ovr-b.ovr)[0];

function genOffers(){
 // AI bids for your players, a fresh batch every day of the window. Rivals shop the
 // whole squad, not just the headline names, and they pay market price. A bidder must
 // be able to fund the deal and must actually be getting an upgrade in that position.
 G.offers=[];const t=userTeamObj();if(!t)return;
 const squad=squadOf(t).filter(Boolean);
 if(!squad.length)return;
 // Bids keep arriving even when the squad is at the floor: rivals do not know or care
 // that you cannot sell. The window screen greys those offers out instead of hiding them.
 /* Nobody bids for a man who signed five minutes ago. Without this, the loop was:
    sign an underpriced free agent, collect a nine-figure bid the same window, repeat
    until rich. A player has to have actually played for you before rivals want him. */
 const settled=squad.filter(p=>p.joined==null||G.season-p.joined>=1);
 const targets=shuffle(settled.slice()).slice(0,10);
 if(!targets.length)return;
 const want=ri(2,4);                          // 2-3 offers on a typical day, 4 on a busy one
 for(const p of targets){
   if(G.offers.length>=want)break;
   const base=transferFee(p);
   const premium=isUnhappy(p)?rnd(.55,.75):rnd(.95,1.45);   // agitators fetch less
   const fee=Math.round(base*premium);
   const pool=G.teams.filter(x=>x.id!==G.userTeam&&x.tier<=p_tierPref(p)
     &&aiTransferPower(x)>=fee
     &&squadOf(x).filter(Boolean).some(q=>q.pos===p.pos&&q.ovr<p.ovr-1));
   const buyer=pick(pool);
   if(!buyer)continue;
   G.offers.push({pid:p.id,from:buyer.id,fee});
 }
}

/* Scans every price and returns the one that maximises gate revenue for a given
   fixture (attendance falls as the price rises, so there is a revenue-maximising
   point). Restores G.ticketPrice before returning. */
function ticketMax(){return Math.max(500,IN(500));}
function optimalTicketPrice(t,oppId,cupStage){
 // The revenue optimum sits at the clearing price (up to ~\u00A3450 on the biggest nights),
 // so scan the full manual range to catch every case.
 // Coarse sweep then a fine pass around the winner: the manual range grows with
 // inflation, so a naive £1 scan would run thousands of attendance simulations a render.
 const save=G.ticketPrice,hi=ticketMax();let best=save,bestRev=-1;
 const step=Math.max(1,Math.round(hi/120));
 for(let p=5;p<=hi;p+=step){G.ticketPrice=p;const rev=attendance(t,oppId,cupStage)*p;
   if(rev>bestRev){bestRev=rev;best=p;}}
 for(let p=Math.max(5,best-step);p<=Math.min(hi,best+step);p++){G.ticketPrice=p;
   const rev=attendance(t,oppId,cupStage)*p;
   if(rev>bestRev){bestRev=rev;best=p;}}
 G.ticketPrice=save;return best;
}
function applyTicketManager(oppId,cupStage){

 const t=userTeamObj();if(!t)return;

/* $ used to return only firstElementChild, so any template with two or more top-level
   elements silently lost everything after the first. That is why the Innovation Lab
   cards showed a project name and nothing else, and why the details overlay printed
   "If it works" with no effect under it: the sibling divs were being thrown away at
   build time. Multi-root templates now come back as a fragment, which appendChild
   expands in place. Single-root callers keep the element they have always had. */
const $=(h)=>{const d=document.createElement("div");d.innerHTML=h;
 if(d.children.length<2)return d.firstElementChild;
 const f=document.createDocumentFragment();while(d.firstChild)f.appendChild(d.firstChild);
 return f};

       <div class="small muted" style="margin-top:4px">Contested by the regional cup winners: ${names}. Win your regional cup to take part.</div></div></div>`));

 }
 if(live.lastRound){

 }
 const rn=SUPER_ROUNDS[Math.min(live.round,SUPER_ROUNDS.length-1)];
 const dc=$(`<div class="card"></div>`);
 dc.appendChild($(`<h3 style="font-size:15px;margin-bottom:6px">${SUPER_CUP} ${rn} draw</h3>`));
 for(let i=0;i<live.alive.length;i+=2){

/* The Ingalls Cup phase of the season-over screen. Last of the three, and built to the
   same shape as the Conrad and Super Cup phases on purpose: a draw you can read, one
   round per tap, your tie highlighted, then the advance button. A president who owns a
   franchise gets the same tension on the hardwood he gets on the pitch. */
function hoopsPhase(w,advance){
 const nextBtn=()=>{const b=$(`<button class="btn cont">Advance to Season ${G.season+1}</button>`);
   b.onclick=advance;w.appendChild(b);};
 if(!G.bb||G.bb.userTeam==null){nextBtn();return;}
 const live=G.bbLive;
 const mine=G.bb.userTeam;
 const nm=id=>{const t=bbT(id);return t?bbTeamName(t):"\u2014";};

 if(!live){
   const field=bbCupField();
   const inCup=field.includes(mine);
   const f=bbMine(),pos=bbStandings().findIndex(x=>x.id===mine)+1;
   if(inCup){
     w.appendChild($(`<div class="card center" style="border-color:var(--honey)">
       <b class="gold">${bbTeamName(f)} are in the ${BB_CUP}!</b>
       <div class="small muted" style="margin-top:4px">Finished ${ordinal(pos)} of ${BB_TEAMS} at ${f.w}-${f.l}, seeded ${field.indexOf(mine)+1}. Eight franchises, three knockout rounds.</div></div>`));
     const b=$(`<button class="btn cont">Go to the ${BB_CUP} draw</button>`);

       <b>${bbTeamName(f)} missed the ${BB_CUP}.</b>
       <div class="small muted" style="margin-top:4px">Finished ${ordinal(pos)} of ${BB_TEAMS} at ${f.w}-${f.l}. Only the top ${BB_CUP_FIELD} qualify. It will be simulated.</div></div>`));
     const b=$(`<button class="btn cont">Sim the ${BB_CUP}</button>`);
     b.onclick=()=>{bbRunCup();saveGame(true);render()};
     w.appendChild(b);
   }
   return;
 }
 if(live.lastRound){
   const rc=$(`<div class="card"></div>`);
   rc.appendChild($(`<h3 style="font-size:15px;margin-bottom:6px">${BB_CUP} ${live.lastRound.name} results</h3>`));
   rc.appendChild($(live.lastRound.lines.map(l=>
     `<div class="logline" ${l.user?`style="border-left:3px solid ${l.won?'var(--win)':'var(--loss)'};padding-left:7px"`:""}><span class="${l.user?'gold':''}">${l.line}</span></div>`).join("")));
   w.appendChild(rc);
 }
 if(live.finished){
   w.appendChild($(`<div class="card center" style="border-color:var(--honey)">
     <b class="gold">${live.alive[0]===mine?`CHAMPIONS of the ${BB_CUP}!`:`${nm(live.alive[0])} win the ${BB_CUP}.`}</b></div>`));
   nextBtn();return;
 }
 if(live.userOut){
   const b=$(`<button class="btn cont">Sim the rest of the ${BB_CUP}</button>`);
   b.onclick=()=>{while(!G.bbLive.finished)bbPlayRound(G.bbLive);saveGame(true);render()};
   w.appendChild(b);return;
 }
 const rn=BB_ROUNDS[Math.min(live.round,BB_ROUNDS.length-1)];
 const dc=$(`<div class="card"></div>`);
 dc.appendChild($(`<h3 style="font-size:15px;margin-bottom:6px">${BB_CUP} ${rn} draw</h3>`));
 let draw="";
 for(let i=0;i<live.alive.length;i+=2){
   const h=live.alive[i],a=live.alive[i+1];

   const sh=live.seedOf[h]+1,sa=a==null?null:live.seedOf[a]+1;
   draw+=`<div class="logline" ${isMine?'style="border-left:3px solid var(--honey);padding-left:7px"':''}>
     <span class="${isMine?'gold':''}"><span class="muted">${sh}</span> ${nm(h)}${a!=null?` vs ${nm(a)} <span class="muted">${sa}</span>`:" (bye)"}</span></div>`;
 }
 dc.appendChild($(draw));
 w.appendChild(dc);

 b.onclick=()=>{bbPlayRound(G.bbLive);
   const lr=G.bbLive.lastRound,m=lr&&lr.lines.find(l=>l.user);
   if(m)toast(m.won?(G.bbLive.finished?`CHAMPIONS! The ${BB_CUP} is yours!`:`Through! ${m.line}`):`Out. ${m.line}`);
   saveGame(true);render()};
 w.appendChild(b);
}

 // renders produced five different starting elevens, and an elite coach ran thousands
 // of tactical evaluations each time. The plan is now made at explicit moments

function cupRowForMark(mark){
 const ug=G.cup.userGames.find(g=>g.md===mark);
 const idx=CUP_GROUP_MARKS.indexOf(mark);
 const rname=idx>=0?grTag(idx):KO_NAMES[CUP_KO_MARKS.indexOf(mark)];
 if(ug&&ug.rest)return `<div class="fixt cupfixt"><span class="cupmark">CUP</span><span style="flex:1">${rname} \u00B7 bye week</span><span class="muted small">rest</span></div>`;
 if(ug){
   const opp=T(ug.opp).name;
   let right=`<span class="muted small">\u2014</span>`;
   if(ug.played){const cls=ug.gf>ug.ga?"res-w":ug.gf<ug.ga?"res-l":"res-d";
     right=`<span class="${cls} small" style="font-weight:700">${ug.gf}\u2013${ug.ga}${ug.pens?" p":""}</span>`;}
   return `<div class="fixt cupfixt"><span class="cupmark">CUP</span><span style="width:14px" class="small muted">${ug.home?'H':'A'}</span><span style="flex:1">${opp} \u00B7 ${ug.round}</span>${right}</div>`;
 }
 return `<div class="fixt cupfixt"><span class="cupmark">CUP</span><span style="flex:1" class="muted">${rname} \u00B7 you are not involved</span></div>`;
}

function leagueTable(regionKey,tier,mark){
 const tbl=standingsOf(regionKey,tier);
 const rows=tbl.map((tm,i)=>{
   const gd=tm.st.GF-tm.st.GA;
   let cls=tm.id===G.userTeam&&mark?"me ":"";
   // tier 0 is the top flight: nothing above it, so no green stripe there
   if(i<2&&tier>0)cls+="promo";else if(i>=8)cls+="releg";
   return `<tr class="${cls}"><td class="l muted">${i+1}</td><td class="l">${tm.name}${shoeMark(tm)}</td>`+
     `<td>${tm.st.P}</td><td>${tm.st.W}</td><td>${tm.st.D}</td><td>${tm.st.L}</td>`+
     `<td class="${gd>0?'res-w':gd<0?'res-l':''}">${gd>0?'+':''}${gd}</td>`+
     `<td class="gold"><b>${tm.st.Pts}</b></td></tr>`;
 }).join("");
 return $(`<div class="card" style="padding:8px 10px"><table><thead><tr>
   <th class="l">Pos</th><th class="l">Club</th><th>P</th><th>W</th><th>D</th><th>L</th>
   <th>GD</th><th>Pts</th></tr></thead><tbody>${rows}</tbody></table></div>`);
}

function signPlayer(p){
 const t=userTeamObj();
 if(inTheRed())return toast("Signings are frozen while the club is in the red.");
 const faFee=freeAgentFee(p);
 if(t.budget<faFee)return toast("Not enough in the budget.");
 if(t.squad.length>=SQUAD_MAX)return toast(`Squad is full (${SQUAD_MAX} max). Sell or release a player to make room.`);
 const askedWage=freeAgentWage(p);
 // A famous free agent's wage is the whole cost of the deal, so make the board test it
 // rather than only the (tiny) signing fee. This is the trade: no transfer fee at all,
 // but he walks in as the best paid player at the club by a distance.
 if(isMarquee(p)&&askedWage*SEASON_LEN>Math.max(t.budget,0)*2.5)
   return toast(`${p.name} wants ${money(askedWage)}/wk. Your board will not sanction it.`);
 t.budget-=faFee;
 movePlayerToClub(p,t);
 p.wage=askedWage;p.contract=newContractYears();delete p.demand;delete p.runningDown;
 markWagesDirty();
 if(isMarquee(p))logAdd(`${p.name} signs on a free \u2014 ${money(askedWage)}/wk makes him your highest earner.`);
 {const bs=G.badgeStats||(G.badgeStats={});
  bs.faSigns=(bs.faSigns||0)+1;if(bs.faSigns>=10)awardBadge("free_agent_king");
  bs.windowSigns=(bs.windowSigns||0)+1;if(bs.windowSigns>=5)awardBadge("window_warrior");
  if(p.region!==t.region)awardBadge("cross_region");
  if(G.superScout&&(G.superShort||[]).includes(p.id))awardBadge("chief_scout");}
 logAdd(`Signed ${p.name}.`,-faFee);
 toast(`Signed ${p.name} for ${money(faFee)}.`);squadCapNotice();saveGame(true);render();
}
function releasePlayer(p){
 const t=userTeamObj();
 if(!p||p.team!==G.userTeam)return;
 if(t.squad.length<=SQUAD_MIN)return toast(`Cannot go below ${SQUAD_MIN} players.`);
 if(p.pos==="GK"&&squadOf(t).filter(x=>x.pos==="GK").length<=2)return toast("Keep at least 2 keepers.");
 if(!confirm(`Release ${p.name}? They leave for free and their wage comes off the books.`))return;
 releasePlayerToPool(p);
 G.badgeStats=G.badgeStats||{};G.badgeStats.releasedThisSeason=true;
 logAdd(`Released ${p.name}.`);
 toast(`${p.name} released.`);saveGame(true);render();
}

/* The season advances from here as well as from Club, so a president running a
   basketball season does not have to leave the tab to move the week on. The complex
   season-end flow stays on Club and this hands off to it. */
function bbAdvanceCard(){
 const card=$(`<div class="card"></div>`);
 const t=userTeamObj();
 if(inWindow()){
   card.appendChild($(`<div class="row"><div class="lbl">Pre-season</div>
     <div class="small">Window day ${G.window.day} of 3</div></div>`));
   const b=$(`<button class="btn" style="margin-top:8px;margin-bottom:0">${G.window.day>=3?"Close the window and start the season":"Advance to window day "+(G.window.day+1)}</button>`);
   b.onclick=()=>advanceWindowDay();card.appendChild(b);
 }else if(G.pendingCup){
   const g=userCupTieAt(G.pendingCup);
   const rn=g?g.round:cupLabel(t.region)+" round";
   card.appendChild($(`<div class="row"><div class="lbl">${cupLabel(t.region)}</div>
     <div class="small">${g&&T(g.opp)?`${g.home?"Home":"Away"} vs ${T(g.opp).name}`:"\u2014"}</div></div>`));
   const b=$(`<button class="btn cup" style="margin-top:8px;margin-bottom:0">Play ${/^Group/.test(rn)?"":"the "}${rn}</button>`);
   b.onclick=()=>{playPendingCupRound();render()};card.appendChild(b);
 }else if(G.matchday<SEASON_LEN){
   const nx=upcomingFixture();
   card.appendChild($(`<div class="row"><div class="lbl">Football</div>
     <div class="small">${nx?`${nx.home?"Home":"Away"} vs ${nx.opp}`:"League bye"}</div></div>`));
   // one basketball game a week now, so the president's own fixture can be named
   const mf=bbMine();
   if(mf&&G.bb.sched&&G.bb.sched[G.bb.day]){
     const week=G.bb.sched[G.bb.day];
     const bits=[];
     week.forEach(round=>{
       const tie=round.find(([h,a])=>h===mf.id||a===mf.id);
       if(tie){const home=tie[0]===mf.id,opp=bbT(home?tie[1]:tie[0]);
         bits.push(`${home?"":"@ "}${opp?bbTeamName(opp):"\u2014"}`);}
     });
     if(bits.length)
       card.appendChild($(`<div class="row" style="margin-top:4px"><div class="lbl">${BB_LEAGUE}</div>
         <div class="small">${bits.join(" \u00b7 ")}</div></div>`));
   }
   const b=$(`<button class="btn league" style="margin-top:8px;margin-bottom:0">Play matchday ${G.matchday+1} of ${SEASON_LEN}</button>`);
   b.onclick=()=>{playMatchday();render()};card.appendChild(b);
 }else{
   card.appendChild($(`<div class="small muted">The regular season is over. The ${BB_CUP} is decided when you close the football season.</div>`));
   const b=$(`<button class="btn cont" style="margin-top:8px;margin-bottom:0">Go to the Club tab to finish the season</button>`);
   b.onclick=()=>{TAB="club";render()};card.appendChild(b);
 }
 return card;
}

/* The Office card. Before ownership this is the whole basketball surface: hire the
   agent, watch him work, then look at what he brings back. */
function bbAgentCard(){
 const bb=G.bb,t=userTeamObj();
 const card=$(`<div class="card"></div>`);
 card.appendChild($(`<h3 style="font-size:15px;margin-bottom:4px">Mercantile Agent</h3>`));
 if(!bb.agent){
   const ok=bbAgentGate();
   card.appendChild($(`<div class="small muted" style="margin-bottom:8px">Works the ${BB_LEAGUE} for a season, then brings back franchises that are actually for sale. He sits on the club wage bill at ${money(bbAgentWage())}/wk.</div>`));
   if(!ok){
     card.appendChild($(`<div class="small injtag">The ${BB_LEAGUE} deals with continental clubs. Reach 80 prestige or win the ${CONT_CUP} first.</div>`));
   }else{
     const b=$(`<button class="btn sm">Hire the agent \u00B7 ${money(bbAgentWage())}/wk</button>`);
     b.onclick=bbHireAgent;card.appendChild(b);
   }
   return card;
 }
 const cyc=bb.agentCycle;
 if(!cyc||cyc.phase==="evaluating"){
   card.appendChild($(`<div class="small muted" style="margin-bottom:8px">Out working the league. He will report at the end of the season with what is available.</div>`));
 }else{
   card.appendChild($(`<div class="small" style="margin-bottom:8px"><b class="gold">${cyc.offers.length} franchise${cyc.offers.length>1?"s":""}</b> on the block. Buy one, or wait a year for two more.</div>`));
   cyc.offers.forEach((o,i)=>{
     const fr=bbT(o.tid);if(!fr)return;
     const can=t.budget>=o.price;
     const box=$(`<div style="margin-bottom:8px;padding:8px;border:1px solid var(--line);border-radius:8px"></div>`);
     box.appendChild($(`<div class="row"><b class="gold">${bbTeamName(fr)}</b><span class="small ${o.grade==="contender"?"gold":"muted"}">${o.grade}</span></div>
       <div class="small muted" style="margin-top:3px">${fr.titles||0} ${BB_CUP}${(fr.titles||0)===1?"":"s"} \u00B7 roster rating ${o.talent} \u00B7 ${(fr.arena/1000).toFixed(0)}k arena</div>
       <div class="small muted" style="margin-top:3px">Wages you inherit: ${money(o.payroll)}/yr. Anything above ${money(bbCeiling())}/yr is taxed.</div>`));
     const b=$(`<button class="btn sm ${can?"":"sec"}" style="margin-top:8px">Buy \u00B7 ${money(o.price)}</button>`);
     b.disabled=!can;b.onclick=()=>bbBuyFranchise(i);
     box.appendChild(b);
     if(!can)box.appendChild($(`<div class="small injtag" style="margin-top:4px">Short by ${money(o.price-t.budget)}.</div>`));
     card.appendChild(box);
   });
 }
 const fb=$(`<button class="btn sm sec" style="margin-top:6px">Release the agent</button>`);
 fb.onclick=bbFireAgent;card.appendChild(fb);
 return card;
}

     `<td>${money(fee)}</td>`+
     `<td><button class="btn sm ${can?'':'sec'}" data-buy="${p.id}" ${can?'':'disabled'}>Buy</button></td></tr>`;
 }).join("");
 const rt=$(`<table><thead><tr><th class="l">Player</th><th></th><th>Age</th><th>OVR</th><th>POT</th><th>Fee</th><th></th></tr></thead><tbody>${rows}</tbody></table>`);
 rt.querySelectorAll("[data-buy]").forEach(b=>b.onclick=e=>{e.stopPropagation();buyPlayer(P(+b.dataset.buy))});
 wireNames(rt);rc.appendChild(rt);
 w.appendChild(rc);
}

/* boot */
if(loadGame()&&G.userTeam!==null){TAB="club";render()}
else{G=null;renderStart()}

/* The service worker is registered last and its failure is swallowed. It makes the
   game installable and playable offline; it is not allowed to be a reason the game
   does not start. */
if("serviceWorker" in navigator){
 addEventListener("load",()=>{
   navigator.serviceWorker.register("./sw.js").catch(()=>{});
 });
}
</script>
</body>
</html>
