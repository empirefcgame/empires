<style>

<body>
<div id="app"></div>
<script>
/* ========================================================================
   EMPIRE FC v4 — multi-region management sim
   3 regions (Deseret / Kauai / Brainrot) · 3 tiers x 10 clubs each
   ~720 players per region, self-renewing · geo names + 45 nationalities
   Regional cups · Conrad (continental) Cup · World Cup every 4 seasons
   Economy: gate, sponsors, merch, TV, stadium tiers · staff + Chief Scout
   Head coaches are individuals: name, age, tier, trait (what he optimizes FOR),
   contract, wage, prestige gate · market shared with AI clubs · compensation
   fees, sackings, renewals, retirement at 65, poaching, and trophy-driven growth
   Transfers across regions in a 3-day window · release players anytime
   Saves to this browser via localStorage (auto after each matchday)
   ======================================================================== */

const SAVE_KEY="empireFC2_v1";

/* ---------------- telemetry ----------------
   One funnel question matters right now: do people who are not friends and family
   start a career, and do they come back and finish seasons. That is a handful of
   milestone events, NOT one per matchday - an eighteen-round season would burn
   through any free analytics tier and tell us nothing we cannot infer from the
   season counter anyway.

   track() is deliberately incapable of breaking the game: no provider, no network,
   a blocked script or a thrown error all end the same way, silently. */
function track(name,data){
 try{
   if(typeof umami!=="undefined"&&umami&&umami.track)umami.track(name,data||undefined);
 }catch(e){}
}
/* localStorage is script-writable storage, which Safari clears after a period of
   inactivity and every browser may evict under pressure. A career is hours of work,
   so ask for the durable bucket. Granted silently on an installed PWA; on the open
   web it is a request, not a guarantee, which is exactly why Export still exists. */
function requestDurableStorage(){
 try{
   if(navigator.storage&&navigator.storage.persist&&navigator.storage.persisted){
     navigator.storage.persisted().then(already=>{if(!already)navigator.storage.persist();});
   }
 }catch(e){}
}
if(typeof navigator!=="undefined")requestDurableStorage();
/* ---- Empire FC 2: squad structure ----
   Senior squads are capped at 20 and every club runs an academy of up to 20 under-23s.
   Youth develop in the academy and must be promoted into a senior slot or moved on when
   they age out at 23, so talent flows through the club instead of being stockpiled. */
const SQUAD_MAX=20;      // senior squad cap
const SQUAD_MIN=12;      // cannot sell/release below this
const ACADEMY_MAX=20;    // academy cap
const ACADEMY_AGE=23;    // must leave the academy at this age
/* The old game throttled you to 2 approaches a day. In Empire FC 2 there is no cap on
   approaches at all: the real limiters are the 20-man squad, your budget, and the fact
   that a club which refuses you once is closed on that player for the season. Trade as
   hard as you like across the three days. offersMade is kept purely as a window tally. */
const rnd=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rnd(a,b+1));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const pick=a=>a[ri(0,a.length-1)];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=ri(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
/* Once the economy inflates and basketball franchises enter at ten figures, "£2751M"
   stops being a number anyone reads at a glance. Roll up to B and T at the thousand
   mark, trimming trailing zeros so £2.000B prints as £2B. */
const money=n=>{const s=n<0?'-':'';n=Math.abs(Math.round(n));
  const trim=v=>String(v).replace(/\.0+$/,'').replace(/(\.\d*[1-9])0+$/,'$1');
  if(n>=1e12)return s+'£'+trim((n/1e12).toFixed(3))+'T';
  if(n>=1e9)return s+'£'+trim((n/1e9).toFixed(3))+'B';
  if(n>=999500)return s+'£'+(n/1e6).toFixed(n>=1e7?0:1)+'M';   // 999999 must not print as £1000k
  if(n>=1e3)return s+'£'+Math.round(n/1e3)+'k';return s+'£'+n};

/* ======================= INFLATION =======================
   Football's economy does not stand still. Every season the whole world gets dearer:
   gates, sponsorship, TV, transfer fees, wages, construction. One index drives all of
   it, so the £40k/wk that made a man the best paid player in season 1 is a squad
   filler's money by season 15. Wages compound a little faster than prices, which is
   what happens in the real game and is what squeezes a club that stands still.
   A CONTRACTED player keeps the number he signed for. His pay only moves when the deal
   is renegotiated - that is what a contract is FOR - which means an old deal quietly
   becomes a bargain while every new signing costs more than the last one did. */
const INFL_BASE=0.048;        // long-run trend, about 4.8% a season
const INFL_WAGE_POW=1.10;     // wages compound a shade faster than prices
function inflIndex(){const v=(typeof G!=="undefined"&&G&&G.infl)||1;return (isFinite(v)&&v>0)?v:1;}
function inflWage(){return Math.pow(inflIndex(),INFL_WAGE_POW);}
function IN(x){return Math.round(x*inflIndex());}      // a cost or a revenue, in today's money
function INW(x){return Math.round(x*inflWage());}      // a wage, in today's money
function inflTick(){
 const rate=clamp(INFL_BASE+rnd(-0.020,0.032),0.005,0.12);
 G.inflRate=rate;
 G.infl=inflIndex()*(1+rate);
 (G.inflHist=G.inflHist||[]).push(+(G.infl).toFixed(4));
 if(G.inflHist.length>60)G.inflHist.shift();
}
function jetCost(){return IN(JET_COST);}
function jetMaintCost(){return IN(JET_MAINT);}
function supporterCost(){return IN(SUPPORTER_COST);}
function ticketMgrWage(){return IN(TICKET_MGR_WAGE);}
function superScoutCost(){return IN(SUPER_SCOUT_COST);}
function liaisonWage(){return IN(LIAISON_WAGE);}
function matchBetCap(){return IN(MATCH_BET_CAP);}
function inflPct(){return Math.round(((typeof G!=="undefined"&&G&&G.inflRate)||INFL_BASE)*1000)/10;}

/* ---- Region name pools ---- */
/* ===================== REGIONS · NAMES · COUNTRIES (v4) ===================== */
const REGIONS=[
 {key:"deseret",name:"Deseret",tiers:["Salt Lake","Nauvoo","Kirtland"]},
 {key:"kauai",name:"Kauai",tiers:["Poipu","Napali","Princeville"]},
 {key:"founders",name:"Brainrot",tiers:["Sigma","Rizzler","Chud"]},
 {key:"guarani",name:"Guaran\u00ed",tiers:["Por\u00e3","Mbyte","Yvy"]}];
const PER_TIER=10;                       // 10 clubs per tier, 30 per region
const TIER_GLYPH=["\u2600","\u263D","\u2726"];
const TIER_CLS=["tier0","tier1","tier2"];
function regionOf(key){return REGIONS.find(r=>r.key===key);}
function tierName(regionKey,tier){return regionOf(regionKey).tiers[tier];}

const REGION_CLUBS={
 deseret:["Zarahemla City","Nauvoo United","Zion FC","Deseret Saints","Cumorah Athletic",
  "Bountiful Rovers","Kirtland Town","Nephi Wanderers","Manti United","Palmyra FC",
  "Moroni City","Jershon Athletic","Lehi Rovers","Melek Town","Gideon FC",
  "Ammonihah City","Arches City","Temple FC","Far West Athletic","Harmony Rovers",
  "Nephihah United","Tabernacle FC","Salt City","Snow United","Shemlon Town",
  "Amulon Wanderers","Ishmael City","Sam Hayes United","FC Beck","Lowen Athletic"],
 kauai:["Poipu Breakers","Koloa United","Lawai FC","Kalaheo City","Waikomo Rovers",
  "Spouting Horn AC","Kukuiula Town","Poipu Bay FC","Mahaulepu United","Brennecke FC",
  "Napali Cliffs","Hanalei Bay FC","Kalalau United","Haena City","Kee Beach Rovers",
  "Waimea Canyon FC","Kekaha Town","Polihale United","Kalihiwai FC","Anini Athletic",
  "Princeville FC","Hanalei United","Kilauea Town","Anahola Rovers","Kapaa City",
  "Wailua Falls FC","Lihue United","Nawiliwili FC","Kealia Athletic","Moloaa Town"],
 founders:["Tralalero FC","Bombardiro United","Tung Tung City","Cappuccino Rovers","Ballerina Athletic",
  "Lirili Larila FC","Chimpanzini United","Brr Patapim Town","Jimothy Fury","Trippi Troppi United",
  "Crocodilo FC","Sahur Rovers","Bananini City","Assassino United","Frigo Camelo FC",
  "Bombombini Town","Papas Gatatas United","Bri Bri FC","Glorbo Fruttodrillo City","Tigrullini Rovers",
  "Orcalero FC","Trulimero United","Bobrito Bandito Town","Matteo City","Cocofanto FC",
  "Ambalabu United","Pipi Kiwi Rovers","Tracotocutulo FC","Bikini Camanini","Zibra Zubra United"],
 /* Guaran\u00ed: Paraguayan towns up top, the wars in the middle, and the food and the
    folk monsters down in Yvy, the earth tier. Six clubs are named for things in and
    around Ayolas - the Yacyret\u00e1 dam, the do\u00e1rado run, the A\u00f1a Cu\u00e1 spillway, the
    Atinguy refuge, the workers' town and the river beach - so one corner of the map
    reads like a real place instead of a list. */
 guarani:["Asunci\u00f3n Athletic","Encarnaci\u00f3n United","Ciudad del Este FC","Yacyret\u00e1 FC","Villarrica Wanderers",
  "Concepci\u00f3n City","Lomito Arabe FC","\u00d1emby Town","Ytororo United","Juan de Ayolas",
  "Humait\u00e1 Rovers","Curupayty Athletic","Boquer\u00f3n United","Nanawa Town","Cerro Cor\u00e1 FC",
  "Piribebuy Wanderers","Yaguar\u00f3n Rovers","Paraguar\u00ed Athletic","Rio Paran\u00e1 City","Dorado Town",
  "Chipa Guasu FC","Mbej\u00fa Town","Vori Vori Rovers","Mandi'o Athletic","Terer\u00e9 City",
  "Kurup\u00ed Wanderers","Pombero Town","A\u00f1a Cu\u00e1 Rovers","Atinguy Athletic","Villa Permanente United"]};
const REGION_EXPANSION={
 deseret:["FC Red Rocks","Handcart Athletic","Grid City","Teancum City","Real Brigham","Desolation United","Jacob City","Railroad Racing","St. George United","SLCFC"],
 kauai:["Hanapepe FC","Eleele United","Kaumakani Town","Puhi FC","Omao Athletic","Kilohana United","Wailua Bay FC"],
 founders:["Rhino Toasterino FC","Cacto Hipopotamo United","Ballerino Lololo Town","Tric Trac Baraboom FC","Pomni Ananas United","Svinino Bombondino Town","Ecco Cavallo FC"],
 guarani:["Corate\u00ed City","Filadelfia Town","Trinidad Rovers","Salto del Guair\u00e1 FC","Jasy Jater\u00e9 Athletic"]};
const NAMES={
 /* Deseret's PLAYERS are named out of the Mighty Ducks: character names, the actors who
    played them, and the language of the rink itself. Firsts and lasts are drawn
    independently, so the pools cross-multiply into roughly three and a half thousand
    combinations - Fulton Quackenbush, Zamboni Conway, Charlie Knucklepuck - and a
    straight character name like Gordon Bombay turns up now and then as a happy
    accident rather than the rule. Real actors contribute surnames only. Mixing their

/* ======================= COACH RENEGOTIATION =======================

   something off you he comes back for a rise, and the bigger the trophy the bigger the
   ask - a continental crown makes him the most wanted man in the game and he knows it.
   Turning him down is allowed, and it costs nothing today. What it costs is later: a
   coach refused twice starts listening to the phone calls, and the clubs above you are
   always calling. Even a trophyless season produces a cost-of-living ask, because
   everything else in this world gets dearer every year and his wage should too. */
function coachTrophyDemand(){
 const c=G.coach;if(!c||G.coachRenewal)return;
 if((c.contract||0)<=0)return;            // an expiring deal is handled as a renewal
 const h=G.history[G.history.length-1]||{};
 const wonLeague=h.rank===1;
 const wonRegional=!!(G.cup&&G.cup.winner===G.userTeam);
 const wonConrad=!!(G.lastCont&&G.lastCont.season===G.season&&G.lastCont.winnerId===G.userTeam);
 const wonPromo=!!h.promo;
 const why=[];let mult=1;
 if(wonConrad){mult+=0.45;why.push(CONT_CUP);}
 if(wonLeague){mult+=0.28;why.push("the league");}
 if(wonRegional){mult+=0.20;why.push(cupName());}
 if(wonPromo&&!wonLeague){mult+=0.14;why.push("promotion");}
 const cola=(G.inflRate||INFL_BASE);
 if(!why.length){
   // No silverware: he asks only for the cost of living, and only if he is any good.
   if(c.tier<2||Math.random()<0.45)return;
   mult+=cola*1.4;
   G.coachRenewal={wage:capCoachDemand(Math.round(c.wage*mult/500)*500),years:Math.max(c.contract,2),
     kind:"trophy",why:"the rising cost of everything else"};
 }else{
   mult+=cola;
   // The very best know exactly what they are worth, and ask for it.
   if(c.tier===3)mult+=0.10;
   G.coachRenewal={wage:capCoachDemand(Math.round(c.wage*mult/500)*500),years:Math.max(c.contract,ri(2,3)),
     kind:"trophy",why:why.join(" and ")};
 }
 if(G.coachRenewal.wage<=c.wage){delete G.coachRenewal;return;}   // the ceiling swallowed it
 logAdd(`${c.name} wants his deal reopened after ${G.coachRenewal.why}. He is asking for ${money(G.coachRenewal.wage)}/wk.`);
}

function ovrFromAge(pot,age){
 const peak=27;let f;
 if(age<=peak)f=.60+.40*(age-16)/(peak-16);
 else f=1-.45*(age-peak)/(40-peak);
 return clamp(pot*f,20,99);}
function calcOvr(p){let o=0;for(const k in OVR_W[p.pos])o+=p[k]*OVR_W[p.pos][k];return Math.round(o);}
function makeAttrs(p){
 // Attributes are built from the player's EFFECTIVE ceiling, not his shown potential,
 // so a bust's metrics stay in line with his (capped) OVR instead of reading 90s while
 // the OVR sits at 57. For everyone else effPot === pot, so nothing changes.
 const base=ovrFromAge(effPot(p),p.age)-(TILT_BIAS[p.pos]||0),t=TILT[p.pos];
 for(const a of attrsFor(p.pos))p[a]=clamp(Math.round(base+t[a]+rnd(-6,6)),18,99);
 setOvr(p);}
function valueOf(p){
 let v=Math.pow(p.ovr/100,3)*42e6;
 if(p.age<24)v*=1.35;else if(p.age<30)v*=1.15;else if(p.age<34)v*=.75;else v*=.38;
 if(p.pot-p.ovr>10&&p.age<23)v*=1.35;
 v*=inflIndex();                                 // the whole market reprices every season
 return Math.max(IN(40000),Math.round(v/10000)*10000);}
/* A famous player is paid for being famous, not only for his current rating. This is
   what lets the three archetypes coexist on one formula: the prodigy is paid before he
   has produced, the peak star is paid for what he is, and the thirty-four-year-old whose
   OVR has collapsed to 73 is still paid like a superstar because the ground still fills
   when he plays. Ability sets the floor; fame can lift it several times over. */
function fameWageMult(p){
 const f=fameOf(p);
 if(f<FAME_MARQUEE)return 1;
 return 1+2.6*Math.pow((f-FAME_MARQUEE)/(100-FAME_MARQUEE),1.2);   // up to 3.6x at fame 100
}
function wageOf(p){
 // valueOf already carries base inflation; wages take the extra premium on top of it.
 const prem=inflWage()/inflIndex();
 const base=Math.max(INW(500),Math.round(valueOf(p)*.0006*prem/100)*100);
 return Math.max(INW(500),Math.round(base*fameWageMult(p)/100)*100);
}
/* Highest wage among CONTRACTED players. Free agents are deliberately excluded: their
   own demand is priced off this number, so counting them would let each famous free
   agent set a new ceiling that the next one prices off again, and the figure would
   run away to infinity over a long save. */
function topContractedWage(){
 // Keyed on a version counter that every transfer, release and wage change bumps.
 // The old season-matchday key never changed during a transfer day, so a wage that
 // rose from 26k to 2.64M mid-window kept returning the stale figure and underpriced
 // every Marquee and Icon free-agent demand made after it.
 const key=G.season+"-"+G.matchday+"-"+(G.wageVersion||0);
 if(G._topWage&&G._topWage.key===key)return G._topWage.v;
 let top=0;
 for(const q of G.players){if(q.team!=null&&(q.wage||0)>top)top=q.wage;}
 G._topWage={key,v:top};
 return top;
}
/* A famous player with no club is the best deal and the worst deal in football at the
   same time. He costs nothing to sign, and he knows it, so he asks to be the best paid
   man in the world. An Icon asks for more than that. */
function freeAgentWage(p){
 const base=wageOf(p);
 if(!isMarquee(p))return base;
 const top=topContractedWage();
 return Math.max(base,Math.round(top*(isIcon(p)?1.15:1.0)/100)*100);
}

let G=null;

const T=id=>_TI.get(id);

/* ---- academy helpers ---- */
function academyOf(t){return((t&&t.academy)||[]).map(P).filter(Boolean);}
function inAcademy(p){const t=p&&p.team!=null?T(p.team):null;return !!(t&&(t.academy||[]).includes(p.id));}
function academyFull(t){return((t&&t.academy)||[]).length>=ACADEMY_MAX;}
function squadFull(t){return((t&&t.squad)||[]).length>=SQUAD_MAX;}
function addToAcademy(t,p){
 if(!t.academy)t.academy=[];
 if(academyFull(t))return false;
 if(p.academyClubId==null){p.academyClubId=t.id;p.academyGraduate=false;}
 if(p.team!==t.id)joinClub(p,t.id);      // an academy spell counts as time at the club
 t.squad=t.squad.filter(id=>id!==p.id);
 if(!t.academy.includes(p.id))t.academy.push(p.id);
 p.team=t.id;return true;
}
function promoteFromAcademy(t,p){
 if(!t.academy)t.academy=[];
 if(squadFull(t))return false;
 t.academy=t.academy.filter(id=>id!==p.id);
 if(!t.squad.includes(p.id))t.squad.push(p.id);
 p.team=t.id;
 // The one and only place a player becomes an academy graduate. Badges used to infer
 // it from "first history entry matches this club", which every starting senior at
 // world generation also satisfies, so Class of the Academy unlocked with the original
 // eleven before a single prospect had come through.
 if(p.academyClubId===t.id)p.academyGraduate=true;
 return true;
}
function releaseFromAcademy(t,p){
 if(t.academy)t.academy=t.academy.filter(id=>id!==p.id);
 releasePlayerToPool(p);
}
/* ---- central player movement API ----
   Every arrival and departure runs through one of these three. Doing it by hand in a
   dozen feature-specific places is how a club ended up holding an id for a man who was
   no longer anywhere, and how a released player kept an open career spell that read as
   "still playing" on his card. One door in, one door out. */
function markWagesDirty(){G.wageVersion=(G.wageVersion||0)+1;delete G._topWage;}
function releasePlayerToPool(p){
 if(!p)return;
 joinClub(p,null);                                   // closes the open career spell
 detachPlayer(p);                                    // squad / academy / unhappy / freeAgents
 p.team=null;
 delete p.unhappySince;delete p.promised;
 if(G.xi)G.xi=G.xi.filter(id=>id!==p.id);
 if(!G.freeAgents.includes(p.id))G.freeAgents.push(p.id);
 markWagesDirty();
}
function movePlayerToClub(p,team,toAcademy){
 if(!p||!team)return false;
 joinClub(p,team.id);
 detachPlayer(p);
 p.team=team.id;
 if(toAcademy){team.academy=team.academy||[];if(!team.academy.includes(p.id))team.academy.push(p.id);}
 else if(!team.squad.includes(p.id))team.squad.push(p.id);
 delete p.unhappySince;delete p.promised;
 markWagesDirty();
 return true;
}
/* A club leaving the pyramid takes nobody with it. Its seniors AND its academy are
   returned to the pool with their spells closed, before the id is recycled by an
   incoming expansion club. */
function releaseClubPlayers(team){
 if(!team)return;
 const ids=[...(team.squad||[]),...(team.academy||[])];
 ids.forEach(id=>{const p=P(id);if(p)releasePlayerToPool(p);});
 team.squad=[];team.academy=[];team.unhappy=[];
}
/* A prospect his own club can't fit is not simply discarded: smaller clubs are glad of
   him. Find a club with a senior slot (or academy room if he is still young enough) and
   place him there, weakest-first so talent flows down the pyramid rather than vanishing.
   Falls back to free agency only if genuinely nobody has room. */
function placeReleasedYouth(p,fromId){
 if(!p)return null;
 // Position matters here. This used to place a released prospect at any club with a
 // free slot, so a keeper turned away by his own academy was immediately handed to
 // someone else who had no use for him either. A club already carrying three keepers
 // is not a suitor; if nobody needs him he becomes a free agent, as he should.
 const wants=G.teams.filter(b=>b.id!==fromId&&b.id!==G.userTeam&&!squadFull(b)
   &&!(p.pos==="GK"&&squadOf(b).filter(x=>x&&x.pos==="GK").length>=3))
   .sort((a,b)=>(a.prestige||0)-(b.prestige||0));   // weaker clubs get first pick
 const suitor=wants.find(b=>{
   if(b.trait==="local"&&p.region!==b.region)return false;
   return true;
 })||wants[0];
 if(!suitor)return null;
 movePlayerToClub(p,suitor);
 p.wage=wageOf(p);p.contract=newContractYears();
 markWagesDirty();
 return suitor;
}
function squadWage(t){return squadOf(t).reduce((s,p)=>s+p.wage,0);}
/* One gate calculation for every home fixture. Cup gates used to skip the Dynamic
   Pricing research bonus entirely, so a permanent 15% upgrade quietly stopped applying
   the moment the cup started, and sold-out and box-office badges saw different numbers
   depending on which competition was being played. */
function gateRevenue(att){return Math.round(att*G.ticketPrice*(hasRnD("pricing")?1.15:1));}
/* The soft population cap has to be derived from what the world can hold, not guessed.
   90 clubs at a 20-man senior cap is 1,800 held players before a single academy is
   counted, and academies refill toward 18 apiece. */
function playerPopulationTarget(){
 const clubs=(G.teams||[]).length||REGIONS.length*PER_TIER*3;
 return clubs*(SQUAD_MAX+ACADEMY_MAX-2)+clubs*4;
}
function staffWageOf(stars){return IN(STAFF_WAGE[stars]||0);}
function staffWage(){let s=0;for(const r in G.myStaff){const st=G.myStaff[r];if(st)s+=staffWageOf(st.stars)}
 if(G.scoutTier)s+=IN(SCOUT_TIERS[G.scoutTier].wage);
 if(G.superScout)s+=Math.round(superScoutCost()/SEASON_LEN); // £5M/yr over the season's matchdays
 if(G.ticketManager)s+=ticketMgrWage();
 {const ut=T(G.userTeam);if(ut&&ut.supporters)s+=Math.round(supporterCost()/SEASON_LEN);}
 if(G.liaison)s+=liaisonWage();

 if(G.coach)s+=G.coach.wage;
 return s;}

     capacity:Math.round(tier===0?rnd(15000,22000):tier===1?rnd(7000,11000):rnd(3000,5500)),
     stadiumLevel:0,building:0,leagueTitles:0,cupTitles:0,contTitles:0,superTitles:0,leagueTitleSeasons:[],
     supporters:false,jet:false,jetMaint:"none",facility:0,facilityMaint:"none",facilityBoughtSeason:0,sponsor:null,

   G.teams.push(t);return t;});
 G.nextTid=tid;

 for(const pos in tmpl){

function blankStd(){return{P:0,W:0,D:0,L:0,GF:0,GA:0,Pts:0}}

function makeFixtures(n){
 let arr=[...Array(n).keys()];if(n%2)arr.push(-1);
 const m=arr.length,rounds=[];
 for(let r=0;r<m-1;r++){
   const rd=[];
   for(let i=0;i<m/2;i++){
     const h=arr[i],a=arr[m-1-i];
     if(h!==-1&&a!==-1)rd.push(r%2?[a,h]:[h,a]);
   }
   rounds.push(rd);
   arr=[arr[0],arr[m-1],...arr.slice(1,m-1)];

/* ======================= SAVE / LOAD ======================= */
/* Most of a save is players, and most of a player is zeroes: a squad filler has never
   played at a World Cup, never won a league, never been booked. Dropping fields that
   are at their default and restoring them on the way back in cuts a long career's save
   by about a quarter, which matters because localStorage is a hard 5MB wall and an
   18-season world was already past 2.4MB and climbing.

   The flag below is what makes this safe: only a save that was WRITTEN compactly gets
   its defaults restored. A genuinely old save with a field missing still falls through
   to the original migration logic that derives a sensible value for it. */
const COMPACT_ZERO=["gs","gc","as","ac","susp","inj","wcWins","wcApps","tippyWins",
  "tippyApps","gbWins","fame","eliteYears","topYears","leagueWins","contWins","natCaps"];
const COMPACT_ZERO_SET=new Set(COMPACT_ZERO);
/* The old packer stringified the entire world, parsed the result back into a second
   complete object graph, mutated that copy and then stringified it again: three full
   passes over a couple of megabytes plus a throwaway clone of every player, team and
   fixture, on EVERY autosave. On a mature career that was over forty percent of the
   cost of playing a matchday.

   Only the player records are edited, and only by dropping keys, so a shallow copy of

/* An imported save is untrusted input. Every name in it is interpolated straight into
   innerHTML when rendered, so a hand-edited file could smuggle markup or an inline event
   handler into the header, a table or a toast. Nothing the game itself ever writes
   contains these characters, so stripping them on the way in is lossless. */
function scrubSaveStrings(o,depth){
 if(depth>12||o==null)return o;
 if(typeof o==="string")return o.replace(/[<>"&]/g,"").slice(0,400);
 if(Array.isArray(o)){for(let i=0;i<o.length;i++)o[i]=scrubSaveStrings(o[i],depth+1);return o;}
 if(typeof o==="object"){for(const k in o)o[k]=scrubSaveStrings(o[k],depth+1);return o;}
 return o;
}
function importSaveText(text){
 // Validate hard, then run the SAME hydrate path as a disk load. Returns
 // {ok:true} or {ok:false,msg}. Never eval; only JSON.parse. On any failure the
 // previous game is left untouched.
 let g;
 try{g=JSON.parse(text);}
 catch(e){return{ok:false,msg:"That file isn't valid JSON \u2014 not an Empire FC save."};}
 if(!g||typeof g!=="object")return{ok:false,msg:"That file isn't an Empire FC save."};
 if(g.ver!==4)return{ok:false,msg:"That save is from an incompatible version and can't be loaded."};
 scrubSaveStrings(g,0);                // untrusted file: strip anything that could inject markup
 expandCompactSave(g);                 // restore the fields compact serialization dropped
 // Same structural validator the disk load uses, so an imported file cannot get in
 // through a laxer door than the autosave does.
 try{validateSaveShape(g);}
 catch(e){return{ok:false,msg:"That save is inconsistent and can't be loaded safely."};}
 const backup=G;
 try{
   G=g;hydrateLoadedG();
   if(!userTeamObj()){G=backup;if(backup)rebuildIndex();return{ok:false,msg:"That save's club is missing and it can't be loaded."};}
 }catch(e){
   G=backup;if(backup)rebuildIndex();
   return{ok:false,msg:"That save couldn't be loaded \u2014 it may be corrupted."};
 }
 resetUiState();                       // stale tab/sort/world-view pointers belong to the old career
 saveGame(true);
 return{ok:true};
}
function triggerImport(onDone){
 // opens the system file picker filtered to JSON; reads and imports the choice
 const inp=document.createElement("input");
 inp.type="file";inp.accept="application/json,.json";inp.style.display="none";
 inp.onchange=()=>{
   const f=inp.files&&inp.files[0];
   try{inp.remove();}catch(e){}
   if(!f)return;
   const reader=new FileReader();
   reader.onload=()=>{
     const res=importSaveText(String(reader.result||""));
     if(res.ok){toast("Save imported.");(onDone||render)();}
     else toast(res.msg);
   };
   reader.onerror=()=>toast("Couldn't read that file.");
   reader.readAsText(f);
 };
 document.body.appendChild(inp);inp.click();
}
function doImport(){
 // confirm only when a real career is in progress (not on the fresh start world)
 const active=G&&G.userTeam!=null;
 if(active&&!confirm("Import a backup? This replaces your current career."))return;
 triggerImport(()=>{TAB="club";render();});
}

/* ======================= MATCH ENGINE ======================= */
function fit(list){return list.filter(p=>p.inj<=0&&(p.susp||0)<=0&&!p.natDuty);}
/* ======================= INTERNATIONAL DUTY =======================
   Football does not pause for your season. Every round one man from every club in the
   world is away with his country and cannot be picked, and it is not the reserve
   right-back it happens to: call-ups skew hard toward the best player available, so the
   pain lands on the men you actually need. The call-ups for the NEXT round are drawn as
   soon as the current one finishes, which is what makes them plannable - you can see
   who is missing before you set your side, and squad depth stops being decoration. */
function clearNatDuty(){G.players.forEach(p=>{if(p.natDuty)delete p.natDuty;});}
function assignNatDuty(){
 if(!G.teams)return;
 G.natDuty=[];
 G.teams.forEach(t=>{
   const pool=squadOf(t).filter(p=>p&&p.inj<=0&&(p.susp||0)<=0);
   if(pool.length<13)return;                 // a club already down to the bones is spared
   // weight by ability: internationals are internationals for a reason
   let tot=0;const w=pool.map(p=>{const v=Math.pow(Math.max(1,p.ovr-40),2.2);tot+=v;return v;});
   let r=Math.random()*tot,idx=0;
   for(let i=0;i<w.length;i++){r-=w[i];if(r<=0){idx=i;break;}idx=i;}
   const p=pool[idx];if(!p)return;
   p.natDuty=1;
   G.natDuty.push({club:t.id,pid:p.id});
   if(t.id===G.userTeam){
     p.natCaps=(p.natCaps||0)+1;
     logAdd(`${p.name} has been called up by ${p.nat||"his country"} and misses the next match.`);
   }else{p.natCaps=(p.natCaps||0)+1;}
 });
}
function userCallUps(){const t=userTeamObj();return t?squadOf(t).filter(p=>p&&p.natDuty):[];}
function averageRival(){
 // a league-average opponent from your own division, used to judge shape and dials
 const t=userTeamObj();
 const peers=tierClubs(t.region,t.tier).filter(id=>id!==G.userTeam).map(T).filter(Boolean);
 if(!peers.length)return{atk:60,def:60};
 let atk=0,def=0;
 peers.forEach(pt=>{const s=strength(autoXI(pt,"4-4-2"));atk+=s.atk;def+=s.def});
 return{atk:atk/peers.length,def:def/peers.length};
}
function nextOpponent(){
 // The actual next fixture: whichever of the league game or a cup tie plays first.
 // Returns {strength, tac, name, homeAdv, comp} or null in the off-season.
 // A deferred cup tie IS the next contest: the league round it shared a week with has
 // already been played, so the coach and the tactics screen must look at the cup.
 if(G.pendingCup){
   const pg=userCupTieAt(G.pendingCup);
   if(pg&&T(pg.opp))return{strength:strength(autoXI(T(pg.opp),"4-4-2")),tac:teamTac(pg.opp),
     name:T(pg.opp).name,homeAdv:pg.home?3:0,comp:"cup"};
 }
 if(G.matchday>=SEASON_LEN)return null;
 // league opponent this matchday
 let league=null;
 const t=userTeamObj(),tt=tierClubs(t.region,t.tier),li=tt.indexOf(G.userTeam);
 const fx=G.fixtures[G.matchday];
 for(const[i,j]of fx){if(i===li||j===li){
   const oppId=tt[i===li?j:i];
   league={id:oppId,home:i===li,comp:"league"};break;}}
 // cup tie attached to THIS matchday (plays right after it)
 let cup=null;
 if(G.cup&&G.cup.userGames){
   const g=G.cup.userGames.find(x=>!x.played&&!x.rest&&x.md===G.matchday+1&&x.opp!=null);
   if(g&&T(g.opp))cup={id:g.opp,home:g.home,comp:"cup"};
 }
 // the league game plays first on a shared matchday; prefer the nearer contest,
 // and when both exist the cup tie is the marquee game to prepare for
 const pickd=cup||league;
 if(!pickd||!T(pickd.id))return null;
 const opp=T(pickd.id);
 return{strength:strength(autoXI(opp,"4-4-2")),tac:teamTac(opp.id),
   name:opp.name,homeAdv:pickd.home?3:0,comp:pickd.comp};
}
function coachBestFormation(){
 // tier 2+: try every shape and keep the one that best serves what THIS coach
 // optimizes for. A Pragmatist keeps the ball out; an Idealist chases goals.
 const t=userTeamObj(),rival=averageRival(),neu={mentality:50,pressing:50,tempo:50,width:50,line:50};
 const c=G.coach,obj=coachObjective();
 let best=null;
 for(const f in FORMATIONS){
   if(c&&c.trait==="idealist"&&(f==="5-3-2"||f==="4-5-1"))continue;   // will not set up defensively
   const xi=autoXI(t,f);if(xi.length<11)continue;
   const[xh,xa]=xgPair(strength(xi),rival,neu,neu,teamBoost(G.userTeam),0,1.5);
   const s=obj(xh,xa);
   if(!best||s>best.s)best={f,s};
 }
 return best?best.f:G.formation;
}
function coachBestTactics(xi){
 // tier 3: search the dial space using the real match maths. A Tactician
 // prepares for the actual next opponent (their XI, their tactics, the venue);
 // every other coach tunes against a league-average rival.
 const c=G.coach;
 const nx=(c&&c.trait==="tactician")?nextOpponent():null;
 const rival=nx?nx.strength:averageRival();
 const rTac=nx?nx.tac:{mentality:50,pressing:50,tempo:50,width:50,line:50};
 const adv=nx?nx.homeAdv:1.5;
 const neu={mentality:50,pressing:50,tempo:50,width:50,line:50};
 const sH=strength(xi),boost=teamBoost(G.userTeam);
 const oppBoost=nx?0.8:0;   // assume a competent opposing bench
 const obj=coachObjective();
 const score=d=>{const[xh,xa]=xgPair(sH,rival,d,rTac,boost,oppBoost,adv);return obj(xh,xa);};
 const mMin=(c&&c.trait==="idealist")?70:0;   // the Idealist will not sit back
 // Two passes instead of a flat 161k-point grid: a coarse sweep at step 25
 // (3,125 evals) then a local refine at step 5 around the winner (~3,125).
 // ~96% fewer evaluations, and finer resolution than the old single pass.
 let best=null;
 for(let m=mMin;m<=100;m+=25)for(let p=0;p<=100;p+=25)for(let tp=0;tp<=100;tp+=25)
 for(let w=0;w<=100;w+=25)for(let l=0;l<=100;l+=25){
   const d={mentality:m,pressing:p,tempo:tp,width:w,line:l};
   const s=score(d);
   if(!best||s>best.s)best={d,s};
 }
 if(!best)return mMin?{...neu,mentality:mMin}:neu;
 const b=best.d,R=v=>[Math.max(0,v-20),Math.min(100,v+20)];
 const[m0,m1]=[Math.max(mMin,b.mentality-20),Math.min(100,b.mentality+20)],
       [p0,p1]=R(b.pressing),[t0,t1]=R(b.tempo),
       [w0,w1]=R(b.width),[l0,l1]=R(b.line);
 for(let m=m0;m<=m1;m+=10)for(let p=p0;p<=p1;p+=10)for(let tp=t0;tp<=t1;tp+=10)
 for(let w=w0;w<=w1;w+=10)for(let l=l0;l<=l1;l+=10){
   const d={mentality:m,pressing:p,tempo:tp,width:w,line:l};
   const s=score(d);
   if(s>best.s)best={d,s};
 }
 return best.d;
}
function coachPickXI(t){
 // the trait bends WHO gets picked, not just how well
 const c=G.coach;
 let xi=autoXI(t,G.formation);
 if(!c)return xi;
 const pool=fit(squadOf(t));
 const inXI=new Set(xi.map(p=>p.id));
 if(c.trait==="youth"){
   // an under-23 within 3 OVR of the veteran gets the shirt
   xi=xi.map(p=>{
     if(p.pos==="GK"||p.age<23)return p;
     const kid=pool.filter(k=>k.pos===p.pos&&k.age<23&&!inXI.has(k.id)&&p.ovr-k.ovr<=3)
       .sort((a,b)=>b.ovr-a.ovr)[0];
     if(kid){inXI.delete(p.id);inXI.add(kid.id);return kid;}
     return p;
   });
 }
 if(c.trait==="rotator"){
   // two outfield starters make way so legs stay fresh
   shuffle(xi.filter(p=>p.pos!=="GK")).slice(0,2).forEach(st=>{
     const sub=pool.filter(k=>k.pos===st.pos&&!inXI.has(k.id)&&st.ovr-k.ovr<=8)
       .sort((a,b)=>b.ovr-a.ovr)[0];
     if(sub){const idx=xi.indexOf(st);if(idx>=0){xi[idx]=sub;inXI.delete(st.id);inXI.add(sub.id);}}
   });
 }
 return xi;
}
function coachRunSetup(){
 // callers that force a re-plan bypass the cache key; it is refreshed by coachEnsurePlan
 // the coach sets up the side at his tier. Silent: no log, toast, save or
 // render, so it can run inside the matchday loop or a re-render. Returns the
 // list of things he did (for the manual button to narrate), or null.
 const tier=coachTier();
 if(tier<1)return null;
 const t=userTeamObj(),c=G.coach;
 const notes=[];
 if(tier>=2){const f=coachBestFormation();
   if(f!==G.formation)notes.push(`switched to ${f}`);G.formation=f;}
 const xi=coachPickXI(t);
 G.xi=xi.map(p=>p.id);
 notes.unshift(c.trait==="youth"?"picked an XI with youth in mind"
   :c.trait==="rotator"?"rotated the side to keep legs fresh"
   :"picked your strongest XI");
 if(tier>=3){G.tactics=coachBestTactics(xi);
   if(c.trait==="tactician"){const nx=nextOpponent();
     notes.push(nx?`tuned tactics for ${nx.name}${nx.comp==="cup"?" (cup)":""}`:"tuned your tactics");}
   else notes.push("tuned your tactics");}
 return notes;
}
/* The coach's plan is made at explicit moments and cached against the situation that
   produced it. If nothing that matters has changed, the stored plan is reused, so a
   render can display it without re-picking the side or re-running the tactical search. */
function coachPlanKey(){
 const t=userTeamObj();if(!t)return "none";
 const nx=nextOpponent();
 const avail=squadOf(t).filter(p=>p&&p.inj<=0&&(p.susp||0)<=0&&!p.natDuty)
   .map(p=>p.id).sort((a,b)=>a-b).join(",");
 return [G.season,G.matchday,nx?nx.opp:"-",nx?nx.comp:"-",coachTier(),
   G.coach?G.coach.id:"-",avail].join("|");
}
function coachEnsurePlan(){
 if(coachTier()<1)return null;
 const key=coachPlanKey();
 if(G._coachPlanKey===key)return null;   // nothing has changed; the stored plan stands
 const notes=coachRunSetup();
 G._coachPlanKey=key;
 return notes;
}
function coachAutoSetup(){
 // manual "do it once now" button
 if(coachTier()<1)return toast("Hire a head coach to use auto pick.");
 const notes=coachRunSetup();
 logAdd(`${G.coach.name} ${notes.join(", ")}.`);
 toast(`${G.coach.name} ${notes.join(", ")}.`);
 saveGame(true);render();
}
function autoXI(team,formation,useAll){
 // useAll is a deliberate emergency override, not a silent fallback. The old code
 // recursed into it whenever eleven fit men could not be found, which quietly put
 // injured, suspended and internationally-called-up players on the pitch. A club
 // short of bodies now plays short of bodies and takes the penalty in strength().
 const F=FORMATIONS[formation];
 const pool=useAll?squadOf(team):fit(squadOf(team));
 const by=(a,b)=>b.ovr-a.ovr;
 const g=pool.filter(p=>p.pos==="GK").sort(by).slice(0,1);
 const d=pool.filter(p=>p.pos==="DEF").sort(by).slice(0,F.DEF);
 const m=pool.filter(p=>p.pos==="MID").sort(by).slice(0,F.MID);
 const f=pool.filter(p=>p.pos==="FWD").sort(by).slice(0,F.FWD);
 let xi=[...g,...d,...m,...f];
 if(xi.length<11){const used=new Set(xi.map(p=>p.id));
   pool.filter(p=>!used.has(p.id)).sort(by).forEach(p=>{if(xi.length<11)xi.push(p)});}
 // still short: promote fit academy players before ever considering an unfit senior
 if(xi.length<11&&!useAll){
   const used=new Set(xi.map(p=>p.id));
   fit(academyOf(team)).filter(p=>!used.has(p.id)).sort(by)
     .forEach(p=>{if(xi.length<11)xi.push(p)});
 }
 return xi;
}
/* A side that cannot field eleven is punished for it rather than being quietly topped
   up with men who are not fit to play. Roughly proportional: nine men is a hiding. */
function manpower(xi){return clamp((xi.length||0)/11,0.5,1);}
function strength(xi){
 let atk=0,def=0,wa=0,wd=0;
 xi.forEach(p=>{atk+=p.ovr*ATKW[p.pos];wa+=ATKW[p.pos];def+=p.ovr*DEFW[p.pos];wd+=DEFW[p.pos]});
 // Playing short is a real disadvantage and now costs what it should. Defence suffers
 // more than attack, because a missing man is a hole rather than a lost option.
 const mp=manpower(xi);
 return{atk:(atk/(wa||1))*mp,def:(def/(wd||1))*Math.pow(mp,1.35)};
}
function poisson(l){let L=Math.exp(-l),k=0,p=1;do{k++;p*=Math.random()}while(p>L);return k-1;}
const NEU={mentality:50,pressing:50};
const AI_ATT={mentality:72,pressing:62,tempo:68,width:62,line:66};
const AI_DEF={mentality:32,pressing:42,tempo:38,width:40,line:34};
/* ---- club identity: hidden traits for AI clubs, revealed by scouting ---- */
const CLUB_TRAITS={
 selling:{label:"Selling club",desc:"Cashes in on anyone past 27 and accepts below-market fees. A good place to shop."},
 hoarder:{label:"Hoarders",desc:"Demands a heavy premium and clings to its squad. Hard to do business with."},
 youth:{label:"Youth academy",desc:"Develops its under-23s faster than anyone and buys for the future."},
 local:{label:"Local talent",desc:"Signs only players born in its own region."},
 attacking:{label:"Attacking philosophy",desc:"Plays high and fast. Scores freely and concedes freely."},
 defensive:{label:"Defensive philosophy",desc:"Sits deep and grinds out low-scoring games."}};
// weighted by tier: big clubs hoard and have a style, small clubs sell and develop
const TRAIT_WEIGHTS=[
 ["hoarder","hoarder","attacking","attacking","defensive","defensive","youth"],
 ["attacking","defensive","youth","youth","local","selling","hoarder"],
 ["selling","selling","youth","local","local","defensive","attacking"]];
function assignTrait(tier){return pick(TRAIT_WEIGHTS[tier]||TRAIT_WEIGHTS[2]);}
function traitOf(t){return t&&t.trait?CLUB_TRAITS[t.trait]:null;}
const SCORE_W={GK:.01,DEF:.25,MID:1,FWD:2.2};
function attributeGoals(xi,n){
 const scorers=[];
 // A side can now legitimately take the field short, so this can be handed an XI with
 // fewer than eleven names and, in the worst case, none at all. Indexing blindly threw
 // on the first goal. No players, no scorers: the goals still stand on the scoreboard.
 if(!xi||!xi.length)return scorers;
 const w=xi.map(p=>p.pos==="GK"?SCORE_W.GK*4:SCORE_W[p.pos]*(p.shooting+p.technique*.4));
 const tot=w.reduce((a,b)=>a+b,0);
 for(let g=0;g<n;g++){
   let r=Math.random()*tot;let k=0;
   while(r>w[k]&&k<w.length-1){r-=w[k];k++}
   const p=xi[Math.min(k,xi.length-1)];
   if(!p)continue;
   p.gs=(p.gs||0)+1;p.gc=(p.gc||0)+1;scorers.push(p.name);
   // credit the club he plays for now; the tally stays frozen once he leaves,
   // so a rising youngster can one day overtake a departed legend
   if(p.team!=null){const cl=T(p.team);if(cl){if(!cl.scorers)cl.scorers={};
     const e=cl.scorers[p.id]||(cl.scorers[p.id]={name:p.name,pos:p.pos,goals:0});
     e.goals++;e.name=p.name;}}
 }
 return scorers;
}
function playTie(h,a,adv){
 const hXI=teamXI(h),aXI=teamXI(a);
 const[hg,ag]=simMatch(hXI,aXI,teamTac(h),teamTac(a),teamBoost(h,true),teamBoost(a,false),adv);
 [...hXI,...aXI].forEach(p=>{p.as=(p.as||0)+1;p.ac=(p.ac||0)+1});
 return{hg,ag,hs:attributeGoals(hXI,hg),asc:attributeGoals(aXI,ag)};
}
function xgPair(hXI,aXI,hTac,aTac,hBoost,aBoost,homeAdv=3){
 const sH=hXI.atk!==undefined?hXI:strength(hXI),sA=aXI.atk!==undefined?aXI:strength(aXI);
 const mH=(hTac.mentality-50),mA=(aTac.mentality-50);
 const pH=(hTac.pressing-50),pA=(aTac.pressing-50);
 const tmpH=((hTac.tempo||50)-50),tmpA=((aTac.tempo||50)-50);
 const wdH=((hTac.width||50)-50),wdA=((aTac.width||50)-50);
 const lnH=((hTac.line||50)-50),lnA=((aTac.line||50)-50);
 // tempo: faster = more chances both ways. width: wide = more attack, thinner defense.
 // line: high = presses opponent (cuts their attack) but concedes space in behind.
 // Every dial must cost something, or sliding all five to 100 is a free win.
 // tempo opens the game up for BOTH sides. A high line pins the opponent back
 // but leaves space in behind. Attacking intent and pressing cost real shape.
 // Costs are tuned so each dial's marginal gain roughly equals its marginal cost
 // for a balanced side. That makes the best settings depend on your squad and
 // your opponent rather than "slide everything to 100".
 const atkH=sH.atk+mH*.08+pH*.04+tmpH*.03+wdH*.03+tmpA*.045+homeAdv+hBoost;
 const atkA=sA.atk+mA*.08+pA*.04+tmpA*.03+wdA*.03+tmpH*.045+aBoost;
 const defH=sH.def-Math.max(0,mH)*.12-Math.max(0,pH)*.06-wdH*.045-lnA*.04-lnH*.06+hBoost*.6;
 const defA=sA.def-Math.max(0,mA)*.12-Math.max(0,pA)*.06-wdA*.045-lnH*.04-lnA*.06+aBoost*.6;
 const var_=1+(tmpH+tmpA)/400;   // fast tempo widens score variance
 return[clamp(1.35*var_*Math.exp((atkH-defA)/22),.12,6),
        clamp(1.12*var_*Math.exp((atkA-defH)/22),.12,6)];
}
function simMatch(hXI,aXI,hTac,aTac,hBoost,aBoost,homeAdv=3){
 const[xgH,xgA]=xgPair(hXI,aXI,hTac,aTac,hBoost,aBoost,homeAdv);
 return[poisson(xgH),poisson(xgA)];
}
function teamXI(id){
 return id===G.userTeam?userStartXI():autoXI(T(id),"4-4-2");}
function teamTac(id){
 if(id===G.userTeam){
   // an Idealist overrules any instruction to sit back
   if(G.coach&&G.coach.trait==="idealist"&&G.tactics.mentality<70)
     return{...G.tactics,mentality:70};
   return G.tactics;
 }
 const t=T(id);
 if(t&&t.trait==="attacking")return AI_ATT;
 if(t&&t.trait==="defensive")return AI_DEF;
 return NEU;}
function teamBoost(id,home){
 const t=T(id);
 // base coaching edge (user's real coach; AI carries an implicit setup by level)
 let b = (id===G.userTeam) ? coachInfo().boost : (t?([1.6,0.8,0.4][t.tier]||0.4):0);
 if(!t)return b;
 // Office assets, available to every club: supporters lift the side at home, the
 // team jet keeps them fresh on the road. 'home' is undefined for neutral estimates.
 if(home===true && hasSupporters(t)) b+=SUPPORTER_BOOST;
 if(home===false && jetActive(t)) b+=JET_BOOST;
 if(id===G.userTeam && hasRnD("setpiece")) b+=0.9;   // the set piece lab, every week
 return b;
}
function applyResult(h,a,hg,ag){
 const H=T(h).st,A=T(a).st;
 H.P++;A.P++;H.GF+=hg;H.GA+=ag;A.GF+=ag;A.GA+=hg;
 if(hg>ag){H.W++;A.L++;H.Pts+=3}else if(hg<ag){A.W++;H.L++;A.Pts+=3}else{H.D++;A.D++;H.Pts++;A.Pts++}
}

/* ======================= MATCHDAY LOOP ======================= */
function logAdd(text,amt){
 G.log.unshift({s:G.season,md:G.matchday,text,amt:amt||0});
 if(G.log.length>60)G.log.length=60;
}
function playMatchday(){
 // an unanswered contract demand expires when the season kicks off: he walks
 if(G.coachRenewal&&G.coachRenewal.kind==="trophy"&&G.coach){
   // He asked, you never answered. He is contracted, so he stays - and he remembers.
   G.coach.unsettled=(G.coach.unsettled||0)+1;
   logAdd(`${G.coach.name}'s request for a new deal went unanswered. He stays, unsettled.`);

   tickets, the best player alive - and still not an Icon, because he has not done it

function fameTick(){

 const cont=(G.cups&&G.cups.continental||[]).find(x=>x.season===G.season);
 // The one route to fame for a keeper: being, unmistakably and for years, the best
 // goalkeeper alive. Deliberately slow. A striker reaches Marquee on two good seasons;
 // a keeper has to own the top spot for most of a decade.
 const bestGk=G.players.filter(x=>x.team!=null&&!inAcademy(x)&&x.pos==="GK").sort((x,y)=>y.ovr-x.ovr)[0];
 G.players.forEach(p=>{
   const acad=inAcademy(p);
   const apps=p.as||0;
   let f=fameOf(p)*FAME_DECAY;
   f+=(p.gs||0)*0.62;                                  // output
   if(boots.has(p.id))f+=12;                           // Golden Boot
   /* Club success is only YOUR fame if you were part of it. This used to be flat: every
      name on the books took the full title and continental bonus, so a dynasty made
      household names of its reserve keeper and of sixteen-year-olds who had never left
      the academy. At +17 a season against 0.86 decay that compounds to a hundred, which
      is why prospects were showing up as Icons. Credit now scales with the share of the
      season a man actually played, and a fringe player gets almost none of it. */
   const t=(p.seasonClub!=null?T(p.seasonClub):null)||(p.team!=null?T(p.team):null);
   if(t&&!acad&&apps>=4){
     const share=clamp(apps/SEASON_LEN,0,1);
     const wonLeague=(t.leagueTitleSeasons||[]).includes(G.season);
     const wonCont=!!(cont&&cont.winner===t.name);

     if(wonCont){f+=12*share;if(apps>=6)p.contWins=(p.contWins||0)+1;}
   }
   const r=acad?0:rank[p.id];
   // A season finishing among the very best alive is a permanent line on the record,
   // not just a fame bonus that decays away. This is what a long career is MADE of.
   if(r&&r<=10&&apps>=6){p.eliteYears=(p.eliteYears||0)+1;if(r<=3)p.topYears=(p.topYears||0)+1;}

   if(bestGk&&p.id===bestGk.id&&p.ovr>=90)f+=9;        // the undisputed best keeper alive

   if(acad)f=Math.min(f,FAME_ACADEMY_CEIL);

function attendanceFactors(t,oppId,cupStage){
 // Base: reputation and ticket price, as before

 const f={base:0,boot:0,goat:0,prestige:0,form:0,cup:0,stars:[],goatName:null,famous:[]};
 const opp=oppId!=null?T(oppId):null;
 // STARDOM DRAW. This used to be a single binary: the one best attacker alive was worth
 // a flat +22% and nobody else counted. Now every famous player on either side pulls,
 // scaled by fame, so two Icons meeting is the fixture of the season and a faded legend
 // whose OVR has collapsed still fills a ground. Fame is superlinear above Marquee: an
 // Icon is worth far more than two ordinary names.
 {const onShow=squadOf(t).filter(isMarquee).concat(opp?squadOf(opp).filter(isMarquee):[]);
  if(onShow.length){
    let draw=0;
    onShow.sort((a,b)=>fameOf(b)-fameOf(a)).forEach((p,i)=>{
      const w=Math.pow((fameOf(p)-FAME_MARQUEE)/(100-FAME_MARQUEE),1.35);   // 0 at Marquee, 1 at 100
      draw+=(.06+.20*w)/(1+i*0.6);          // each additional name adds less than the last
    });
    f.goat=Math.min(.34,draw);
    f.famous=onShow.slice(0,3).map(p=>p.name);
    f.goatName=f.famous[0]||null;
  }}
 // Golden Boot draw: fans come out for the division's top scorers, on either side
 if(G.matchday>2){
   const race=bootRace();
   const homeStars=squadOf(t).filter(p=>race.includes(p.id));
   const awayStars=opp?squadOf(opp).filter(p=>race.includes(p.id)):[];
   const starCount=homeStars.length+awayStars.length;
   if(starCount>0){f.boot=Math.min(.18,starCount*.07);   // two scorers ~ +14%
     f.stars=[...homeStars,...awayStars].map(p=>p.name);}
 }
 // Prestige pull: storied clubs travel with a following. A meeting of two
 // powerhouses is the fixture of the season.
 const myP=(t.prestige||0)/100,opP=opp?(opp.prestige||0)/100:0;
 f.prestige=myP*.10+opP*.12+(myP>.55&&opP>.55?.10:0);
 // Form: winners fill grounds, strugglers do not, but a big visitor rescues the gate
 const tbl=standingsOf(t.region,t.tier),rank=tbl.indexOf(t)+1;

 // Cup knockouts: the later the round, the bigger the occasion

 // Pull is the fixture's price-independent appeal (reputation plus every occasion
 // bonus). The CLEARING PRICE is the highest face value at which the ground still
 // fills; it scales with pull, so a GOAT-on-show cup final clears far higher than a
 // dead rubber. Charge at or below it and the appeal-limited crowd shows up; charge
 // above it and seats empty across a band. The resale market prints this same number,
 // so setting face value to the resale price now FILLS the ground instead of emptying
 // it \u2014 real demand (a hot secondary market) genuinely supports a higher gate.

 f.total=clamp(baseFill*clamp(1-over/(clearing*0.9),0,1),0,1);

}

     let open=SHOE_SLOTS-brandHolders(b.key).length;
     while(open>0){
       const cand=G.teams.filter(t=>t.id!==G.userTeam&&!t.sponsor&&shoeQualifies(t,tier))
         .sort((x,y)=>shoeResume(y)-shoeResume(x))[0];
       if(!cand)break;
       signDeal(cand,b.key,G.season+1);       // AI deals begin next season
       open--;
     }
   });
 }
}
/* ---- user liaison cycle: evaluate a season, then pitch; at term end, renew ---- */
function startLiaisonEval(){G.liaisonCycle={phase:"evaluating",since:G.season};}
function buildShoeOffers(t,excludeBrand){
 const offers=[];
 for(const tier of["gold","silver","bronze"]){
   if(!shoeQualifies(t,tier))continue;
   const open=SHOE_TIERS[tier].brands.find(b=>b.key!==excludeBrand&&brandHolders(b.key).length<SHOE_SLOTS);
   if(open){offers.push({tier,brand:open.key,bump:null});continue;}
   const holders=[];SHOE_TIERS[tier].brands.forEach(b=>{if(b.key!==excludeBrand)brandHolders(b.key).forEach(h=>holders.push(h));});
   const weakest=holders.sort((a,b)=>shoeResume(a)-shoeResume(b))[0];
   if(weakest&&shoeResume(t)>shoeResume(weakest))offers.push({tier,brand:weakest.sponsor.brand,bump:weakest.id});
 }
 return offers;
}
function userLiaisonTick(){
 const t=userTeamObj();if(!t)return;
 if(!G.liaison){G.liaisonCycle=null;return;}
 if(t.sponsor&&t.sponsor.renewDue){                       // term complete, awaiting the user's choice
   if(!G.liaisonCycle||G.liaisonCycle.phase!=="renewal")
     G.liaisonCycle={phase:"renewal",since:G.season,brand:t.sponsor.brand,tier:t.sponsor.tier,offers:buildShoeOffers(t,t.sponsor.brand)};
   else if(G.season>G.liaisonCycle.since){endDeal(t);startLiaisonEval();}  // ignored a full season -> lapse
   return;
 }
 if(t.sponsor){G.liaisonCycle=null;return;}               // active deal: no cycle
 if(!G.liaisonCycle){startLiaisonEval();return;}          // (re)start after a deal ends
 if(G.liaisonCycle.phase==="evaluating"){
   const offers=buildShoeOffers(t);
   if(offers.length)G.liaisonCycle={phase:"offered",offers,since:G.season};
   else{G.liaisonCycle={phase:"evaluating",since:G.season};
     logAdd("Shoe brands passed this year \u2014 the liaison keeps working.");}
 }else{G.liaisonCycle={phase:"evaluating",since:G.season};}  // an ignored pitch lapses
}
function hireLiaison(){G.liaison=true;
 if(!userTeamObj().sponsor&&!G.liaisonCycle)startLiaisonEval();
 logAdd(`Hired a shoe brand liaison (${money(liaisonWage())}/wk) \u2014 they begin a season-long evaluation.`);saveGame(true);render();}
function fireLiaison(){G.liaison=false;G.liaisonCycle=null;logAdd("Released the shoe brand liaison.");saveGame(true);render();}
function renewShoeDeal(){
 const t=userTeamObj();if(!t||!t.sponsor||!t.sponsor.renewDue)return;
 signDeal(t,t.sponsor.brand,G.season);                    // fresh 10-year term + re-sign bonus, clears renewDue
 G.liaisonCycle=null;saveGame(true);render();}
function acceptShoeOffer(idx){
 const t=userTeamObj();if(!t||!G.liaisonCycle)return;
 const ph=G.liaisonCycle.phase;if(ph!=="offered"&&ph!=="renewal")return;
 const o=G.liaisonCycle.offers[idx];if(!o)return;
 if(ph==="renewal"&&t.sponsor)endDeal(t);                 // vacate the current brand before switching
 if(o.bump){const bumped=T(o.bump);if(bumped)endDeal(bumped);}
 signDeal(t,o.brand,G.season);
 G.liaisonCycle=null;saveGame(true);render();}
function declineShoeOffers(){
 const t=userTeamObj();
 if(G.liaisonCycle&&G.liaisonCycle.phase==="renewal"&&t&&t.sponsor){endDeal(t);logAdd("Ended the shoe partnership.");}
 else logAdd("Turned down this year\u2019s shoe pitch.");
 G.liaisonCycle={phase:"evaluating",since:G.season};saveGame(true);render();}
/* ================= Achievements / badges =================
   G.badges maps a badge id -> the season it was unlocked. Most unlock from derivable
   state via checkBadges() (run each matchday and season end); a few fire from event
   hooks (first whistle, first goal, hat-trick, big gate, etc.). All 84 show on the
   Club screen's badge cabinet; locked ones are dimmed. */
function _runMax(arr){let best=0,cur=0,prev=null;arr.slice().sort((a,b)=>a-b).forEach(s=>{cur=(prev!=null&&s===prev+1)?cur+1:1;if(cur>best)best=cur;prev=s;});return best;}
function badgeCtx(){
 const t=userTeamObj();if(!t)return null;
 const reg=G.cups.regional||[],cont=G.cups.continental||[],gbl=G.gbLog||[];
 const regWins=reg.filter(e=>e.winner===t.name&&e.region===t.region).map(e=>e.season);
 const contWins=cont.filter(e=>e.winner===t.name&&e.region===t.region).map(e=>e.season);
 const gbUser=gbl.filter(e=>e.team===t.id).length;
 const mine=G.players.filter(p=>p.team===t.id);
 return {t,budget:t.budget,prestige:t.prestige||0,
   rank1:prestigeRank(t.id,globalPrestige())===1,
   leagueRun:_runMax(t.leagueTitleSeasons||[]),regRun:_runMax(regWins),contRun:_runMax(contWins),
   regWinCount:regWins.length,goatOwned:squadOf(t).some(isIcon),
   // Signing an Icon and keeping an Icon for a whole season are different achievements
   // and now have different tests. Both used to read goatOwned, so both unlocked the
   // instant one arrived and the "full season" wording was a lie.
   iconFullSeason:squadOf(t).some(p=>isIcon(p)&&(G.badgeStats||{}).iconSince!=null
     &&G.season>(G.badgeStats||{}).iconSince),
   gbUser,
   wcApp:mine.some(p=>(p.wcApps||0)>0),wcWin:mine.some(p=>(p.wcWins||0)>0),
   wcWinners:mine.filter(p=>(p.wcWins||0)>0).length,wcSquadMax:0,
   tippyApp:mine.some(p=>(p.tippyApps||0)>0),tippyWin:mine.some(p=>(p.tippyWins||0)>0),
   dualIntl:mine.some(p=>(p.wcWins||0)>0&&(p.tippyWins||0)>0),
   maxStadium:(t.stadiumLevel||0)>=STADIUM_TIERS.length,
   fullSuite:(t.stadiumLevel||0)>=STADIUM_TIERS.length&&(t.facility||0)>=3&&t.jet&&t.supporters};
}

   A once-a-season futures book (each regional cup, the Conrad Cup, your region's
   Golden Boot, and the World & Tippy Cups in the years they run) plus a correct-score
   bet on each of your matches. Odds are honest \u2014 derived from real strength, so
   favourites pay little and upsets pay huge \u2014 with a small house margin, so betting is
   a flutter, never an income engine. Match stakes cap at \u00A32M; futures let you risk it
   all. Exact scores can't be farmed (you can't reliably hit one), and futures only ever
   pay for the RIGHT outcome, so there is nothing to throw. */

function _fact(n){let f=1;for(let i=2;i<=n;i++)f*=i;return f;}
function poissonPmf(k,l){return Math.exp(-l)*Math.pow(l,k)/_fact(k);}

function clubBetRating(t){if(!t)return 50;const s=squadOf(t).filter(Boolean).sort((a,b)=>b.ovr-a.ovr).slice(0,11);

 return items.map((i,k)=>({...i,p:ex[k]/tot}));

/* ================= Player discontent (Empire FC 2) =================
   Footballers want to play. At season's end, two narrow groups agitate for a move:
     - a YOUNG player (under 24) with almost no minutes, whose development is stalling
     - a STAR (high OVR) reduced to a bench role, whose status doesn't match his minutes

   Once a player is unhappy he must be sold before the season starts, and he goes at a
   steep discount because everyone knows he is forcing his way out. Ignore him for a
   full season and he walks for nothing. This is what stops a rich club stockpiling
   talent: you can buy anyone, but you cannot bench them and keep them. */
const DISCONTENT_YOUNG_AGE=24;   // under this age, minutes matter for development

/* ================= Player contracts & wage demands (Empire FC 2) =================
   Every senior player is on a contract of a few seasons. When it runs down he opens
   talks, and his demand scales with what he is worth NOW, what he has just won, and
   who else is circling. A club that wins everything therefore watches its wage bill
   balloon: success is what makes your own squad expensive. Refuse the demand and he
   runs down his deal and leaves for nothing at the end of the season. There is no
   salary cap; the pressure is simply that holding a superstar squad costs superstar
   money, and even a billion only stretches so far. */
const CONTRACT_MIN=2,CONTRACT_MAX=5;

   standing (star quality), his recent honours, and rival interest. */
function wageDemand(p){

 if(p.ovr>=90)mult+=0.85; else if(p.ovr>=85)mult+=0.55; else if(p.ovr>=80)mult+=0.30;
 // recent honours: what he has just helped win
 const s=G.season;
 const titles=t?((t.leagueTitleSeasons||[]).filter(x=>x>=s-3).length):0;

 mult+=titles*0.10+conrad*0.18;

/* Season tick: run contracts down, open talks on expiring deals, and let AI clubs
   settle their own renewals (or lose the player). */
function contractTick(){
 G.teams.forEach(t=>{
   squadOf(t).forEach(p=>{
     if(!p)return;
     if(p.contract==null)p.contract=newContractYears();
     p.contract--;
     // An Icon entering his final year becomes a story rather than a renewal form.
     if(p.contract===1&&fameOf(p)>=SAGA_FAME&&!G.saga)startSaga(p);
     if(p.contract>0)return;
     // Decision Day: the saga resolves instead of a routine renewal or release.
     if(G.saga&&!G.saga.resolved&&G.saga.pid===p.id){resolveSaga();return;}
     // deal is up
     if(t.id===G.userTeam){
       p.demand=wageDemand(p);                     // you decide in the window
     }else{
       const dem=wageDemand(p);
       // AI keeps him if the wage bill stays sane for the club's means
       const bill=squadWage(t),afford=t.budget>0&&(bill+dem-p.wage)*SEASON_LEN<Math.max(t.budget*1.6,4e6);
       if(afford){p.wage=dem;p.contract=newContractYears();markWagesDirty();}
       else{
         // Central movement API, not a hand-rolled strip. Doing it by hand here left the
         // academy arrays untouched and never closed the career spell, so a player let
         // go this way kept an open history entry reading "Season X to now" at a club he
         // had already left. Same class of leak as the expulsion bug, different shape.
         releasePlayerToPool(p);
         p.contract=newContractYears();delete p.demand;
       }
     }
   });
 });
}

/* Position mix for fresh intake. Matches the world-generation pool (roughly 10% GK,
   35% DEF, 35% MID, 20% FWD), which produces correctly balanced squads. Both academy
   intake sites previously drew from ["GK","DEF","DEF","MID","MID","FWD"] - one keeper
   in six - which over-produced goalkeepers and under-produced forwards. Promotions then
   pushed squads from 10% keepers at season 1 to nearly 15% by season 9, squeezing
   forwards from 20% down to 15.6%. */
const INTAKE_POS=["GK","GK","DEF","DEF","DEF","DEF","DEF","DEF","DEF",
                  "MID","MID","MID","MID","MID","MID","MID","FWD","FWD","FWD","FWD"];
/* Both fill paths below fall back to "best available" when nobody plays the needed
   position. Keepers are the standing surplus in the free-agent bin and in academies, so
   that fallback quietly handed clubs a fourth and fifth goalkeeper. A club that already
   has its keepers will take an outfielder instead, exactly as a real one would. */
function dropSpareKeepers(t,list){
 if(squadOf(t).filter(p=>p&&p.pos==="GK").length<2)return list;
 const out=list.filter(p=>p&&p.pos!=="GK");
 return out.length?out:list;
}
function positionNeed(t){
 const tmpl={GK:2,DEF:7,MID:7,FWD:4};
 const have={GK:0,DEF:0,MID:0,FWD:0};
 squadOf(t).forEach(p=>{if(p)have[p.pos]++});
 // Keepers are handled separately and capped. The old loop iterated the template with
 // GK first from gap=-99, so GK won every tie: once a squad met its template at every
 // position, every further signing was another keeper, and rosters silently drifted to
 // four, five and six goalkeepers on a 20-man squad.
 if(have.GK<tmpl.GK)return "GK";
 let worst="MID",gap=-99;
 for(const pos of ["DEF","MID","FWD"]){
   const g=tmpl[pos]-have[pos];
   if(g>gap){gap=g;worst=pos;}
 }
 return worst;
}
function aiSquadTopUp(){
 // AI clubs lose players to insolvency sales, board sales and trait behaviour
 // with nothing putting them back. Without this, squads bleed down over decades.
 const TARGET=SQUAD_MAX;
 // Keepers are rebalanced in two ordered passes BEFORE anything else, because a club
 // early in the list cannot sign a spare keeper that a club later in the list has not
 // released yet. Trim every surplus first, then repair every shortage.
 //
 // Why this is needed at all: keepers flow IN at about 10% of intake but have almost no
 // way OUT. aiTransfers skips them entirely in its replace-the-worst loop, and every
 // other churn path guards a 2-keeper minimum, so with inflow and no outflow the
 // equilibrium climbed to 14% of every squad and squeezed forwards out.
 G.teams.forEach(t=>{
   if(t.id===G.userTeam)return;
   let guardT=0;
   while(squadOf(t).filter(p=>p&&p.pos==="GK").length>3&&t.squad.length>SQUAD_MIN&&guardT++<4){
     const spare=squadOf(t).filter(p=>p&&p.pos==="GK").sort((a,b)=>a.ovr-b.ovr)[0];
     if(!spare)break;
     t.budget+=Math.round((spare.value||0)*0.9);
     releasePlayerToPool(spare);
   }
 });
 G.teams.forEach(t=>{
   if(t.id===G.userTeam)return;
   let guardK=0;
   while(squadOf(t).filter(p=>p&&p.pos==="GK").length<2&&guardK++<3){
     let keeper=G.freeAgents.map(P).filter(p=>p&&p.pos==="GK").sort((a,b)=>b.ovr-a.ovr)[0];
     // No keeper on the market: promote one of his own rather than field an outfielder
     // in goal. Only if that also fails does the club go short.
     if(!keeper){
       const kid=academyOf(t).filter(p=>p&&p.pos==="GK").sort((a,b)=>b.ovr-a.ovr)[0];
       if(kid&&promoteFromAcademy(t,kid))continue;
       break;
     }
     if(t.squad.length>=TARGET){
       const out=squadOf(t).filter(p=>p&&p.pos!=="GK").sort((a,b)=>a.ovr-b.ovr)[0];
       if(!out)break;
       releasePlayerToPool(out);
     }
     movePlayerToClub(keeper,t);
   }
 });
 G.teams.forEach(t=>{
   if(t.id===G.userTeam)return;
   // a real club looks to its own academy first: promote the best prospects to fill gaps
   if(t.academy&&t.academy.length){
     let g2=0;
     while(t.squad.length<TARGET&&t.academy.length&&g2++<10){
       const need=positionNeed(t);
       const pool=academyOf(t);
       const pickUp=pool.filter(p=>p.pos===need).sort((a,b)=>b.ovr-a.ovr)[0]
                  ||dropSpareKeepers(t,pool).sort((a,b)=>b.ovr-a.ovr)[0];
       if(!pickUp)break;
       if(!promoteFromAcademy(t,pickUp))break;
     }
   }
   let guard=0;
   while(t.squad.length<TARGET&&guard++<14){
     let pool=G.freeAgents.map(P).filter(Boolean);
     if(!pool.length)break;
     if(t.trait==="local"){const loc=pool.filter(p=>p.region===t.region);if(loc.length)pool=loc;}
     const need=positionNeed(t);
     let cands=pool.filter(p=>p.pos===need);
     if(!cands.length)cands=dropSpareKeepers(t,pool);
     let sign;
     if(t.trait==="youth")sign=cands.sort((a,b)=>(b.pot-b.age*2)-(a.pot-a.age*2))[0];
     else if(t.trait==="selling")sign=cands.sort((a,b)=>a.value-b.value)[0];
     else{
       // Rivals judge a free agent the way the market does, so a released prodigy is
       // gone within a window instead of sitting on the list waiting for you.
       const afford=cands.filter(p=>freeAgentFee(p)<=Math.max(t.budget,0)+400000)
         .sort((a,b)=>marketRating(b)-marketRating(a));
       sign=afford[0]||cands.sort((a,b)=>a.value-b.value)[0];
     }
     if(!sign)break;
     t.budget-=Math.round(freeAgentFee(sign)*.6);  // AI gets a keener deal than you do
     movePlayerToClub(sign,t);
   }
 });
}

   number of clubs go shopping: they identify their weakest position, then either buy a
   genuine upgrade from another club (paying a real fee that moves money around the
   world) or pick up a free agent. Selling clubs bank the fee and reinvest it later, so
   wealth and talent actually circulate instead of pooling at the top. */
function aiTransfers(){
 const clubs=G.teams.filter(t=>t.id!==G.userTeam);
 // free-agent churn (as before, but for more clubs each pass)
 for(let k=0;k<4;k++){
   const t=pick(clubs);if(!t)continue;
   const sq=squadOf(t).filter(p=>p&&p.pos!=="GK").sort((a,b)=>a.ovr-b.ovr);
   const worst=sq[0];if(!worst)continue;
   if(t.squad.length<=SQUAD_MIN)continue;
   const sellFee=Math.round(worst.value*.9);
   let options=G.freeAgents.map(P).filter(f=>f&&f.team===null&&f.pos===worst.pos&&f.ovr>worst.ovr+2&&f.value<=t.budget+sellFee);
   if(t.trait==="local")options=options.filter(f=>f.region===t.region);
   if(t.trait==="hoarder"&&Math.random()<0.6)continue;
   if(!options.length)continue;
   const buy=t.trait==="youth"
     ? options.sort((a,b)=>(b.pot-b.age*1.5)-(a.pot-a.age*1.5))[0]
     : options.sort((a,b)=>b.ovr-a.ovr)[0];
   t.budget+=sellFee-buy.value;
   releasePlayerToPool(worst);
   movePlayerToClub(buy,t);
   buy.wage=wageOf(buy);buy.contract=newContractYears();markWagesDirty();
 }
 aiClubTransfers();
}
/* ---- career club history ----
   Every move goes through joinClub(), so a player's CV builds itself: club name, the
   season he arrived, and the goals/apps he racked up there. Stored as names rather than
   ids so a club that later renames or a player who outlives records still reads right. */
function joinClub(p,teamId,season){
 if(!p)return;
 p.history=p.history||[];
 const t=teamId!=null?T(teamId):null;
 const now=season!=null?season:G.season;
 const last=p.history[p.history.length-1];
 if(last&&last.out==null){                       // close out the previous spell
   last.out=now;
   last.goals=Math.max(0,(p.gc||0)-(last.gcAt||0));
   last.apps=Math.max(0,(p.ac||0)-(last.acAt||0));
   // A stint where he never got on the pitch is transfer-market churn, not a real spell
   // in his career, so it is dropped rather than cluttering the CV.
   if(last.apps===0&&last.goals===0)p.history.pop();
 }
 if(!t)return;                                   // leaving to free agency just closes the spell
 // Re-joining the club he most recently left reopens that same spell rather than
 // stacking duplicate rows, so a back-and-forth reads as one continuous stint.
 const tail=p.history[p.history.length-1];
 if(tail&&tail.club===t.name){
   delete tail.out;delete tail.goals;delete tail.apps;
   return;
 }
 p.joined=now;
 p.history.push({club:t.name,in:now,gcAt:p.gc||0,acAt:p.ac||0});
}
/* Goals/apps for the spell a player is currently in. */
function spellStats(p,h){
 if(h.out!=null)return{goals:h.goals||0,apps:h.apps||0};
 return{goals:Math.max(0,(p.gc||0)-(h.gcAt||0)),apps:Math.max(0,(p.ac||0)-(h.acAt||0))};
}
/* Development-time invariant check. Every one of these was a real failure mode at some
   point: a player on two clubs' books, a squad holding an id for a man who no longer
   exists, a player pointing at a club that is not holding him, a duplicate free agent.
   Run after every matchday, window action, import and season turnover in the harness. */
function assertWorldIntegrity(where){
 const tag=where?" ["+where+"]":"";
 const byId=new Map();
 G.players.forEach(p=>{
   if(byId.has(p.id))throw new Error("duplicate player id "+p.id+tag);
   byId.set(p.id,p);
 });
 const held=new Map();
 for(const t of G.teams){
   const entries=[...t.squad.map(id=>["squad",id]),...((t.academy||[]).map(id=>["academy",id]))];
   for(const [bucket,id] of entries){
     if(held.has(id))throw new Error("player "+id+" appears more than once"+tag);
     const p=byId.get(id);
     if(!p)throw new Error(t.name+" has missing "+bucket+" player "+id+tag);
     if(p.team!==t.id)throw new Error(p.name+" says team "+p.team+", held by "+t.id+tag);
     held.set(id,t.id);
   }
   if(t.squad.length>SQUAD_MAX)throw new Error(t.name+" over the squad cap: "+t.squad.length+tag);
   if((t.academy||[]).length>ACADEMY_MAX)throw new Error(t.name+" over the academy cap"+tag);
   if(!isFinite(t.budget))throw new Error(t.name+" has a non-finite budget"+tag);
 }
 for(const p of G.players){
   if(p.team!=null&&held.get(p.id)!==p.team)
     throw new Error(p.name+" points at team "+p.team+" but is not held there"+tag);
   if(!isFinite(p.wage)||!isFinite(p.value))throw new Error(p.name+" has non-finite money"+tag);
   // An open career spell must belong to the club actually holding him. Several release
   // paths used to strip the squad by hand and never close the spell, leaving a free
   // agent whose card still read "Season X to now" at a club he had already left.
   const h=p.history&&p.history.length?p.history[p.history.length-1]:null;
   if(h&&!h.out&&!p.retired){
     if(p.team==null)throw new Error(p.name+" is unattached but his career spell is still open"+tag);
     const club=T(p.team);
     if(club&&h.club!==club.name)
       throw new Error(p.name+" has an open spell at "+h.club+" but plays for "+club.name+tag);
   }
 }
 const free=new Set();
 for(const id of G.freeAgents){
   if(free.has(id))throw new Error("duplicate free agent "+id+tag);
   free.add(id);
   const p=byId.get(id);
   if(!p||p.team!=null||held.has(id))throw new Error("invalid free-agent entry "+id+tag);
 }
 for(const p of G.players){
   if(p.team==null&&!free.has(p.id)&&!p.retired)
     throw new Error(p.name+" is unattached but not on the free-agent list"+tag);
 }
 if(G.teams.length!==REGIONS.length*PER_TIER*3)
   throw new Error("pyramid is "+G.teams.length+" clubs, expected "+(REGIONS.length*PER_TIER*3)+tag);
 if(!T(G.userTeam))throw new Error("user club is missing from the world"+tag);
 return true;
}
/* The assertion above throws, which is what a test wants and the last thing a player
   wants. In the game it runs inside this guard: a broken invariant is repaired on the
   spot and noted, rather than either crashing the career or rotting silently. Grok's
   point stands that without this the next regression is invisible; this makes it loud
   without making it fatal. */
function integrityGuard(where){
 try{assertWorldIntegrity(where);return true;}
 catch(e){
   const fixed=repairWorld();
   G._integrityRepairs=(G._integrityRepairs||0)+1;
   G._lastIntegrityFault=String(e&&e.message||e);
   try{assertWorldIntegrity(where+" post-repair");}
   catch(e2){G._lastIntegrityFault="unrepaired: "+String(e2&&e2.message||e2);}
   if(fixed)logAdd(`${fixed} player${fixed===1?"":"s"} were found in an inconsistent state and returned to the free market.`);
   return false;
 }
}
function detachPlayer(p){
 G.teams.forEach(tt=>{
   tt.squad=tt.squad.filter(id=>id!==p.id);
   if(tt.academy)tt.academy=tt.academy.filter(id=>id!==p.id);
   if(tt.unhappy)tt.unhappy=tt.unhappy.filter(id=>id!==p.id);
 });
 G.freeAgents=G.freeAgents.filter(id=>id!==p.id);
}
/* Real money-for-player deals between AI clubs. */
function aiClubTransfers(){
 const buyers=shuffle(G.teams.filter(t=>t.id!==G.userTeam&&t.budget>1e6&&!squadFull(t)));
 let done=0;
 for(const buyer of buyers){
   if(done>=8)break;                                  // a handful of real deals per window
   if(buyer.trait==="hoarder"&&Math.random()<0.5)continue;
   const need=positionNeed(buyer);
   const mine=squadOf(buyer).filter(p=>p&&p.pos===need).sort((a,b)=>a.ovr-b.ovr);
   const bar=mine.length?mine[mine.length-1].ovr:0;    // must beat our best in that slot
   // shop other clubs for a clear upgrade they can be talked out of
   const targets=[];
   G.teams.forEach(sel=>{
     if(sel.id===buyer.id||sel.id===G.userTeam)return;
     if(sel.squad.length<=SQUAD_MIN)return;
     squadOf(sel).forEach(p=>{
       if(!p||p.pos!==need||p.ovr<=bar+2)return;
       if(buyer.trait==="local"&&p.region!==buyer.region)return;
       let fee=transferFee(p);
       if(sel.trait==="hoarder")fee=Math.round(fee*1.4);
       if(sel.trait==="selling")fee=Math.round(fee*0.8);
       if(isUnhappy(p))fee=forcedFee(p);               // agitators go cheap
       if(fee>buyer.budget)return;
       targets.push({p,sel,fee});
     });
   });
   if(!targets.length)continue;
   // targets were gathered before any trade in this pass; re-validate before executing
   targets.sort((a,b)=>((b.p.ovr-bar)/Math.max(1,b.fee))-((a.p.ovr-bar)/Math.max(1,a.fee)));
   const deal=targets.find(d=>
     d.sel.squad.includes(d.p.id) &&        // the seller still actually holds him
     d.sel.squad.length>SQUAD_MIN &&        // and can afford to lose him
     d.fee<=buyer.budget);
   if(!deal||squadFull(buyer))continue;
   buyer.budget-=deal.fee;deal.sel.budget+=deal.fee;
   movePlayerToClub(deal.p,buyer);
   deal.p.wage=wageOf(deal.p);deal.p.contract=newContractYears();
   markWagesDirty();
   done++;
 }
}

let QUIET=false;

function grTag(r){return "Group Round "+(r+1);}
function initCup(){
 // regional cup: the 30 clubs of the user's region, 6 groups of 5
 const ureg=userRegionKey();
 const seeds=[];
 for(let tier=0;tier<3;tier++)seeds.push(...shuffle(tierClubs(ureg,tier).slice()));
 const groups=Array.from({length:6},()=>[]);
 seeds.forEach((id,i)=>{const r=Math.floor(i/6);const g=r%2?5-(i%6):i%6;groups[g].push(id)});
 // 5-team round robin template (indices 0-4, one bye per round)
 const tmpl=[];let cur=[0,1,2,3,4,-1];
 for(let r=0;r<5;r++){const rd=[];
   for(let i=0;i<3;i++){const h=cur[i],a=cur[5-i];if(h!==-1&&a!==-1)rd.push(r%2?[a,h]:[h,a]);}
   tmpl.push(rd);
   cur=[cur[0],cur[5],...cur.slice(1,5)];}
 const gst={};groups.flat().forEach(id=>gst[id]=blankStd());
 G.cup={phase:"group",groups,tmpl,gst,round:0,
        koAlive:[],koStage:0,log:[],winner:null,userOut:false,userGames:[]};

function cupScheduleUser(){

   if(mine)c.userGames.push({md:CUP_GROUP_MARKS[r],round:grTag(r),
     opp:mine[0]===G.userTeam?mine[1]:mine[0],home:mine[0]===G.userTeam,played:false});

 }
}
/* The cup tie the president is actually due to play on a given cup mark, or null.
   A bye week, an elimination, a finished cup and a tie already played all return null,
   which is what keeps a president with no stake in the round from ever being shown a
   cup button: his round resolves inside the league sim exactly as it always did. */
function userCupTieAt(mark){

 return (c.userGames||[]).find(g=>g.md===mark&&!g.rest&&!g.played&&g.opp!=null)||null;

/* The league result deserves the same immediate feedback the cup already gives. A run
   of form is the thing a president actually feels, so a streak of three or more is
   reported instead of the table position; below that the table is more informative. */
function leagueStreak(){
 const r=G.results||[];
 if(!r.length)return{kind:null,n:0};
 const sign=m=>m.gf>m.ga?"W":m.gf<m.ga?"L":"D";
 const kind=sign(r[r.length-1]);
 let n=0;
 for(let i=r.length-1;i>=0;i--){if(sign(r[i])!==kind)break;n++;}
 return{kind,n};
}
/* Runs on its own rather than inside the toast, so form badges are earned whether or

   cleared at the turnover, so form cannot bleed from one campaign into the next. */
function checkFormBadges(){

 if(!st.kind)return;
 if(st.kind==="W"){

function playCupRound(){
 const c=G.cup;if(!c||c.winner!==null)return;
 if(c.phase==="group"){
   const r=c.round;
   c.groups.forEach(grp=>{
     c.tmpl[r].forEach(([x,y])=>{
       const h=grp[x],a=grp[y];
       const{hg,ag}=playTie(h,a,2);
       const H=c.gst[h],A=c.gst[a];
       H.P++;A.P++;H.GF+=hg;H.GA+=ag;A.GF+=ag;A.GA+=hg;
       if(hg>ag){H.W++;A.L++;H.Pts+=3}else if(hg<ag){A.W++;H.L++;A.Pts+=3}else{H.D++;A.D++;H.Pts++;A.Pts++}
       if(h===G.userTeam||a===G.userTeam){
         const home=h===G.userTeam,gf=home?hg:ag,ga=home?ag:hg;
         cupUserRecord(CUP_GROUP_MARKS[r],gf,ga);
         let prize=IN(gf>ga?GROUP_WIN:gf===ga?GROUP_DRAW:0);
         if(prize){T(G.userTeam).budget+=prize;}
         logAdd(`${CUP} ${grTag(r)}: ${T(h).name} ${hg}\u2013${ag} ${T(a).name}.`,prize||0);
         if(!QUIET)toast(`${CUP} ${grTag(r)}: ${T(h).name} ${hg}\u2013${ag} ${T(a).name}${prize?` (+${money(prize)})`:""}`);
       }
     });
   });
   c.round++;
   if(c.round===5)finishGroups();
 }else{
   const al=c.koAlive,winners=[];
   for(let i=0;i<al.length;i+=2){
     const h=al[i],a=al[i+1];
     let{hg,ag}=playTie(h,a,0);
     let pens=false;
     if(hg===ag){pens=true;if(Math.random()<.5)hg++;else ag++;}
     const wnr=hg>ag?h:a;winners.push(wnr);
     const line=`${T(h).name} ${hg}\u2013${ag} ${T(a).name}${pens?" (pens)":""}`;
     c.log.unshift({round:KO_NAMES[c.koStage],line});
     if(h===G.userTeam||a===G.userTeam){
       const home=h===G.userTeam;
       cupUserRecord(CUP_KO_MARKS[c.koStage],home?hg:ag,home?ag:hg,pens);
       const isFinal=c.koStage===KO_NAMES.length-1;   // last round is the final
       if(isFinal)awardBadge("cup_runners");
       {const _opp=home?a:h;if(wnr===G.userTeam&&T(_opp)&&(T(_opp).tier||0)<(T(G.userTeam).tier||0))awardBadge("giant_killers");}
       if(wnr===G.userTeam){const prize=IN(KO_PRIZE[c.koStage]);T(G.userTeam).budget+=prize;
         logAdd(`${CUP}: ${isFinal?"CHAMPIONS \u2014 the cup is yours!":"won the "+KO_NAMES[c.koStage]+"."}`,prize);
         if(!QUIET)toast(`${CUP} ${KO_NAMES[c.koStage]}: ${line} \u2014 ${isFinal?"you win the cup!":"you advance!"} +${money(prize)}`);}
       else{c.userOut=true;logAdd(`${CUP}: ${isFinal?"beaten in the final \u2014 runner-up.":"knocked out in the "+KO_NAMES[c.koStage]+"."}`);
         if(!QUIET)toast(`${CUP} ${KO_NAMES[c.koStage]}: ${line} \u2014 ${isFinal?"you are the cup runner-up.":"you are out."}`);}
     }

 }
}

/* ======================= SEASON TURNOVER ======================= */
function standingsOf(regionKey,tier){
 return tierClubs(regionKey,tier).map(id=>T(id))
   .sort((x,y)=>y.st.Pts-x.st.Pts||(y.st.GF-y.st.GA)-(x.st.GF-x.st.GA)||y.st.GF-x.st.GF);
