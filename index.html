<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Empire FC 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --night:#0d1531; --night2:#122048; --panel:#16295c; --panel2:#1d3570;
    --honey:#edbb00; --honey2:#ffd94d; --parch:#f3eedd; --muted:#93a7d6;
    --line:#2a4383; --grana:#a50044; --cel:#ffd94d; --ter:#c9cdd6; --tel:#d08a4a;
    --win:#5fd08a; --draw:#d9c25e; --loss:#ff6d94;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--night);color:var(--parch);
    font-family:"Open Sans",system-ui,sans-serif;font-size:14px;line-height:1.45;overscroll-behavior:none}
  #app{max-width:520px;margin:0 auto;min-height:100vh;padding-bottom:70px}
  @media(min-width:768px){#app,nav{max-width:740px}}
  h1,h2,h3{font-weight:800;letter-spacing:.01em;margin:0}
  .gold{color:var(--honey)}.muted{color:var(--muted)}.small{font-size:12px}
  .center{text-align:center}
  table,.big,.scoreline{font-variant-numeric:tabular-nums}
  header{padding:14px 16px 10px;border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:12px;position:sticky;top:0;background:var(--night);z-index:5}
  .crest{width:38px;height:38px;flex:none}
  header .t{flex:1}
  header h1{font-size:19px;color:var(--honey);line-height:1.1}
  header .sub{font-size:11px;color:var(--muted);margin-top:3px;letter-spacing:.06em;text-transform:uppercase}
  .wrap{padding:14px 14px 20px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
  .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
  .big{font-size:21px;font-weight:800;color:var(--honey2)}
  .stat{flex:1;text-align:center}
  .divider{height:1px;background:var(--line);margin:12px 0}
  button{font-family:inherit;cursor:pointer;border:none;border-radius:8px;font-size:13px}
  .btn{background:linear-gradient(180deg,var(--honey2),var(--honey));color:#241a00;
    font-weight:800;padding:12px 16px;width:100%;letter-spacing:.02em}
  .btn:active{transform:translateY(1px)}
  .btn.sec{background:var(--panel2);color:var(--parch);border:1px solid var(--line);font-weight:600}
  .btn.league{background:linear-gradient(180deg,#ffe27a,#e0b93a);color:#241a00}
  .btn.cup{background:linear-gradient(180deg,#ff8fc0,#d1447f);color:#3a0820}
  .btn.cont{background:linear-gradient(180deg,#7be3a4,#3fa96a);color:#062615}
  .btn.sm{padding:7px 11px;width:auto;font-size:12px}
  /* compact action buttons that live inside table rows without overflowing a phone */
  .btn.tiny{padding:5px 8px;width:auto;font-size:11px;white-space:nowrap;min-width:0;line-height:1.1}
  td.act{padding:5px 2px;white-space:nowrap}
  td.act .btn{margin:0}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  select,input[type=text]{background:var(--panel2);color:var(--parch);border:1px solid var(--line);
    border-radius:6px;padding:8px;font-size:13px;width:100%;font-family:inherit}
  table{width:100%;border-collapse:collapse;font-size:12px}
  th{color:var(--muted);font-weight:600;text-align:right;padding:6px 4px;font-size:10px;
    text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--line)}
  th.l,td.l{text-align:left}
  td{padding:7px 4px;text-align:right;border-bottom:1px solid rgba(56,44,96,.4)}
  tr.me td{background:rgba(165,0,68,.30);font-weight:700}
  tr.promo td:first-child{box-shadow:inset 3px 0 0 var(--win)}
  tr.releg td:first-child{box-shadow:inset 3px 0 0 var(--loss)}
  .pos{display:inline-block;width:34px;text-align:center;border-radius:4px;font-size:10px;
    padding:2px 0;font-weight:700}
  .GK{background:#4a3d1f;color:#f0d58a}.DEF{background:#2b3b52;color:#a9cdf0}
  .MID{background:#2e4a33;color:#a7e0b4}.FWD{background:#4d2b3a;color:#f0a9c4}
  .tierbadge{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
  .tier0{color:var(--cel)}.tier1{color:var(--ter)}.tier2{color:var(--tel)}
  .ret{color:#ff8fb3;font-weight:800;font-size:10px;margin-left:3px}
  .ageout{color:#ff8fb3;font-weight:800;font-size:10px;margin-left:3px}
  .injtag{color:var(--loss);font-size:10px;font-weight:700}
  nav{position:fixed;bottom:0;left:0;right:0;max-width:520px;margin:0 auto;
    background:var(--night2);border-top:1px solid var(--line);display:flex;height:66px;z-index:6}
  nav button{flex:1;background:none;color:var(--muted);font-size:9px;font-weight:700;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    text-transform:uppercase;letter-spacing:.04em;border-radius:0}
  nav button .ic{font-size:17px;line-height:1}
  nav button.on{color:var(--honey)}
  nav button.alert,nav button.alert .ic{color:var(--loss)}
  .start{padding:22px 18px}
  .teampick{display:flex;justify-content:space-between;align-items:center;padding:11px 12px;
    border:1px solid var(--line);border-radius:8px;margin-bottom:7px;background:var(--panel);cursor:pointer}
  .teampick:active{background:var(--panel2)}
  .pill{display:inline-block;padding:1px 6px;border-radius:999px;font-size:9px;font-weight:800;
    letter-spacing:.06em;text-transform:uppercase;background:var(--honey);color:#241a00;
    vertical-align:middle;margin-left:4px}
  .badge-lg{display:inline-block;padding:3px 9px;border-radius:5px;font-size:10px;font-weight:700;
    letter-spacing:.08em;text-transform:uppercase;background:var(--grana);color:#fff;border:1px solid transparent}
  .grp-h{font-weight:800;font-size:14px;margin:16px 0 9px;display:flex;align-items:center;gap:8px}
  .slider-row{margin:12px 0}
  .slider-row input{width:100%}
  .ends{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
  .scoreline{font-size:34px;font-weight:800;color:var(--honey2);text-align:center;letter-spacing:.02em}
  .fixt{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid rgba(56,44,96,.4);font-size:12px}
  .res-w{color:var(--win)}.res-d{color:var(--draw)}.res-l{color:var(--loss)}
  .cupfixt{background:rgba(165,0,68,.16);border-left:3px solid var(--grana);padding-left:6px;border-radius:4px}
  .cupmark{font-size:9px;font-weight:800;color:#ff9dc0;letter-spacing:.08em;width:30px}
  .amt-p{color:var(--win)}.amt-n{color:var(--loss)}
  .logline{padding:7px 0;border-bottom:1px solid rgba(56,44,96,.4);font-size:12px;display:flex;gap:8px;justify-content:space-between}
  .stars{color:var(--honey);letter-spacing:1px;font-size:11px}
  .pname{color:var(--honey2);text-decoration:underline;text-decoration-color:rgba(242,201,76,.35);cursor:pointer}
  .pname.goat{font-weight:800;color:#fff5cf;text-decoration-color:var(--honey)}
  .goatpill{display:inline-block;padding:1px 6px;border-radius:999px;font-size:9px;font-weight:800;
    letter-spacing:.06em;background:var(--honey);color:#241a00;margin-right:5px;vertical-align:middle}
  .tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -4px;padding:0 4px}
  .overlay{position:fixed;inset:0;background:rgba(5,9,26,.72);z-index:30;display:flex;align-items:flex-end;justify-content:center}
  @media(min-width:768px){.overlay{align-items:center}}
  .pcard{background:var(--panel);border:1px solid var(--line);border-radius:14px 14px 0 0;padding:18px;width:100%;max-width:440px;max-height:82vh;overflow:auto}
  @media(min-width:768px){.pcard{border-radius:14px}}
  .abar{height:8px;background:var(--night2);border-radius:4px;overflow:hidden;flex:1;margin:0 8px}
  .abar>div{height:100%;background:linear-gradient(90deg,var(--grana),var(--honey))}
  .arow{display:flex;align-items:center;font-size:11px;margin:6px 0}
  .arow .al{width:86px;white-space:nowrap;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
  .arow .av{width:26px;text-align:right;font-weight:700}
  .toastbox{position:fixed;bottom:78px;left:50%;transform:translateX(-50%);z-index:20;
    display:flex;flex-direction:column;align-items:center;gap:8px;width:max-content;max-width:92vw;pointer-events:none}
  .toast{background:var(--panel2);
    border:1px solid var(--honey);color:var(--parch);padding:10px 16px;border-radius:8px;font-size:12px;max-width:100%}
</style>

<body>
<div id="app"></div>
<script>
/* ========================================================================
   EMPIRE FC v4 — multi-region management sim
   3 regions (Deseret / Kauai / Brainrot) · 3 tiers x 10 clubs each
   ~720 players per region, self-renewing · geo names + 45 nationalities
   Regional cups · Conrad (continental) Cup · World Cup every 4 seasons
   Economy: gate, sponsors, merch, TV, stadium tiers · staff + Chief Scout
   Head coaches are individuals: name, age, tier, trait (what he optimizes FOR),
   contract, wage, prestige gate · market shared with AI clubs · compensation
   fees, sackings, renewals, retirement at 65, poaching, and trophy-driven growth
   Transfers across regions in a 3-day window · release players anytime
   Saves to this browser via localStorage (auto after each matchday)
   ======================================================================== */

const SAVE_KEY="empireFC2_v1";
/* ---- Empire FC 2: squad structure ----
   Senior squads are capped at 20 and every club runs an academy of up to 20 under-23s.
   Youth develop in the academy and must be promoted into a senior slot or moved on when
   they age out at 23, so talent flows through the club instead of being stockpiled. */
const SQUAD_MAX=20;      // senior squad cap
const SQUAD_MIN=12;      // cannot sell/release below this
const ACADEMY_MAX=20;    // academy cap
const ACADEMY_AGE=23;    // must leave the academy at this age
/* The old game throttled you to 2 approaches a day. In Empire FC 2 there is no cap on
   approaches at all: the real limiters are the 20-man squad, your budget, and the fact
   that a club which refuses you once is closed on that player for the season. Trade as
   hard as you like across the three days. offersMade is kept purely as a window tally. */
const rnd=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rnd(a,b+1));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const pick=a=>a[ri(0,a.length-1)];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=ri(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const money=n=>{const s=n<0?'-':'';n=Math.abs(Math.round(n));
  if(n>=1e6)return s+'£'+(n/1e6).toFixed(n>=1e7?0:1)+'M';
  if(n>=1e3)return s+'£'+Math.round(n/1e3)+'k';return s+'£'+n};

/* ---- Region name pools ---- */
/* ===================== REGIONS · NAMES · COUNTRIES (v4) ===================== */
const REGIONS=[
 {key:"deseret",name:"Deseret",tiers:["Salt Lake","Nauvoo","Kirtland"]},
 {key:"kauai",name:"Kauai",tiers:["Poipu","Napali","Princeville"]},
 {key:"founders",name:"Brainrot",tiers:["Sigma","Rizzler","Chud"]}];
const PER_TIER=10;                       // 10 clubs per tier, 30 per region
const TIER_GLYPH=["\u2600","\u263D","\u2726"];
const TIER_CLS=["tier0","tier1","tier2"];
function regionOf(key){return REGIONS.find(r=>r.key===key);}
function tierName(regionKey,tier){return regionOf(regionKey).tiers[tier];}

const REGION_CLUBS={

  "Ammonihah City","Arches City","Temple FC","Far West Athletic","Harmony Rovers",

  "Spouting Horn AC","Kukuiula Town","Poipu Bay FC","Mahaulepu United","Brennecke FC",

  "Crocodilo FC","Sahur Rovers","Bananini City","Assassino United","Frigo Camelo FC",
  "Bombombini Town","Papas Gatatas United","Bri Bri FC","Glorbo Fruttodrillo City","Tigrullini Rovers",
  "Orcalero FC","Trulimero United","Bobrito Bandito Town","Matteo City","Cocofanto FC",
  "Ambalabu United","Pipi Kiwi Rovers","Tracotocutulo FC","Bikini Camanini","Zibra Zubra United"]};
const REGION_EXPANSION={
 deseret:["FC Red Rocks","Handcart Athletic","Grid City","Teancum City","Real Brigham","Desolation United","Jacob City","Railroad Racing","St. George United","SLCFC"],
 kauai:["Hanapepe FC","Eleele United","Kaumakani Town","Puhi FC","Omao Athletic","Kilohana United","Wailua Bay FC"],
 founders:["Rhino Toasterino FC","Cacto Hipopotamo United","Ballerino Lololo Town","Tric Trac Baraboom FC","Pomni Ananas United","Svinino Bombondino Town","Ecco Cavallo FC"]};
const NAMES={
 deseret:{first:["Nephi","Lehi","Jacob","Enos","Mosiah","Benjamin","Alma","Amulek","Ammon","Aaron",
   "Helaman","Corianton","Moroni","Mormon","Ether","Jared","Zeniff","Limhi","Gideon","Abinadi",
   "Pahoran","Teancum","Lachoneus","Samuel","Mathoni","Shemnon","Zeezrom","Nehor","Amaleki","Zoram"],
  last:["Smith","Young","Pratt","Kimball","Snow","Taylor","Woodruff","Cowdery","Whitmer","Rigdon",
   "Cannon","Grant","Richards","Hyde","Benson","Talmage","Roberts","McKay","Eyring","Holland",
   "Maxwell","Packer","Monson","Nelson","Bednar","Uchtdorf","Rasband","Whitney","Bigler","Rockwell"]},

   "Manu","Nalu","Kanoa","Keahi","Palani","Kawika","Alaka","Hoku","Iolana","Maleko",
   "Noa","Kale","Pika","Aukai","Ekewaka","Haku","Konane","Lono","Makani","Pono"],
  last:["Kahale","Naeole","Kealoha","Akana","Kaohi","Mahoe","Kanahele","Pili","Aiona","Kauhane",
   "Hookano","Naki","Palakiko","Kekona","Akau","Napua","Kalama","Hema","Kaiwi","Makuakane",
   "Opunui","Kahaulelio","Nahale","Kealohi","Aki","Kapua","Lopaka","Malu","Kaeo","Hanohano"]},
 founders:{first:["Tralalero","Bombardiro","Tung","Cappuccino","Ballerina","Lirili","Chimpanzini","Patapim","Boneca","Trippi",
   "Crocodilo","Sahur","Bananini","Assassino","Bombombini","Glorbo","Tigrullini","Orcalero","Trulimero","Bobrito",
   "Cocofanto","Frigo","Girafa","Espresso","Zibra","Pipi","Matteo","Tracotocutulo","Brr","Rhino"],
  last:["Tralala","Crocodilo","Sahur","Assassino","Cappuccina","Larila","Bananini","Patapim","Ambalabu","Troppi",
   "Gusini","Fruttodrillo","Celeste","Bandito","Camelo","Signora","Bicus","Frulli","Toasterino","Zubra",
   "Bombardino","Lololo","Baraboom","Ananas","Cavallo","Kiwi","Milo","Frutti","Sahurini","Tralalelo"]}};
const COUNTRIES=["USA","Canada","Mexico","Argentina","Brazil","France","England","Spain","Portugal","Germany","Netherlands","Italy","Belgium","Croatia","Uruguay","Colombia","Japan","South Korea","Morocco","Senegal","Switzerland","Denmark","Poland","Serbia","Ecuador","Australia","Nigeria","Ghana","Ivory Coast","Cameroon","Egypt","Tunisia","Algeria","Peru","Chile","Paraguay","Sweden","Norway","Austria","Ukraine","Turkey","Greece","Scotland","Wales","Iran"];

const SCOUT_TIERS={   // roster reveal cost per club, resets each season
  none:{label:"No scout",cost:1000000,pot:false,wage:0},
  bronze:{label:"Bronze Scout",cost:400000,pot:true,wage:8000},
  silver:{label:"Silver Scout",cost:250000,pot:true,wage:16000},
  gold:{label:"Gold Scout",cost:100000,pot:true,wage:30000}};
const XFER_PER_OVR=1000000;
const REGION_CUP={deseret:"The Liahona Cup",kauai:"The Napali Cup",founders:"The Brainrot Cup"};
function cupName(regionKey){return REGION_CUP[regionKey||userRegionKey()]||"Regional Cup";}
Object.defineProperty(globalThis,"CUP",{get(){try{return G&&G.userTeam!=null?cupName(userRegionKey()):"Regional Cup"}catch(e){return "Regional Cup"}}});
const CONT_CUP="The Conrad Cup";
const WORLD_CUP="The World Cup";
const SEASON_LEN=18;                      // 10-club double round-robin
const CUP_GROUP_MARKS=[2,4,6,8,10];       // 5 group rounds
const CUP_KO_MARKS=[12,14,16,18];        // 4 knockout rounds (R16 -> final)
const ALL_CUP_MARKS=[...CUP_GROUP_MARKS,...CUP_KO_MARKS];
const KO_NAMES=["Round of 16","Quarterfinal","Semifinal","Final"];
const KO_PRIZE=[250000,500000,900000,1600000];
const GROUP_WIN=40000,GROUP_DRAW=15000,QUALIFY_BONUS=100000;

const FORMATIONS={
 "4-4-2":{DEF:4,MID:4,FWD:2},"4-3-3":{DEF:4,MID:3,FWD:3},
 "3-5-2":{DEF:3,MID:5,FWD:2},"5-3-2":{DEF:5,MID:3,FWD:2},"4-5-1":{DEF:4,MID:5,FWD:1}};
const ATKW={GK:.02,DEF:.15,MID:.55,FWD:1.0};
const DEFW={GK:1.15,DEF:1.0,MID:.45,FWD:.1};

const COACH_TIERS=[
 {label:"No head coach",wage:0,boost:0,
  desc:"You pick the side, the shape and the tactics yourself."},
 {label:"Head Coach",wage:8000,boost:0.8,
  desc:"Auto-picks your strongest available XI in your chosen formation."},
 {label:"Senior Coach",wage:18000,boost:1.6,
  desc:"Everything above, and chooses the formation that best suits your squad."},
 {label:"Elite Coach",wage:32000,boost:2.5,
  desc:"Everything above, and tunes all five tactical dials to suit the XI he picks."}];
/* A trait does not make a coach better. It changes what he aims at, so there
   is no single best hire: the right coach is a read on your squad and your
   ambition. This is what turns the coach from a purchase into a decision. */
const COACH_TRAITS={
 pragmatist:{label:"Pragmatist",
  desc:"Sets the side up to concede as little as possible. Priceless when outgunned, frustrating in a title chase."},
 idealist:{label:"Idealist",
  desc:"Refuses to set up defensively \u2014 your mentality never drops below 70, and he will not play a 5-3-2 or 4-5-1. Thrilling with a strong squad, reckless with a weak one."},
 youth:{label:"Youth developer",
  desc:"Fields under-23s over marginally better veterans, and your young players develop faster every summer. Costs you today, pays off in three years."},
 rotator:{label:"Rotator",
  desc:"Spreads minutes across the squad. Noticeably fewer injuries, a slightly weaker starting XI."},
 tactician:{label:"Tactician",
  desc:"Prepares for the actual next opponent \u2014 their team, their tactics, the venue \u2014 where other coaches tune against a league-average rival."},
 manman:{label:"Man manager",
  desc:"Injuries heal faster under his care, and red-card bans are often argued down on appeal."}};
function coachTier(){return G.coach?Math.max(1,Math.min(3,G.coach.tier)):0;}
function coachInfo(){return COACH_TIERS[coachTier()];}
function coachTraitInfo(){return G.coach?COACH_TRAITS[G.coach.trait]:null;}
function coachWage(tier,age){
 // older coaches come cheaper: you are buying fewer years
 const base=[0,8000,18000,32000][tier];
 const ageF=clamp(1-(age-38)*0.012,0.62,1.12);
 return Math.max(3000,Math.round(base*ageF*rnd(0.9,1.15)/500)*500);
}
/* Coaches carry Founding Father names — firsts and lasts mixed freely, so you
   get the occasional Gouverneur Hancock or Button Jefferson. */
const COACH_FIRST=["George","Thomas","Benjamin","Alexander","John","Samuel","James","Patrick",
 "Aaron","Gouverneur","Elbridge","Rufus","Roger","Josiah","Button","Caesar","Lyman","Artemas",
 "Ethan","Israel","Nathanael","Charles","Richard","Francis","Gunning","Jared","Abraham","Robert",
 "William","Henry"];
const COACH_LAST=["Washington","Jefferson","Franklin","Hamilton","Adams","Madison","Monroe","Jay",
 "Hancock","Revere","Henry","Burr","Morris","Gerry","Sherman","Rutledge","Pinckney","Livingston",
 "Witherspoon","Wythe","Mason","Dickinson","Randolph","Gwinnett","Bartlett","Hopkinson","Ellsworth",
 "Laurens","Knox","Greene"];
function genCoach(id){
 const tier=pick([1,1,1,2,2,2,3,3]);
 const age=ri(35,63);
 const c={id,name:pick(COACH_FIRST)+" "+pick(COACH_LAST),age,tier,
   trait:pick(Object.keys(COACH_TRAITS)),club:null,
   prestigeReq:tier===1?0:tier===2?ri(10,24):ri(30,55)};
 c.wage=coachWage(tier,age);
 return c;
}
function genCoachPool(){
 const pool=[];
 if(G.nextCoachId==null)G.nextCoachId=1000;
 for(let i=0;i<12;i++)pool.push(genCoach(G.nextCoachId++));
 // some are already in work at AI clubs; prising them out costs compensation
 pool.forEach(c=>{if(Math.random()<0.4){
   const clubs=G.teams.filter(t=>t.id!==G.userTeam&&(t.prestige||0)>=c.prestigeReq);
   if(clubs.length)c.club=pick(clubs).id;}});
 ensureCoachTraitCoverage(pool);
 return pool;
}
/* A president must always be able to find at least one of every coach type on the
   open market, so guarantee a hireable free agent of each trait exists. */
function ensureCoachTraitCoverage(pool){
 pool=pool||G.coachPool;if(!pool)return pool;

 for(const trait of Object.keys(COACH_TRAITS)){
   if(pool.some(c=>c.trait===trait&&c.club==null))continue;   // already available
   const emp=pool.find(c=>c.trait===trait&&c.club!=null);
   if(emp){emp.club=null;continue;}                            // free up an employed one
   const c=genCoach(G.nextCoachId++);c.trait=trait;c.club=null;pool.push(c);
 }
 return pool;
}

   +Math.max(0,(G.coach.contract||1)-1)*SEASON_LEN;

/* ---- attribute + rating helpers ---- */
/* Outfielders and keepers are rated on entirely separate metrics. A keeper's
   game has nothing to do with pace or shooting, so he gets his own six. The
   match engine reads only p.ovr and position, so these feed rating, growth and
   the player card — not the simulation directly. */
const OUTFIELD_ATTRS=["pace","shooting","passing","defending","physical","technique"];
const GK_ATTRS=["reflexes","handling","positioning","aerial","kicking","command"];
function attrsFor(pos){return pos==="GK"?GK_ATTRS:OUTFIELD_ATTRS;}
const TILT={
 GK:{reflexes:0,handling:0,positioning:0,aerial:0,kicking:0,command:0},
 DEF:{pace:2,shooting:-16,passing:-2,defending:15,physical:9,technique:-5},
 MID:{pace:2,shooting:-2,passing:11,defending:-2,physical:-3,technique:9},
 FWD:{pace:9,shooting:15,passing:-2,defending:-18,physical:-3,technique:7}};
const OVR_W={
 GK:{reflexes:.34,positioning:.24,handling:.20,aerial:.12,kicking:.06,command:.04},
 DEF:{defending:.4,physical:.24,pace:.15,passing:.11,technique:.1},
 MID:{passing:.3,technique:.26,defending:.14,physical:.15,pace:.15},
 FWD:{shooting:.35,pace:.25,technique:.2,passing:.1,physical:.1}};
/* TILT boosts the very attributes OVR_W weights most, so it used to be counted
   twice and handed every player a free bonus unrelated to potential (up to +8.4
   for forwards). Precompute that premium and subtract it, so a player's OVR
   tracks the age curve and potential is a genuine ceiling. */
const TILT_BIAS={};
for(const _pos in OVR_W){let _b=0;
 for(const _k in OVR_W[_pos])_b+=(TILT[_pos][_k]||0)*OVR_W[_pos][_k];
 TILT_BIAS[_pos]=_b;}
function effPot(p){return p.bust?(p.bustCeil||60):p.pot;}   // hidden true ceiling for busts
function setOvr(p){p.ovr=Math.min(calcOvr(p),effPot(p));return p.ovr;}
const ATTRS=OUTFIELD_ATTRS;   // alias kept for outfield-only call sites

function ovrFromAge(pot,age){
 const peak=27;let f;
 if(age<=peak)f=.60+.40*(age-16)/(peak-16);
 else f=1-.45*(age-peak)/(40-peak);
 return clamp(pot*f,20,99);}
function calcOvr(p){let o=0;for(const k in OVR_W[p.pos])o+=p[k]*OVR_W[p.pos][k];return Math.round(o);}
function makeAttrs(p){
 // Attributes are built from the player's EFFECTIVE ceiling, not his shown potential,
 // so a bust's metrics stay in line with his (capped) OVR instead of reading 90s while
 // the OVR sits at 57. For everyone else effPot === pot, so nothing changes.
 const base=ovrFromAge(effPot(p),p.age)-(TILT_BIAS[p.pos]||0),t=TILT[p.pos];
 for(const a of attrsFor(p.pos))p[a]=clamp(Math.round(base+t[a]+rnd(-6,6)),18,99);
 setOvr(p);}
function valueOf(p){
 let v=Math.pow(p.ovr/100,3)*42e6;
 if(p.age<24)v*=1.35;else if(p.age<30)v*=1.15;else if(p.age<34)v*=.75;else v*=.38;
 if(p.pot-p.ovr>10&&p.age<23)v*=1.35;
 return Math.max(40000,Math.round(v/10000)*10000);}
function wageOf(p){return Math.max(500,Math.round(valueOf(p)*.0006/100)*100);}

/* A prospect his own club can't fit is not simply discarded: smaller clubs are glad of

function placeReleasedYouth(p,fromId){

   .sort((a,b)=>(a.prestige||0)-(b.prestige||0));   // weaker clubs get first pick

 })||wants[0];
 if(!suitor)return null;
 detachPlayer(p);
 joinClub(p,suitor.id);p.team=suitor.id;suitor.squad.push(p.id);

 delete p.unhappySince;delete p.promised;

     teams.push(t);return t;});

function makeFixtures(n){
 let arr=[...Array(n).keys()];if(n%2)arr.push(-1);
 const m=arr.length,rounds=[];
 for(let r=0;r<m-1;r++){
   const rd=[];
   for(let i=0;i<m/2;i++){
     const h=arr[i],a=arr[m-1-i];
     if(h!==-1&&a!==-1)rd.push(r%2?[a,h]:[h,a]);
   }
   rounds.push(rd);
   arr=[arr[0],arr[m-1],...arr.slice(1,m-1)];
 }
 return rounds.concat(rounds.map(rd=>rd.map(([h,a])=>[a,h])));
}

   "clear browsing data" wipes it). A downloadable/shareable backup is a durable
   copy the player physically owns and can move between devices. */
function saveFileName(){
 const club=(userTeamObj()&&userTeamObj().name||"empire-fc").toLowerCase()
   .replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"")||"club";

function downloadBlob(blob,fname){
 try{
   const url=URL.createObjectURL(blob);
   const a=document.createElement("a");
   a.href=url;a.download=fname;a.style.display="none";
   document.body.appendChild(a);a.click();
   setTimeout(()=>{try{URL.revokeObjectURL(url);a.remove();}catch(e){}},1500);
   toast("Backup downloaded. Keep it somewhere safe.");
 }catch(e){toast("Could not create the backup file.");}
}
function exportSave(){
 if(!G||G.userTeam==null)return toast("Start or load a game before exporting.");
 saveGame(true);                       // make sure the on-disk copy is current first
 const fname=saveFileName();
 let json;try{json=JSON.stringify(G);}catch(e){return toast("Could not serialize the save.");}
 const blob=new Blob([json],{type:"application/json"});
 // On mobile, prefer the native share sheet so the player can send the backup
 // to themselves (AirDrop, Messages, iCloud, Drive) in one gesture. Fall back
 // to a plain download on desktop or where sharing files isn't supported.
 let file=null;try{file=new File([blob],fname,{type:"application/json"});}catch(e){}
 if(file&&navigator.canShare&&navigator.canShare({files:[file]})&&navigator.share){
   navigator.share({files:[file],title:"Empire FC 2 save",
     text:`Empire FC 2 backup \u2014 ${userTeamObj().name}, Season ${G.season}`})
     .then(()=>toast("Backup shared. Keep it somewhere safe."))
     .catch(err=>{if(!err||err.name!=="AbortError")downloadBlob(blob,fname);});
   return;

}
function importSaveText(text){
 // Validate hard, then run the SAME hydrate path as a disk load. Returns
 // {ok:true} or {ok:false,msg}. Never eval; only JSON.parse. On any failure the
 // previous game is left untouched.
 let g;
 try{g=JSON.parse(text);}
 catch(e){return{ok:false,msg:"That file isn't valid JSON \u2014 not an Empire FC 2 save."};}
 if(!g||typeof g!=="object")return{ok:false,msg:"That file isn't an Empire FC 2 save."};
 if(g.ver!==4)return{ok:false,msg:"That save is from an incompatible version and can't be loaded."};
 if(!Array.isArray(g.teams)||!g.teams.length||!Array.isArray(g.players)||!g.players.length||g.userTeam==null)
   return{ok:false,msg:"That save is missing core data and looks corrupted."};
 delete g._goat;                       // pure cache, rebuilt on demand
 const backup=G;
 try{
   G=g;hydrateLoadedG();
   if(!userTeamObj()){G=backup;if(backup)rebuildIndex();return{ok:false,msg:"That save's club is missing and it can't be loaded."};}
 }catch(e){

/* ======================= MATCH ENGINE ======================= */
function fit(list){return list.filter(p=>p.inj<=0&&(p.susp||0)<=0);}
function averageRival(){
 // a league-average opponent from your own division, used to judge shape and dials
 const t=userTeamObj();
 const peers=tierClubs(t.region,t.tier).filter(id=>id!==G.userTeam).map(T).filter(Boolean);
 if(!peers.length)return{atk:60,def:60};
 let atk=0,def=0;
 peers.forEach(pt=>{const s=strength(autoXI(pt,"4-4-2"));atk+=s.atk;def+=s.def});
 return{atk:atk/peers.length,def:def/peers.length};
}
function nextOpponent(){
 // The actual next fixture: whichever of the league game or a cup tie plays first.
 // Returns {strength, tac, name, homeAdv, comp} or null in the off-season.
 if(G.matchday>=SEASON_LEN)return null;
 // league opponent this matchday
 let league=null;
 const t=userTeamObj(),tt=tierClubs(t.region,t.tier),li=tt.indexOf(G.userTeam);
 const fx=G.fixtures[G.matchday];
 for(const[i,j]of fx){if(i===li||j===li){
   const oppId=tt[i===li?j:i];
   league={id:oppId,home:i===li,comp:"league"};break;}}
 // cup tie attached to THIS matchday (plays right after it)
 let cup=null;
 if(G.cup&&G.cup.userGames){
   const g=G.cup.userGames.find(x=>!x.played&&!x.rest&&x.md===G.matchday+1&&x.opp!=null);
   if(g&&T(g.opp))cup={id:g.opp,home:g.home,comp:"cup"};
 }
 // the league game plays first on a shared matchday; prefer the nearer contest,
 // and when both exist the cup tie is the marquee game to prepare for
 const pickd=cup||league;
 if(!pickd||!T(pickd.id))return null;
 const opp=T(pickd.id);
 return{strength:strength(autoXI(opp,"4-4-2")),tac:teamTac(opp.id),
   name:opp.name,homeAdv:pickd.home?3:0,comp:pickd.comp};
}
function coachBestFormation(){
 // tier 2+: try every shape and keep the one that best serves what THIS coach
 // optimizes for. A Pragmatist keeps the ball out; an Idealist chases goals.
 const t=userTeamObj(),rival=averageRival(),neu={mentality:50,pressing:50,tempo:50,width:50,line:50};
 const c=G.coach,obj=coachObjective();
 let best=null;
 for(const f in FORMATIONS){
   if(c&&c.trait==="idealist"&&(f==="5-3-2"||f==="4-5-1"))continue;   // will not set up defensively
   const xi=autoXI(t,f);if(xi.length<11)continue;
   const[xh,xa]=xgPair(strength(xi),rival,neu,neu,teamBoost(G.userTeam),0,1.5);
   const s=obj(xh,xa);
   if(!best||s>best.s)best={f,s};
 }
 return best?best.f:G.formation;
}
function coachBestTactics(xi){
 // tier 3: search the dial space using the real match maths. A Tactician
 // prepares for the actual next opponent (their XI, their tactics, the venue);
 // every other coach tunes against a league-average rival.
 const c=G.coach;
 const nx=(c&&c.trait==="tactician")?nextOpponent():null;
 const rival=nx?nx.strength:averageRival();
 const rTac=nx?nx.tac:{mentality:50,pressing:50,tempo:50,width:50,line:50};
 const adv=nx?nx.homeAdv:1.5;
 const neu={mentality:50,pressing:50,tempo:50,width:50,line:50};
 const sH=strength(xi),boost=teamBoost(G.userTeam);
 const oppBoost=nx?0.8:0;   // assume a competent opposing bench
 const obj=coachObjective();
 const score=d=>{const[xh,xa]=xgPair(sH,rival,d,rTac,boost,oppBoost,adv);return obj(xh,xa);};
 const mMin=(c&&c.trait==="idealist")?70:0;   // the Idealist will not sit back
 // Two passes instead of a flat 161k-point grid: a coarse sweep at step 25
 // (3,125 evals) then a local refine at step 5 around the winner (~3,125).
 // ~96% fewer evaluations, and finer resolution than the old single pass.
 let best=null;
 for(let m=mMin;m<=100;m+=25)for(let p=0;p<=100;p+=25)for(let tp=0;tp<=100;tp+=25)
 for(let w=0;w<=100;w+=25)for(let l=0;l<=100;l+=25){
   const d={mentality:m,pressing:p,tempo:tp,width:w,line:l};
   const s=score(d);
   if(!best||s>best.s)best={d,s};
 }
 if(!best)return mMin?{...neu,mentality:mMin}:neu;
 const b=best.d,R=v=>[Math.max(0,v-20),Math.min(100,v+20)];
 const[m0,m1]=[Math.max(mMin,b.mentality-20),Math.min(100,b.mentality+20)],
       [p0,p1]=R(b.pressing),[t0,t1]=R(b.tempo),
       [w0,w1]=R(b.width),[l0,l1]=R(b.line);
 for(let m=m0;m<=m1;m+=10)for(let p=p0;p<=p1;p+=10)for(let tp=t0;tp<=t1;tp+=10)
 for(let w=w0;w<=w1;w+=10)for(let l=l0;l<=l1;l+=10){
   const d={mentality:m,pressing:p,tempo:tp,width:w,line:l};
   const s=score(d);
   if(s>best.s)best={d,s};
 }
 return best.d;
}
function coachPickXI(t){
 // the trait bends WHO gets picked, not just how well
 const c=G.coach;
 let xi=autoXI(t,G.formation);
 if(!c)return xi;
 const pool=fit(squadOf(t));
 const inXI=new Set(xi.map(p=>p.id));
 if(c.trait==="youth"){
   // an under-23 within 3 OVR of the veteran gets the shirt
   xi=xi.map(p=>{
     if(p.pos==="GK"||p.age<23)return p;
     const kid=pool.filter(k=>k.pos===p.pos&&k.age<23&&!inXI.has(k.id)&&p.ovr-k.ovr<=3)
       .sort((a,b)=>b.ovr-a.ovr)[0];
     if(kid){inXI.delete(p.id);inXI.add(kid.id);return kid;}
     return p;
   });
 }
 if(c.trait==="rotator"){
   // two outfield starters make way so legs stay fresh
   shuffle(xi.filter(p=>p.pos!=="GK")).slice(0,2).forEach(st=>{
     const sub=pool.filter(k=>k.pos===st.pos&&!inXI.has(k.id)&&st.ovr-k.ovr<=8)
       .sort((a,b)=>b.ovr-a.ovr)[0];
     if(sub){const idx=xi.indexOf(st);if(idx>=0){xi[idx]=sub;inXI.delete(st.id);inXI.add(sub.id);}}
   });
 }
 return xi;
}
function coachRunSetup(){

function coachAutoSetup(){

function autoXI(team,formation,useAll){
 const F=FORMATIONS[formation];
 const pool=useAll?squadOf(team):fit(squadOf(team));
 const by=(a,b)=>b.ovr-a.ovr;
 const g=pool.filter(p=>p.pos==="GK").sort(by).slice(0,1);
 const d=pool.filter(p=>p.pos==="DEF").sort(by).slice(0,F.DEF);
 const m=pool.filter(p=>p.pos==="MID").sort(by).slice(0,F.MID);
 const f=pool.filter(p=>p.pos==="FWD").sort(by).slice(0,F.FWD);
 let xi=[...g,...d,...m,...f];
 if(xi.length<11){const used=new Set(xi.map(p=>p.id));
   pool.filter(p=>!used.has(p.id)).sort(by).forEach(p=>{if(xi.length<11)xi.push(p)});}
 if(xi.length<11&&!useAll)return autoXI(team,formation,true);
 return xi;
}
function strength(xi){
 let atk=0,def=0,wa=0,wd=0;
 xi.forEach(p=>{atk+=p.ovr*ATKW[p.pos];wa+=ATKW[p.pos];def+=p.ovr*DEFW[p.pos];wd+=DEFW[p.pos]});
 return{atk:atk/(wa||1),def:def/(wd||1)};
}
function poisson(l){let L=Math.exp(-l),k=0,p=1;do{k++;p*=Math.random()}while(p>L);return k-1;}
const NEU={mentality:50,pressing:50};
const AI_ATT={mentality:72,pressing:62,tempo:68,width:62,line:66};
const AI_DEF={mentality:32,pressing:42,tempo:38,width:40,line:34};
/* ---- club identity: hidden traits for AI clubs, revealed by scouting ---- */
const CLUB_TRAITS={
 selling:{label:"Selling club",desc:"Cashes in on anyone past 27 and accepts below-market fees. A good place to shop."},
 hoarder:{label:"Hoarders",desc:"Demands a heavy premium and clings to its squad. Hard to do business with."},
 youth:{label:"Youth academy",desc:"Develops its under-23s faster than anyone and buys for the future."},
 local:{label:"Local talent",desc:"Signs only players born in its own region."},
 attacking:{label:"Attacking philosophy",desc:"Plays high and fast. Scores freely and concedes freely."},
 defensive:{label:"Defensive philosophy",desc:"Sits deep and grinds out low-scoring games."}};
// weighted by tier: big clubs hoard and have a style, small clubs sell and develop
const TRAIT_WEIGHTS=[
 ["hoarder","hoarder","attacking","attacking","defensive","defensive","youth"],
 ["attacking","defensive","youth","youth","local","selling","hoarder"],
 ["selling","selling","youth","local","local","defensive","attacking"]];
function assignTrait(tier){return pick(TRAIT_WEIGHTS[tier]||TRAIT_WEIGHTS[2]);}
function traitOf(t){return t&&t.trait?CLUB_TRAITS[t.trait]:null;}
const SCORE_W={GK:.01,DEF:.25,MID:1,FWD:2.2};
function attributeGoals(xi,n){
 const scorers=[];
 const w=xi.map(p=>p.pos==="GK"?SCORE_W.GK*4:SCORE_W[p.pos]*(p.shooting+p.technique*.4));
 const tot=w.reduce((a,b)=>a+b,0);
 for(let g=0;g<n;g++){
   let r=Math.random()*tot;let k=0;
   while(r>w[k]&&k<w.length-1){r-=w[k];k++}
   const p=xi[k];p.gs=(p.gs||0)+1;p.gc=(p.gc||0)+1;scorers.push(p.name);
   // credit the club he plays for now; the tally stays frozen once he leaves,
   // so a rising youngster can one day overtake a departed legend
   if(p.team!=null){const cl=T(p.team);if(cl){if(!cl.scorers)cl.scorers={};
     const e=cl.scorers[p.id]||(cl.scorers[p.id]={name:p.name,pos:p.pos,goals:0});
     e.goals++;e.name=p.name;}}
 }
 return scorers;
}
function playTie(h,a,adv){
 const hXI=teamXI(h),aXI=teamXI(a);
 const[hg,ag]=simMatch(hXI,aXI,teamTac(h),teamTac(a),teamBoost(h,true),teamBoost(a,false),adv);
 [...hXI,...aXI].forEach(p=>{p.as=(p.as||0)+1;p.ac=(p.ac||0)+1});
 return{hg,ag,hs:attributeGoals(hXI,hg),asc:attributeGoals(aXI,ag)};
}
function xgPair(hXI,aXI,hTac,aTac,hBoost,aBoost,homeAdv=3){
 const sH=hXI.atk!==undefined?hXI:strength(hXI),sA=aXI.atk!==undefined?aXI:strength(aXI);
 const mH=(hTac.mentality-50),mA=(aTac.mentality-50);
 const pH=(hTac.pressing-50),pA=(aTac.pressing-50);
 const tmpH=((hTac.tempo||50)-50),tmpA=((aTac.tempo||50)-50);
 const wdH=((hTac.width||50)-50),wdA=((aTac.width||50)-50);
 const lnH=((hTac.line||50)-50),lnA=((aTac.line||50)-50);
 // tempo: faster = more chances both ways. width: wide = more attack, thinner defense.
 // line: high = presses opponent (cuts their attack) but concedes space in behind.
 // Every dial must cost something, or sliding all five to 100 is a free win.
 // tempo opens the game up for BOTH sides. A high line pins the opponent back
 // but leaves space in behind. Attacking intent and pressing cost real shape.
 // Costs are tuned so each dial's marginal gain roughly equals its marginal cost
 // for a balanced side. That makes the best settings depend on your squad and
 // your opponent rather than "slide everything to 100".
 const atkH=sH.atk+mH*.08+pH*.04+tmpH*.03+wdH*.03+tmpA*.045+homeAdv+hBoost;
 const atkA=sA.atk+mA*.08+pA*.04+tmpA*.03+wdA*.03+tmpH*.045+aBoost;
 const defH=sH.def-Math.max(0,mH)*.12-Math.max(0,pH)*.06-wdH*.045-lnA*.04-lnH*.06+hBoost*.6;
 const defA=sA.def-Math.max(0,mA)*.12-Math.max(0,pA)*.06-wdA*.045-lnH*.04-lnA*.06+aBoost*.6;
 const var_=1+(tmpH+tmpA)/400;   // fast tempo widens score variance
 return[clamp(1.35*var_*Math.exp((atkH-defA)/22),.12,6),
        clamp(1.12*var_*Math.exp((atkA-defH)/22),.12,6)];
}
function simMatch(hXI,aXI,hTac,aTac,hBoost,aBoost,homeAdv=3){
 const[xgH,xgA]=xgPair(hXI,aXI,hTac,aTac,hBoost,aBoost,homeAdv);
 return[poisson(xgH),poisson(xgA)];
}
function teamXI(id){
 return id===G.userTeam?userStartXI():autoXI(T(id),"4-4-2");}
function teamTac(id){
 if(id===G.userTeam){
   // an Idealist overrules any instruction to sit back
   if(G.coach&&G.coach.trait==="idealist"&&G.tactics.mentality<70)
     return{...G.tactics,mentality:70};
   return G.tactics;
 }
 const t=T(id);
 if(t&&t.trait==="attacking")return AI_ATT;
 if(t&&t.trait==="defensive")return AI_DEF;

function teamBoost(id,home){
 const t=T(id);
 // base coaching edge (user's real coach; AI carries an implicit setup by level)
 let b = (id===G.userTeam) ? coachInfo().boost : (t?([1.6,0.8,0.4][t.tier]||0.4):0);
 if(!t)return b;
 // Office assets, available to every club: supporters lift the side at home, the
 // team jet keeps them fresh on the road. 'home' is undefined for neutral estimates.
 if(home===true && hasSupporters(t)) b+=SUPPORTER_BOOST;

}
function applyResult(h,a,hg,ag){
 const H=T(h).st,A=T(a).st;
 H.P++;A.P++;H.GF+=hg;H.GA+=ag;A.GF+=ag;A.GA+=hg;
 if(hg>ag){H.W++;A.L++;H.Pts+=3}else if(hg<ag){A.W++;H.L++;A.Pts+=3}else{H.D++;A.D++;H.Pts++;A.Pts++}
}

/* ======================= MATCHDAY LOOP ======================= */
function logAdd(text,amt){
 G.log.unshift({s:G.season,md:G.matchday,text,amt:amt||0});
 if(G.log.length>60)G.log.length=60;

function playMatchday(){
 // an unanswered contract demand expires when the season kicks off: he walks
 if(G.coachRenewal&&G.coach){
   logAdd(`${G.coach.name} walked away \u2014 his contract demand went unanswered.`);
   toast(`${G.coach.name} has left the club.`);
   releaseCoachToPool(G.coach);G.coach=null;delete G.coachRenewal;
 }
 // heal one matchday of injuries before selection (suspensions are served this match, cleared after)
 // a Man manager's treatment room often shaves an extra day off
 const _mm=G.coach&&G.coach.trait==="manman";
 G.players.forEach(p=>{if(p.inj>0){p.inj--;
   if(_mm&&p.team===G.userTeam&&p.inj>0&&Math.random()<0.5)p.inj--;}});
 // fully delegated: the coach sets the side himself before every kickoff.
 // Runs now that injuries have healed and before the fixture is read, so a
 // Tactician still prepares for this exact opponent.
 if(G.coachAuto&&coachTier()>0)coachRunSetup();
 if(G.matchday===0){G.badgeStats=G.badgeStats||{};G.badgeStats.seasonStartBudget=userTeamObj().budget;}
 // Every 5 seasons, right before the last league matchday, drop the bomb: every club
 // loses one key player to an off-field crisis. Guarded so it fires once per cycle.
 if(G.season>0&&G.season%5===0&&G.matchday===SEASON_LEN-1&&!G.bombDone){G.bombDone=G.season;fiveYearBomb();}
 const fx=G.fixtures[G.matchday],out=[];
 let userHome=null,userOpp=null;
 REGIONS.forEach(reg=>{
   for(let tier=0;tier<3;tier++){
     const clubs=tierClubs(reg.key,tier);
     fx.forEach(([i,j])=>{
       const h=clubs[i],a=clubs[j];
       if(h===G.userTeam){userHome=true;userOpp=a;}if(a===G.userTeam){userHome=false;userOpp=h;}
       const{hg,ag,hs,asc}=playTie(h,a,3);
       applyResult(h,a,hg,ag);
       if(h===G.userTeam||a===G.userTeam){const home=h===G.userTeam;
         G.results.push({md:G.matchday,opp:home?a:h,home,gf:home?hg:ag,ga:home?ag:hg});
         G.lastScorers={mine:home?hs:asc,theirs:home?asc:hs};
         const _gf=home?hg:ag,_ga=home?ag:hg;
         settleMatchBet(_gf,_ga);
         if(!home&&_gf>_ga&&jetActive(userTeamObj())){G.badgeStats=G.badgeStats||{};G.badgeStats.awayJetWins=(G.badgeStats.awayJetWins||0)+1;}
         if(G.bombVictimPending){if(_gf>_ga)awardBadge("next_man_up");G.bombVictimPending=false;}}
       out.push({region:reg.key,tier,h,a,hg,ag});
     });
   }
 });
 G.lastResults=out;G.matchday++;
 awardBadge("first_whistle");
 if(G.lastScorers&&G.lastScorers.mine&&G.lastScorers.mine.length){
   awardBadge("first_goal");
   const cc={};G.lastScorers.mine.forEach(n=>cc[n]=(cc[n]||0)+1);
   if(Object.values(cc).some(c=>c>=3))awardBadge("hat_trick");
 }
 // a player who sat out this match has now served the ban
 G.players.forEach(p=>{if(p.susp>0)p.susp--});
 financeTick(userHome===true,userOpp);
 aiFinanceTick();
 maybeInjury();
 maybeEvent();
 aiTransfers();
 if(ALL_CUP_MARKS.includes(G.matchday))playCupRound();
 checkBadges();
 saveGame(true);
}

/* ---- economy ---- */
function repOf(t){
 // current form (tier + league position) blended with accumulated prestige.
 // Prestige is deliberately capped at ~a third of reputation so a storied club
 // that falls off still declines, and a newcomer can still rise.
 const tbl=standingsOf(t.region,t.tier),rank=tbl.indexOf(t)+1;
 const form=clamp((2-t.tier)*.28+(PER_TIER-rank)/PER_TIER*.4,0,1);
 const pres=clamp((t.prestige||0)/PRESTIGE_MAX,0,1);
 return clamp(form*0.65+pres*0.35,0,1);}
function effCapacity(t){
 // during construction the club uses a temporary ground at ~55% capacity
 return (t.building>0)?Math.round(t.capacity*0.55):t.capacity;}
function universeGoatId(){
 // the single best attacking player alive (MID or FWD): OVR first, then career
 // goals, apps, id. Memoized per matchday so attendance/preview calls stay cheap.
 const key=G.season+"-"+G.matchday;
 if(G._goat&&G._goat.key===key)return G._goat.id;
 let best=null;
 for(const p of G.players){
   if(p.pos!=="MID"&&p.pos!=="FWD")continue;
   if(!best||p.ovr>best.ovr
     ||(p.ovr===best.ovr&&((p.gc||0)>(best.gc||0)
       ||((p.gc||0)===(best.gc||0)&&((p.ac||0)>(best.ac||0)
         ||((p.ac||0)===(best.ac||0)&&p.id<best.id))))))best=p;
 }
 G._goat={key,id:best?best.id:null};
 return G._goat.id;
}
function isGoat(id){return id!=null&&id===universeGoatId();}
function bootRace(){
 // the division's top 5 scorers, the names fans travel to see
 const ureg=userRegionKey(),tier=userTeamObj().tier;
 return G.players.filter(p=>p.team!==null&&T(p.team)&&T(p.team).region===ureg&&T(p.team).tier===tier&&(p.gs||0)>0)
   .sort((a,b)=>b.gs-a.gs).slice(0,5).map(p=>p.id);
}
function attendanceFactors(t,oppId,cupStage){
 // Base: reputation and ticket price, as before
 const rep=repOf(t);
 const f={base:0,boot:0,goat:0,prestige:0,form:0,cup:0,stars:[],goatName:null};
 const opp=oppId!=null?T(oppId):null;
 // The GOAT: the single best attacker (MID or FWD) in the world is a bigger draw
 // than the Golden Boot race (whose boost caps at +18%). Fans pack in on either side.
 {const gid=universeGoatId();
  if(gid!=null&&((squadOf(t).some(p=>p.id===gid))||(opp&&squadOf(opp).some(p=>p.id===gid)))){
    f.goat=.22;const gp=P(gid);f.goatName=gp?gp.name:null;}}
 // Golden Boot draw: fans come out for the division's top scorers, on either side
 if(G.matchday>2){
   const race=bootRace();
   const homeStars=squadOf(t).filter(p=>race.includes(p.id));
   const awayStars=opp?squadOf(opp).filter(p=>race.includes(p.id)):[];
   const starCount=homeStars.length+awayStars.length;
   if(starCount>0){f.boot=Math.min(.18,starCount*.07);   // two scorers ~ +14%
     f.stars=[...homeStars,...awayStars].map(p=>p.name);}
 }
 // Prestige pull: storied clubs travel with a following. A meeting of two
 // powerhouses is the fixture of the season.
 const myP=(t.prestige||0)/100,opP=opp?(opp.prestige||0)/100:0;
 f.prestige=myP*.10+opP*.12+(myP>.55&&opP>.55?.10:0);
 // Form: winners fill grounds, strugglers do not, but a big visitor rescues the gate
 const tbl=standingsOf(t.region,t.tier),rank=tbl.indexOf(t)+1;
 if(rank>0)f.form=((PER_TIER/2)-rank)*.018;   // +7% top, -8% bottom
 // Cup knockouts: the later the round, the bigger the occasion
 if(cupStage!=null)f.cup=[.06,.12,.20,.30][Math.min(cupStage,3)]||0;
 // Pull is the fixture's price-independent appeal (reputation plus every occasion
 // bonus). The CLEARING PRICE is the highest face value at which the ground still
 // fills; it scales with pull, so a GOAT-on-show cup final clears far higher than a
 // dead rubber. Charge at or below it and the appeal-limited crowd shows up; charge
 // above it and seats empty across a band. The resale market prints this same number,
 // so setting face value to the resale price now FILLS the ground instead of emptying
 // it \u2014 real demand (a hot secondary market) genuinely supports a higher gate.
 const pull=(.42+rep*.45)+f.boot+f.goat+f.prestige+f.form+f.cup;
 const clearing=clamp(35+clamp(pull-0.7,0,1.4)*200,30,450);
 const baseFill=clamp(pull,.12,1);
 const over=Math.max(0,G.ticketPrice-clearing);
 f.base=baseFill;f.comfort=clearing;
 f.total=clamp(baseFill*clamp(1-over/(clearing*0.9),0,1),0,1);
 return f;
}
function attendance(t,oppId,cupStage){
 return Math.round(effCapacity(t)*attendanceFactors(t,oppId,cupStage).total);}
const STADIUM_TIERS=[
 {addSeats:6000,cost:6000000,years:1,label:"Tier 1 expansion (+6k)"},
 {addSeats:10000,cost:14000000,years:1,label:"Tier 2 expansion (+10k)"},
 {addSeats:16000,cost:28000000,years:1,label:"Tier 3 expansion (+16k)"},
 {target:100000,cost:100000000,years:2,label:"Mega stadium (100k)"}];
function nextHomeFixture(){
 // the user's next home occasion: league game or home cup tie, whichever is nearer
 if(G.matchday>=SEASON_LEN)return null;
 const t=userTeamObj(),tt=tierClubs(t.region,t.tier),li=tt.indexOf(G.userTeam);
 let league=null;
 for(let md=G.matchday;md<SEASON_LEN;md++){
   const fx=G.fixtures[md];
   for(const[i,j]of fx){if(i===li){league={md,opp:tt[j],cupStage:null};break}}
   if(league)break;
 }
 let cup=null;
 if(G.cup&&G.cup.userGames){
   const g=G.cup.userGames.find(x=>!x.played&&!x.rest&&x.home&&x.opp!=null&&x.md>G.matchday);
   if(g)cup={md:g.md,opp:g.opp,cupStage:G.cup.phase==="ko"?G.cup.koStage:0};
 }
 if(league&&cup)return league.md<=cup.md?league:cup;
 return league||cup;
}
function secondaryMarket(){
 // The resale market prints the true clearing price for the next home fixture \u2014 the
 // highest face value that still fills the ground. Surge is how far your face value
 // sits below (positive: room to raise) or above (negative: overpriced) that price.
 const nx=nextHomeFixture();if(!nx)return null;
 const t=userTeamObj();
 const f=attendanceFactors(t,nx.opp,nx.cupStage);
 const resale=Math.max(5,Math.round(f.comfort));
 const surge=Math.round((f.comfort/Math.max(1,G.ticketPrice)-1)*100);
 return{opp:T(nx.opp)?T(nx.opp).name:"?",cup:nx.cupStage!=null,factors:f,
   resale,heat:f.comfort/Math.max(1,G.ticketPrice),surge};
}
/* Richer, higher-prestige, higher-division AI clubs break ground on their own
   grounds and keep a cash buffer in reserve, so the mega tier is not user-only. */
/* AI clubs pay upkeep on their Office assets (or lose the benefit) and, when flush,
   invest in new ones — supporters, a team jet, and training facilities (bought in
   Bronze->Silver->Gold order, one a season) — so these perks are not user-only. */
function aiFacilitiesTick(){
 G.teams.forEach(t=>{
   if(t.id===G.userTeam)return;
   // upkeep for the coming season (auto-pay if affordable, else benefit lapses)
   if(t.supporters){if(t.budget>=SUPPORTER_COST)t.budget-=SUPPORTER_COST;else t.supporters=false;}
   if(t.jet){if(t.budget>=JET_MAINT){t.budget-=JET_MAINT;t.jetMaint="paid";}else t.jetMaint="rejected";}
   if((t.facility||0)>0){const m=facilityMaintCost(t.facility);
     if(t.budget>=m){t.budget-=m;t.facilityMaint="paid";}else t.facilityMaint="rejected";}
   // occasional investment, buffer-protected and weighted by prestige
   const pd=(t.prestige||0)/100;
   if(!t.supporters&&t.budget>=SUPPORTER_COST*10&&Math.random()<0.05+pd*0.15)t.supporters=true;
   if(!t.jet&&t.budget>=JET_COST*1.4&&Math.random()<0.03+pd*0.10){t.budget-=JET_COST;t.jet=true;t.jetMaint="paid";}
   if((t.facility||0)<3&&(t.facilityBoughtSeason||0)!==G.season){
     const nx=(t.facility||0)+1,cost=facilityCost(nx);
     if(t.budget>=cost*1.4&&Math.random()<0.03+pd*0.08){
       t.budget-=cost;t.facility=nx;t.facilityMaint="paid";t.facilityBoughtSeason=G.season;}
   }
 });
}
/* ================= Shoe brand sponsorships =================
   Six brands (two per tier), three club slots each = 18 deals shared between the
   user and AI. Deals run 10 seasons, pay a yearly value plus a one-year signing
   bonus, and carry four cumulative targets; hit 3 of 4 to keep the brand happy.
   Funding is secure for the whole term (no mid-term cut). At Year 10 a club that hit
   the targets keeps the brand: AI auto-renews, the user is offered a renewal or rival
   pitches (no fresh evaluation season). The user explores via a hired liaison. */
const SHOE_TIERS={
 gold:  {name:"Gold",  value:10000000, prestige:65, targets:{conrad:3,gb:3,regional:5,league:5},
         brands:[{key:"atreides",name:"Atreides"},{key:"arrakis",name:"Arrakis"}]},
 silver:{name:"Silver",value:4000000,  prestige:45, targets:{conrad:1,gb:2,regional:3,league:3},
         brands:[{key:"navi",name:"Navi"},{key:"eywa",name:"Eywa"}]},
 bronze:{name:"Bronze",value:1500000,  prestige:20, targets:{conrad:1,gb:1,regional:1,league:2},
         brands:[{key:"patronus",name:"Patronus"},{key:"skywalker",name:"Skywalker"}]}};
const SHOE_TIER_ORDER=["bronze","silver","gold"];
const SHOE_SLOTS=3;              // clubs per brand
const SHOE_DEAL_LEN=10;         // seasons
const LIAISON_WAGE=25000;       // £/wk
const SHOE_KEYS=["conrad","gb","regional","league"];
function brandInfo(key){for(const tk in SHOE_TIERS){const b=SHOE_TIERS[tk].brands.find(x=>x.key===key);if(b)return{key,name:b.name,tier:tk};}return null;}
function brandHolders(key){return G.teams.filter(t=>t.sponsor&&t.sponsor.brand===key);}
function shoeMark(t){return t&&t.sponsor?` <span class="shoe" title="${brandInfo(t.sponsor.brand).name} \u00B7 ${SHOE_TIERS[t.sponsor.tier].name} tier">\uD83D\uDC5F</span>`:"";}
function openBrandInTier(tier){return SHOE_TIERS[tier].brands.find(b=>brandHolders(b.key).length<SHOE_SLOTS)||null;}
function shoeRecent(t,win){const s=G.season-(win||6);return{
 conrad:(G.cups.continental||[]).filter(e=>e.winner===t.name&&e.region===t.region&&e.season>=s).length,
 regional:(G.cups.regional||[]).filter(e=>e.winner===t.name&&e.region===t.region&&e.season>=s).length,
 league:(t.leagueTitleSeasons||[]).filter(x=>x>=s).length,
 gb:(G.gbLog||[]).filter(e=>e.team===t.id&&e.season>=s).length};}
function shoeResume(t){const r=shoeRecent(t,6);return(t.prestige||0)+r.conrad*15+r.regional*6+r.league*8+r.gb*5;}
function shoeQualifies(t,tier){
 const pres=t.prestige||0,r=shoeRecent(t,6);
 if(tier==="gold")  return pres>=SHOE_TIERS.gold.prestige   &&(r.conrad>=1||r.league>=2);
 if(tier==="silver")return pres>=SHOE_TIERS.silver.prestige &&(pres>=55||(r.conrad+r.regional+r.league+r.gb)>=1);
 if(tier==="bronze")return pres>=SHOE_TIERS.bronze.prestige;
 return false;}
function shoeBestTier(t){for(const tier of["gold","silver","bronze"])if(shoeQualifies(t,tier))return tier;return null;}
function dealProgress(t){
 if(!t.sponsor)return{conrad:0,gb:0,regional:0,league:0};
 const s=t.sponsor.start;return{
  conrad:(G.cups.continental||[]).filter(e=>e.winner===t.name&&e.region===t.region&&e.season>=s).length,
  regional:(G.cups.regional||[]).filter(e=>e.winner===t.name&&e.region===t.region&&e.season>=s).length,
  league:(t.leagueTitleSeasons||[]).filter(x=>x>=s).length,
  gb:(G.gbLog||[]).filter(e=>e.team===t.id&&e.season>=s).length};}
function dealTargetsMet(t){if(!t.sponsor)return 0;const tg=SHOE_TIERS[t.sponsor.tier].targets,pr=dealProgress(t);
 return SHOE_KEYS.filter(k=>pr[k]>=tg[k]).length;}
function signDeal(t,brandKey,startSeason){
 const bi=brandInfo(brandKey);if(!bi)return;
 t.sponsor={brand:brandKey,tier:bi.tier,start:startSeason};
 const bonus=SHOE_TIERS[bi.tier].value;t.budget+=bonus;
 if(t.id===G.userTeam)logAdd(`Signed a ${SHOE_TIERS[bi.tier].name}-tier shoe deal with ${bi.name}! Signing bonus ${money(bonus)}.`,bonus);}
function endDeal(t){t.sponsor=null;}
/* Runs each season end (before the season counter ticks): pays every active deal at
   its full tier value (no mid-term review \u2014 funding is secure for the whole term).
   At year 10, a club that hit 3 of 4 targets keeps the brand: AI auto-renews, the user
   is offered a renewal or rival pitches. Miss the targets and the deal simply ends. */
function sponsorTick(){
 G.teams.forEach(t=>{
   if(!t.sponsor)return;
   const d=t.sponsor,played=(G.season-d.start+1);
   if(played<1)return;                                   // signed for next season, not yet active
   if(played<=SHOE_DEAL_LEN&&!d.renewDue){               // full annual payment through the term
     t.budget+=SHOE_TIERS[d.tier].value;
     if(t.id===G.userTeam)logAdd(`${brandInfo(d.brand).name} shoe deal: annual payment.`,SHOE_TIERS[d.tier].value);
   }
   if(played>=SHOE_DEAL_LEN&&!d.renewDue){               // end of the 10-year term
     const met=dealTargetsMet(t)>=3;
     if(t.id===G.userTeam){
       if(met){d.renewDue=true;                          // hold the slot; the choice is offered in the Office
         const m=dealTargetsMet(t);if(m>=3)awardBadge("brand_loyal");if(m>=4)awardBadge("shoe_dog");
         logAdd(`${brandInfo(d.brand).name} deal complete \u2014 targets met! Renew for another decade or hear rival pitches.`);}
       else{logAdd(`${brandInfo(d.brand).name} deal ended: targets missed \u2014 they walk away.`);endDeal(t);}
     }else{
       if(met){d.start=G.season+1;t.budget+=SHOE_TIERS[d.tier].value;}  // AI auto-renews for another term
       else endDeal(t);
     }
   }
 });
 aiSponsorFill();
 userLiaisonTick();
}
function aiSponsorFill(){
 for(const tier of["gold","silver","bronze"]){
   SHOE_TIERS[tier].brands.forEach(b=>{
     let open=SHOE_SLOTS-brandHolders(b.key).length;
     while(open>0){
       const cand=G.teams.filter(t=>t.id!==G.userTeam&&!t.sponsor&&shoeQualifies(t,tier))
         .sort((x,y)=>shoeResume(y)-shoeResume(x))[0];
       if(!cand)break;
       signDeal(cand,b.key,G.season+1);       // AI deals begin next season
       open--;
     }
   });
 }
}
/* ---- user liaison cycle: evaluate a season, then pitch; at term end, renew ---- */
function startLiaisonEval(){G.liaisonCycle={phase:"evaluating",since:G.season};}
function buildShoeOffers(t,excludeBrand){
 const offers=[];
 for(const tier of["gold","silver","bronze"]){
   if(!shoeQualifies(t,tier))continue;
   const open=SHOE_TIERS[tier].brands.find(b=>b.key!==excludeBrand&&brandHolders(b.key).length<SHOE_SLOTS);
   if(open){offers.push({tier,brand:open.key,bump:null});continue;}
   const holders=[];SHOE_TIERS[tier].brands.forEach(b=>{if(b.key!==excludeBrand)brandHolders(b.key).forEach(h=>holders.push(h));});
   const weakest=holders.sort((a,b)=>shoeResume(a)-shoeResume(b))[0];
   if(weakest&&shoeResume(t)>shoeResume(weakest))offers.push({tier,brand:weakest.sponsor.brand,bump:weakest.id});
 }
 return offers;
}
function userLiaisonTick(){
 const t=userTeamObj();if(!t)return;
 if(!G.liaison){G.liaisonCycle=null;return;}
 if(t.sponsor&&t.sponsor.renewDue){                       // term complete, awaiting the user's choice
   if(!G.liaisonCycle||G.liaisonCycle.phase!=="renewal")
     G.liaisonCycle={phase:"renewal",since:G.season,brand:t.sponsor.brand,tier:t.sponsor.tier,offers:buildShoeOffers(t,t.sponsor.brand)};
   else if(G.season>G.liaisonCycle.since){endDeal(t);startLiaisonEval();}  // ignored a full season -> lapse
   return;
 }
 if(t.sponsor){G.liaisonCycle=null;return;}               // active deal: no cycle
 if(!G.liaisonCycle){startLiaisonEval();return;}          // (re)start after a deal ends
 if(G.liaisonCycle.phase==="evaluating"){
   const offers=buildShoeOffers(t);
   if(offers.length)G.liaisonCycle={phase:"offered",offers,since:G.season};
   else{G.liaisonCycle={phase:"evaluating",since:G.season};
     logAdd("Shoe brands passed this year \u2014 the liaison keeps working.");}
 }else{G.liaisonCycle={phase:"evaluating",since:G.season};}  // an ignored pitch lapses
}
function hireLiaison(){G.liaison=true;
 if(!userTeamObj().sponsor&&!G.liaisonCycle)startLiaisonEval();
 logAdd(`Hired a shoe brand liaison (${money(LIAISON_WAGE)}/wk) \u2014 they begin a season-long evaluation.`);saveGame(true);render();}
function fireLiaison(){G.liaison=false;G.liaisonCycle=null;logAdd("Released the shoe brand liaison.");saveGame(true);render();}
function renewShoeDeal(){
 const t=userTeamObj();if(!t||!t.sponsor||!t.sponsor.renewDue)return;
 signDeal(t,t.sponsor.brand,G.season);                    // fresh 10-year term + re-sign bonus, clears renewDue
 G.liaisonCycle=null;saveGame(true);render();}
function acceptShoeOffer(idx){
 const t=userTeamObj();if(!t||!G.liaisonCycle)return;
 const ph=G.liaisonCycle.phase;if(ph!=="offered"&&ph!=="renewal")return;
 const o=G.liaisonCycle.offers[idx];if(!o)return;
 if(ph==="renewal"&&t.sponsor)endDeal(t);                 // vacate the current brand before switching
 if(o.bump){const bumped=T(o.bump);if(bumped)endDeal(bumped);}
 signDeal(t,o.brand,G.season);
 G.liaisonCycle=null;saveGame(true);render();}
function declineShoeOffers(){
 const t=userTeamObj();
 if(G.liaisonCycle&&G.liaisonCycle.phase==="renewal"&&t&&t.sponsor){endDeal(t);logAdd("Ended the shoe partnership.");}
 else logAdd("Turned down this year\u2019s shoe pitch.");
 G.liaisonCycle={phase:"evaluating",since:G.season};saveGame(true);render();}
/* ================= Achievements / badges =================
   G.badges maps a badge id -> the season it was unlocked. Most unlock from derivable
   state via checkBadges() (run each matchday and season end); a few fire from event
   hooks (first whistle, first goal, hat-trick, big gate, etc.). All 84 show on the
   Club screen's badge cabinet; locked ones are dimmed. */
function _runMax(arr){let best=0,cur=0,prev=null;arr.slice().sort((a,b)=>a-b).forEach(s=>{cur=(prev!=null&&s===prev+1)?cur+1:1;if(cur>best)best=cur;prev=s;});return best;}
function badgeCtx(){
 const t=userTeamObj();if(!t)return null;

/* ================= Five-year bomb =================
   Once every 5 seasons, right before the last league matchday, football is briefly
   reminded that footballers are humans. Every club loses one random 70+ OVR player
   to an off-field crisis; a 16-year-old is called up in his place. The player's ID
   stays in the world (records/history still resolve) but he is retired: team=null,
   not returned to the free-agent pool. Runs on the user's club and every AI club. */
const BOMB_REASONS=[
 "a personal crisis","a family emergency","a recent conviction",
 "a private matter","a health scare","a legal dispute"];
function fiveYearBomb(){
 const dep=[];
 G.teams.forEach(t=>{
   const cand=squadOf(t).filter(p=>p&&(p.ovr||0)>70);
   if(!cand.length)return;
   const victim=pick(cand),reason=pick(BOMB_REASONS);
   // freeze goal record before he leaves so club scoring history is preserved
   if(!t.scorers)t.scorers={};
   if(!t.scorers[victim.id])t.scorers[victim.id]={name:victim.name,pos:victim.pos,goals:victim.gc||0};
   else t.scorers[victim.id].goals=Math.max(t.scorers[victim.id].goals,victim.gc||0);
   t.squad=t.squad.filter(id=>id!==victim.id);
   victim.team=null;victim.retired=true;   // gone for good; not recycled to free agents
   if(t.id===G.userTeam&&G.xi)G.xi=G.xi.filter(id=>id!==victim.id);
   const kid=newPlayer(G.nextPid++,victim.pos,16,t.region);
   joinClub(kid,t.id);kid.team=t.id;t.squad.push(kid.id);G.players.push(kid);
   dep.push({team:t,victim,reason,kid});
 });
 const mine=dep.find(d=>d.team.id===G.userTeam);
 if(mine){
   G.bombVictimPending=true;   // cleared after this matchday resolves (win -> badge)
   logAdd(`\u26A0\uFE0F Due to ${mine.reason}, ${mine.victim.name} has left the club indefinitely. Sixteen-year-old ${mine.kid.name} has been called up in his place.`);
   try{toast(`\u26A0\uFE0F ${mine.victim.name} out (${mine.reason}). ${mine.kid.name} called up.`);}catch(e){}
 }
 // world-news feed: a headline per departing club so the user sees who else lost whom
 G.news=G.news||[];
 dep.filter(d=>d.team.id!==G.userTeam).forEach(d=>{
   G.news.unshift({season:G.season,text:`${d.victim.name} left ${d.team.name} indefinitely due to ${d.reason}. A 16-year-old was called up.`});
 });
 if(dep.length>1)logAdd(`Around the league: ${dep.length-1} other club${dep.length-1===1?"":"s"} lost a first-team player to off-field matters.`);
 rebuildIndex();   // register the new 16-year-olds in the id->player map, or P() returns undefined and match prep spins forever
}
/* ================= Prediction market (betting) =================
   A once-a-season futures book (each regional cup, the Conrad Cup, your region's
   Golden Boot, and the World & Tippy Cups in the years they run) plus a correct-score
   bet on each of your matches. Odds are honest \u2014 derived from real strength, so
   favourites pay little and upsets pay huge \u2014 with a small house margin, so betting is
   a flutter, never an income engine. Match stakes cap at \u00A32M; futures let you risk it
   all. Exact scores can't be farmed (you can't reliably hit one), and futures only ever
   pay for the RIGHT outcome, so there is nothing to throw. */
const BOOK_MARGIN=0.07;
const MATCH_BET_CAP=2000000;
let _betGF=1,_betGA=1,_matchStake=100000,_futStake=1000000,_betOpen=false;   // transient UI state
function _fact(n){let f=1;for(let i=2;i<=n;i++)f*=i;return f;}
function poissonPmf(k,l){return Math.exp(-l)*Math.pow(l,k)/_fact(k);}
function decOdds(p,cap){return clamp((1-BOOK_MARGIN)/Math.max(p,1e-6),1.05,cap||40);}
function clubBetRating(t){if(!t)return 50;const s=squadOf(t).filter(Boolean).sort((a,b)=>b.ovr-a.ovr).slice(0,11);
 return s.length?s.reduce((a,p)=>a+p.ovr,0)/s.length:50;}
function fieldProbs(items,temp){   // softmax; higher temp = flatter = more upsets
 const mx=Math.max(...items.map(i=>i.rating));
 const ex=items.map(i=>Math.exp((i.rating-mx)/temp));
 const tot=ex.reduce((a,b)=>a+b,0)||1;
 return items.map((i,k)=>({...i,p:ex[k]/tot}));
}

function nextUserMatch(){

 for(const[i,j]of fx){if(i===li)return{opp:tt[j],home:true};if(j===li)return{opp:tt[i],home:false};}

}
function matchXG(){
 const nx=nextUserMatch();if(!nx)return null;
 const u=G.userTeam,o=nx.opp;
 const uS=strength(teamXI(u)),oS=strength(teamXI(o));
 if(nx.home){const[lh,la]=xgPair(uS,oS,teamTac(u),teamTac(o),teamBoost(u,true),teamBoost(o,false),3);return{lu:lh,lo:la,nx};}
 const[lh,la]=xgPair(oS,uS,teamTac(o),teamTac(u),teamBoost(o,true),teamBoost(u,false),3);
 return{lu:la,lo:lh,nx};
}
function scoreMultFrom(xg,gf,ga){return decOdds(poissonPmf(gf,xg.lu)*poissonPmf(ga,xg.lo),200);}
function placeMatchBet(gf,ga,stake){
 const t=userTeamObj();
 if(G.matchBet)return toast("You already have a bet on this match.");
 const xg=matchXG();if(!xg)return toast("No upcoming match to bet on.");

 if(stake>MATCH_BET_CAP)return toast(`Match bets are capped at ${money(MATCH_BET_CAP)}.`);
 if(t.budget<stake)return toast("You can't stake more than your budget.");
 const mult=Math.round(scoreMultFrom(xg,gf,ga)*100)/100;
 const oppName=T(xg.nx.opp)?T(xg.nx.opp).name:"?";
 t.budget-=stake;G.matchBet={gf,ga,stake,mult,opp:oppName,home:xg.nx.home};
 logAdd(`Bet ${money(stake)} on a ${gf}\u2013${ga} scoreline (pays ${mult.toFixed(2)}x).`,-stake);
 saveGame(true);render();
}

function settleMatchBet(gf,ga){

 const won=(b.gf===gf&&b.ga===ga),payout=won?Math.round(b.stake*b.mult):0;
 logBet({kind:"match",s:G.season,desc:`${b.gf}\u2013${b.ga} vs ${b.opp||"?"}`,actual:`${gf}\u2013${ga}`,stake:b.stake,mult:b.mult,won,payout});

   logAdd(`\uD83C\uDFAF Correct score ${gf}\u2013${ga}! Your bet won ${money(payout)}.`,payout);
   try{toast(`\uD83C\uDFAF Correct score \u2014 you won ${money(payout)}!`);}catch(e){}}

/* ================= Player discontent (Empire FC 2) =================
   Footballers want to play. At season's end, two narrow groups agitate for a move:
     - a YOUNG player (under 24) with almost no minutes, whose development is stalling
     - a STAR (high OVR) reduced to a bench role, whose status doesn't match his minutes

   Once a player is unhappy he must be sold before the season starts, and he goes at a
   steep discount because everyone knows he is forcing his way out. Ignore him for a
   full season and he walks for nothing. This is what stops a rich club stockpiling
   talent: you can buy anyone, but you cannot bench them and keep them. */
const DISCONTENT_YOUNG_AGE=24;   // under this age, minutes matter for development
const DISCONTENT_YOUNG_APPS=4;   // fewer than this in a season and a prospect stalls
const DISCONTENT_STAR_OVR=78;    // a player this good expects to start

function unhappyList(t){return((t&&t.unhappy)||[]).map(P).filter(Boolean);}
function isUnhappy(p){const t=p&&p.team!=null?T(p.team):null;return !!(t&&(t.unhappy||[]).includes(p.id));}

/* Runs at season end, before appearances reset. Flags newly unhappy players and lets
   anyone already unhappy leave for free if he was ignored for another whole season. */
function discontentTick(){
 G.teams.forEach(t=>{
   if(!t.unhappy)t.unhappy=[];
   // a player who has agitated for a full season and is still here walks away free
   const stale=unhappyList(t).filter(p=>(p.unhappySince||G.season)<G.season);
   stale.forEach(p=>{
     t.squad=t.squad.filter(id=>id!==p.id);
     t.unhappy=t.unhappy.filter(id=>id!==p.id);
     p.team=null;delete p.unhappySince;delete p.promised;if(!G.freeAgents.includes(p.id))G.freeAgents.push(p.id);
     if(t.id===G.userTeam){
       logAdd(`${p.name} forced his exit and left on a free transfer. You got nothing for him.`);
       try{toast(`${p.name} walked out on a free.`);}catch(e){}
     }
   });
   // broken promises: you told him he would play and he still didn't. He walks now.
   squadOf(t).slice().forEach(p=>{
     if(!p||p.promised==null)return;
     const played=(p.as||0)>=DISCONTENT_YOUNG_APPS;
     if(played){delete p.promised;if(t.id===G.userTeam)awardBadge("kept_promise");return;}   // promise kept
     if(p.promised>=G.season)return;                  // still within his season of grace
     if(t.squad.length<=SQUAD_MIN){delete p.promised;return;}
     t.squad=t.squad.filter(id=>id!==p.id);
     t.unhappy=(t.unhappy||[]).filter(id=>id!==p.id);
     if(G.xi)G.xi=G.xi.filter(id=>id!==p.id);
     p.team=null;delete p.promised;delete p.unhappySince;
     if(!G.freeAgents.includes(p.id))G.freeAgents.push(p.id);
     if(t.id===G.userTeam){
       awardBadge("broken_promise");
       logAdd(`${p.name} was promised minutes he never got. He walked out on a free transfer.`);
       try{toast(`${p.name} walked out \u2014 you broke your promise.`);}catch(e){}
     }
   });
   // new agitators: young-and-barely-played, or a benched star
   squadOf(t).forEach(p=>{
     if(!p||isUnhappy(p))return;
     if(p.promised!=null&&p.promised>=G.season)return;   // inside his promised grace season
     const apps=p.as||0;
     const youngStalling=p.age<DISCONTENT_YOUNG_AGE&&apps<DISCONTENT_YOUNG_APPS;
     const benchedStar=p.ovr>=DISCONTENT_STAR_OVR&&apps<DISCONTENT_STAR_APPS;
     if(!(youngStalling||benchedStar))return;
     if(t.squad.length<=SQUAD_MIN)return;        // a club cannot go below its floor

     if(t.id===G.userTeam){
       logAdd(youngStalling
         ? `${p.name} (${p.age}) has barely played and wants a move to develop his career.`
         : `${p.name} expects to start and is unhappy on the bench. He wants away.`);
     }
   });
 });
 // a season where nobody on your books asked to leave
 {const ut=userTeamObj();
  if(ut&&!(ut.unhappy||[]).length&&G.season>1)awardBadge("no_requests");}
 aiResolveUnhappy();
}
/* AI clubs deal with their own unhappy players: sell them cheap to a club with room,
   or let them go to the free-agent pool. Keeps the world's transfer market circulating. */
function aiResolveUnhappy(){

   unhappyList(t).forEach(p=>{
     if(t.squad.length<=SQUAD_MIN)return;

       .sort((a,b)=>(b.prestige||0)-(a.prestige||0))[0];

 });

/* ================= Player contracts & wage demands (Empire FC 2) =================
   Every senior player is on a contract of a few seasons. When it runs down he opens
   talks, and his demand scales with what he is worth NOW, what he has just won, and
   who else is circling. A club that wins everything therefore watches its wage bill
   balloon: success is what makes your own squad expensive. Refuse the demand and he
   runs down his deal and leaves for nothing at the end of the season. There is no
   salary cap; the pressure is simply that holding a superstar squad costs superstar
   money, and even a billion only stretches so far. */
const CONTRACT_MIN=2,CONTRACT_MAX=5;
function newContractYears(){return ri(CONTRACT_MIN,CONTRACT_MAX);}
/* What a player will accept to re-sign. Base is his open-market wage, lifted by his
   standing (star quality), his recent honours, and rival interest. */
function wageDemand(p){
 const t=p.team!=null?T(p.team):null;
 const base=wageOf(p);
 let mult=1.15;                                   // nobody re-signs for less
 if(p.ovr>=90)mult+=0.85; else if(p.ovr>=85)mult+=0.55; else if(p.ovr>=80)mult+=0.30;
 if(universeGoatId()===p.id)mult+=0.75;           // the best player alive prices himself
 // recent honours: what he has just helped win
 const s=G.season;
 const titles=t?((t.leagueTitleSeasons||[]).filter(x=>x>=s-3).length):0;
 const conrad=t?((G.cups.continental||[]).filter(e=>e.winner===t.name&&e.region===t.region&&e.season>=s-3).length):0;
 mult+=titles*0.10+conrad*0.18;
 if((p.gbWins||0)>0)mult+=0.12*Math.min(p.gbWins,3);
 if((p.wcWins||0)>0)mult+=0.15;
 // rival interest: how many clubs could plausibly afford and want him
 mult+=clamp(rivalInterest(p)*0.06,0,0.45);
 if(p.age>=33)mult*=0.75;                          // a veteran has less leverage
 return Math.max(500,Math.round(base*mult/100)*100);
}
function rivalInterest(p){
 const fee=transferFee(p);
 return G.teams.filter(b=>b.id!==p.team&&b.budget>=fee&&(b.prestige||0)>=40).length;
}
/* Season tick: run contracts down, open talks on expiring deals, and let AI clubs
   settle their own renewals (or lose the player). */
function contractTick(){
 G.teams.forEach(t=>{
   squadOf(t).forEach(p=>{
     if(!p)return;
     if(p.contract==null)p.contract=newContractYears();
     p.contract--;
     if(p.contract>0)return;
     // deal is up
     if(t.id===G.userTeam){
       p.demand=wageDemand(p);                     // you decide in the window
     }else{
       const dem=wageDemand(p);
       // AI keeps him if the wage bill stays sane for the club's means
       const bill=squadWage(t),afford=t.budget>0&&(bill+dem-p.wage)*SEASON_LEN<Math.max(t.budget*1.6,4e6);
       if(afford){p.wage=dem;p.contract=newContractYears();}
       else{
         G.teams.forEach(tt=>{tt.squad=tt.squad.filter(id=>id!==p.id);
           if(tt.unhappy)tt.unhappy=tt.unhappy.filter(id=>id!==p.id);});
         p.team=null;p.contract=newContractYears();delete p.demand;
         if(!G.freeAgents.includes(p.id))G.freeAgents.push(p.id);
       }
     }
   });
 });
}

       const need=positionNeed(t);
       const pool=academyOf(t);
       const pickUp=pool.filter(p=>p.pos===need).sort((a,b)=>b.ovr-a.ovr)[0]
                  ||pool.sort((a,b)=>b.ovr-a.ovr)[0];
       if(!pickUp)break;
       if(!promoteFromAcademy(t,pickUp))break;
     }
   }
   let guard=0;
   while(t.squad.length<TARGET&&guard++<14){
     let pool=G.freeAgents.map(P).filter(Boolean);
     if(!pool.length)break;
     if(t.trait==="local"){const loc=pool.filter(p=>p.region===t.region);if(loc.length)pool=loc;}
     const need=positionNeed(t);
     let cands=pool.filter(p=>p.pos===need);
     if(!cands.length)cands=pool;
     let sign;
     if(t.trait==="youth")sign=cands.sort((a,b)=>(b.pot-b.age*2)-(a.pot-a.age*2))[0];
     else if(t.trait==="selling")sign=cands.sort((a,b)=>a.value-b.value)[0];
     else{
       const afford=cands.filter(p=>p.value<=Math.max(t.budget,0)+400000).sort((a,b)=>b.ovr-a.ovr);
       sign=afford[0]||cands.sort((a,b)=>a.value-b.value)[0];
     }
     if(!sign)break;
     t.budget-=Math.round(sign.value*.5);          // free agents come cheap
     G.teams.forEach(tt=>{tt.squad=tt.squad.filter(id=>id!==sign.id);
       if(tt.academy)tt.academy=tt.academy.filter(id=>id!==sign.id);
       if(tt.unhappy)tt.unhappy=tt.unhappy.filter(id=>id!==sign.id);});
     joinClub(sign,t.id);sign.team=t.id;t.squad.push(sign.id);
     G.freeAgents=G.freeAgents.filter(x=>x!==sign.id);
   }
 });
}
