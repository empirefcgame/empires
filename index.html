/* ---- AI transfer churn ---- */
/* AI clubs trade with each other, not just with the free-agent bin. Each window a
   number of clubs go shopping: they identify their weakest position, then either buy a
   genuine upgrade from another club (paying a real fee that moves money around the
   world) or pick up a free agent. Selling clubs bank the fee and reinvest it later, so
   wealth and talent actually circulate instead of pooling at the top. */
function aiTransfers(){
 const clubs=G.teams.filter(t=>t.id!==G.userTeam);
 // free-agent churn (as before, but for more clubs each pass)
 for(let k=0;k<4;k++){
   const t=pick(clubs);if(!t)continue;
   const sq=squadOf(t).filter(p=>p&&p.pos!=="GK").sort((a,b)=>a.ovr-b.ovr);
   const worst=sq[0];if(!worst)continue;
   if(t.squad.length<=SQUAD_MIN)continue;
   const sellFee=Math.round(worst.value*.9);
   let options=G.freeAgents.map(P).filter(f=>f&&f.team===null&&f.pos===worst.pos&&f.ovr>worst.ovr+2&&f.value<=t.budget+sellFee);
   if(t.trait==="local")options=options.filter(f=>f.region===t.region);
   if(t.trait==="hoarder"&&Math.random()<0.6)continue;
   if(!options.length)continue;
   const buy=t.trait==="youth"
     ? options.sort((a,b)=>(b.pot-b.age*1.5)-(a.pot-a.age*1.5))[0]
     : options.sort((a,b)=>b.ovr-a.ovr)[0];
   t.budget+=sellFee-buy.value;
   detachPlayer(worst);worst.team=null;G.freeAgents.push(worst.id);
   detachPlayer(buy);G.freeAgents=G.freeAgents.filter(id=>id!==buy.id);
   joinClub(buy,t.id);buy.team=t.id;t.squad.push(buy.id);
   buy.wage=wageOf(buy);buy.contract=newContractYears();
 }
 aiClubTransfers();
}
/* ---- career club history ----
   Every move goes through joinClub(), so a player's CV builds itself: club name, the
   season he arrived, and the goals/apps he racked up there. Stored as names rather than
   ids so a club that later renames or a player who outlives records still reads right. */
function joinClub(p,teamId,season){
 if(!p)return;
 p.history=p.history||[];
 const t=teamId!=null?T(teamId):null;
 const now=season!=null?season:G.season;
 const last=p.history[p.history.length-1];
 if(last&&last.out==null){                       // close out the previous spell
   last.out=now;
   last.goals=Math.max(0,(p.gc||0)-(last.gcAt||0));
   last.apps=Math.max(0,(p.ac||0)-(last.acAt||0));
   // A stint where he never got on the pitch is transfer-market churn, not a real spell
   // in his career, so it is dropped rather than cluttering the CV.
   if(last.apps===0&&last.goals===0)p.history.pop();
 }
 if(!t)return;                                   // leaving to free agency just closes the spell
 // Re-joining the club he most recently left reopens that same spell rather than
 // stacking duplicate rows, so a back-and-forth reads as one continuous stint.
 const tail=p.history[p.history.length-1];
 if(tail&&tail.club===t.name){
   delete tail.out;delete tail.goals;delete tail.apps;
   return;
 }
 p.history.push({club:t.name,in:now,gcAt:p.gc||0,acAt:p.ac||0});
}
/* Goals/apps for the spell a player is currently in. */
function spellStats(p,h){
 if(h.out!=null)return{goals:h.goals||0,apps:h.apps||0};
 return{goals:Math.max(0,(p.gc||0)-(h.gcAt||0)),apps:Math.max(0,(p.ac||0)-(h.acAt||0))};
}
function detachPlayer(p){
 G.teams.forEach(tt=>{
   tt.squad=tt.squad.filter(id=>id!==p.id);
   if(tt.academy)tt.academy=tt.academy.filter(id=>id!==p.id);
   if(tt.unhappy)tt.unhappy=tt.unhappy.filter(id=>id!==p.id);
 });
 G.freeAgents=G.freeAgents.filter(id=>id!==p.id);
}
/* Real money-for-player deals between AI clubs. */
function aiClubTransfers(){
 const buyers=shuffle(G.teams.filter(t=>t.id!==G.userTeam&&t.budget>1e6&&!squadFull(t)));
 let done=0;
 for(const buyer of buyers){
   if(done>=8)break;                                  // a handful of real deals per window
   if(buyer.trait==="hoarder"&&Math.random()<0.5)continue;
   const need=positionNeed(buyer);
   const mine=squadOf(buyer).filter(p=>p&&p.pos===need).sort((a,b)=>a.ovr-b.ovr);
   const bar=mine.length?mine[mine.length-1].ovr:0;    // must beat our best in that slot
   // shop other clubs for a clear upgrade they can be talked out of
   const targets=[];
   G.teams.forEach(sel=>{
     if(sel.id===buyer.id||sel.id===G.userTeam)return;
     if(sel.squad.length<=SQUAD_MIN)return;
     squadOf(sel).forEach(p=>{
       if(!p||p.pos!==need||p.ovr<=bar+2)return;
       if(buyer.trait==="local"&&p.region!==buyer.region)return;
       let fee=transferFee(p);
       if(sel.trait==="hoarder")fee=Math.round(fee*1.4);
       if(sel.trait==="selling")fee=Math.round(fee*0.8);
       if(isUnhappy(p))fee=forcedFee(p);               // agitators go cheap
       if(fee>buyer.budget)return;
       targets.push({p,sel,fee});
     });
   });
   if(!targets.length)continue;
   // targets were gathered before any trade in this pass; re-validate before executing
   targets.sort((a,b)=>((b.p.ovr-bar)/Math.max(1,b.fee))-((a.p.ovr-bar)/Math.max(1,a.fee)));
   const deal=targets.find(d=>
     d.sel.squad.includes(d.p.id) &&        // the seller still actually holds him
     d.sel.squad.length>SQUAD_MIN &&        // and can afford to lose him
     d.fee<=buyer.budget);
   if(!deal||squadFull(buyer))continue;
   buyer.budget-=deal.fee;deal.sel.budget+=deal.fee;
   detachPlayer(deal.p);
   joinClub(deal.p,buyer.id);deal.p.team=buyer.id;buyer.squad.push(deal.p.id);
   deal.p.wage=wageOf(deal.p);deal.p.contract=newContractYears();
   delete deal.p.unhappySince;
   done++;
 }
}

/* ======================= THE LIAHONA CUP ======================= */
let QUIET=false;
let CUPHIST_TAB="regional";   // which competition the Cup history card shows
function grTag(r){return "Group Round "+(r+1);}
function initCup(){
 // regional cup: the 30 clubs of the user's region, 6 groups of 5
 const ureg=userRegionKey();
 const seeds=[];
 for(let tier=0;tier<3;tier++)seeds.push(...shuffle(tierClubs(ureg,tier).slice()));
 const groups=Array.from({length:6},()=>[]);
 seeds.forEach((id,i)=>{const r=Math.floor(i/6);const g=r%2?5-(i%6):i%6;groups[g].push(id)});
 // 5-team round robin template (indices 0-4, one bye per round)
 const tmpl=[];let cur=[0,1,2,3,4,-1];
 for(let r=0;r<5;r++){const rd=[];
   for(let i=0;i<3;i++){const h=cur[i],a=cur[5-i];if(h!==-1&&a!==-1)rd.push(r%2?[a,h]:[h,a]);}
   tmpl.push(rd);
   cur=[cur[0],cur[5],...cur.slice(1,5)];}
 const gst={};groups.flat().forEach(id=>gst[id]=blankStd());
 G.cup={phase:"group",groups,tmpl,gst,round:0,
        koAlive:[],koStage:0,log:[],winner:null,userOut:false,userGames:[]};
 if(G.userTeam!==null)cupScheduleUser();
}
function cupScheduleUser(){
 // pre-schedule the user's group fixtures for the calendar
 const c=G.cup;if(!c||c.userGames.length)return;
 const gi=c.groups.findIndex(g=>g.includes(G.userTeam));
 for(let r=0;r<5;r++){
   const ms=c.tmpl[r].map(([x,y])=>[c.groups[gi][x],c.groups[gi][y]]);
   const mine=ms.find(([h,a])=>h===G.userTeam||a===G.userTeam);
   if(mine)c.userGames.push({md:CUP_GROUP_MARKS[r],round:grTag(r),
     opp:mine[0]===G.userTeam?mine[1]:mine[0],home:mine[0]===G.userTeam,played:false});
   else c.userGames.push({md:CUP_GROUP_MARKS[r],round:grTag(r),rest:true,played:false});
 }
}
function gsort(ids){
 return ids.slice().sort((a,b)=>{const A=G.cup.gst[a],B=G.cup.gst[b];
   return B.Pts-A.Pts||(B.GF-B.GA)-(A.GF-A.GA)||B.GF-A.GF});}
function nextKoUserGame(){
 const c=G.cup,al=c.koAlive,i=al.indexOf(G.userTeam);
 if(i<0||c.koStage>=5)return;
 const opp=(i%2===0)?al[i+1]:al[i-1];
 c.userGames.push({md:CUP_KO_MARKS[c.koStage],round:KO_NAMES[c.koStage],opp,home:i%2===0,played:false});
}
function finishGroups(){
 const c=G.cup;c.phase="ko";
 const qual=[];const fourths=[];
 c.groups.forEach(g=>{const s=gsort(g);qual.push(...s.slice(0,2));fourths.push(s[2]);});
 const bestThirds=gsort(fourths).slice(0,4);
 qual.push(...bestThirds);   // 12 + 4 best third-placed = 16
 c.koAlive=shuffle(qual);
 c.log.unshift({round:"Group stage",line:"16 clubs advance to the Round of 16."});
 if(qual.includes(G.userTeam)){
   if(bestThirds.includes(G.userTeam))awardBadge("group_heroes");
   T(G.userTeam).budget+=QUALIFY_BONUS;
   logAdd(`${CUP}: qualified for the Round of 16.`,QUALIFY_BONUS);
   if(!QUIET)toast(`${CUP}: you qualified for the knockouts! +${money(QUALIFY_BONUS)}`);
   nextKoUserGame();
 }else{
   c.userOut=true;logAdd(`${CUP}: eliminated in the group stage.`);
   if(!QUIET)toast(`${CUP}: your group run ends there.`);
 }
}
function cupUserRecord(md,gf,ga,pens){
 const g=G.cup.userGames.find(x=>x.md===md&&!x.rest);
 if(g){g.played=true;g.gf=gf;g.ga=ga;g.pens=!!pens;
   // a home cup tie sells tickets too, and the occasion grows by round
   if(g.home&&g.opp!=null){
     const stage=G.cup.phase==="ko"?G.cup.koStage:null;
     const t=userTeamObj();
     if(G.ticketManager)G.ticketPrice=optimalTicketPrice(t,g.opp,stage==null?0:stage);
     const att=attendance(t,g.opp,stage==null?0:stage);
     const gate=att*G.ticketPrice;
     t.budget+=gate;
     logAdd(`${CUP} home gate: ${att.toLocaleString()} attended.`,gate);
   }
 }
}
function playCupRound(){
 const c=G.cup;if(!c||c.winner!==null)return;
 if(c.phase==="group"){
   const r=c.round;
   c.groups.forEach(grp=>{
     c.tmpl[r].forEach(([x,y])=>{
       const h=grp[x],a=grp[y];
       const{hg,ag}=playTie(h,a,2);
       const H=c.gst[h],A=c.gst[a];
       H.P++;A.P++;H.GF+=hg;H.GA+=ag;A.GF+=ag;A.GA+=hg;
       if(hg>ag){H.W++;A.L++;H.Pts+=3}else if(hg<ag){A.W++;H.L++;A.Pts+=3}else{H.D++;A.D++;H.Pts++;A.Pts++}
       if(h===G.userTeam||a===G.userTeam){
         const home=h===G.userTeam,gf=home?hg:ag,ga=home?ag:hg;
         cupUserRecord(CUP_GROUP_MARKS[r],gf,ga);
         let prize=gf>ga?GROUP_WIN:gf===ga?GROUP_DRAW:0;
         if(prize){T(G.userTeam).budget+=prize;}
         logAdd(`${CUP} ${grTag(r)}: ${T(h).name} ${hg}\u2013${ag} ${T(a).name}.`,prize||0);
         if(!QUIET)toast(`${CUP} ${grTag(r)}: ${T(h).name} ${hg}\u2013${ag} ${T(a).name}${prize?` (+${money(prize)})`:""}`);
       }
     });
   });
   c.round++;
   if(c.round===5)finishGroups();
 }else{
   const al=c.koAlive,winners=[];
   for(let i=0;i<al.length;i+=2){
     const h=al[i],a=al[i+1];
     let{hg,ag}=playTie(h,a,0);
     let pens=false;
     if(hg===ag){pens=true;if(Math.random()<.5)hg++;else ag++;}
     const wnr=hg>ag?h:a;winners.push(wnr);
     const line=`${T(h).name} ${hg}\u2013${ag} ${T(a).name}${pens?" (pens)":""}`;
     c.log.unshift({round:KO_NAMES[c.koStage],line});
     if(h===G.userTeam||a===G.userTeam){
       const home=h===G.userTeam;
       cupUserRecord(CUP_KO_MARKS[c.koStage],home?hg:ag,home?ag:hg,pens);
       const isFinal=c.koStage===KO_NAMES.length-1;   // last round is the final
       if(isFinal)awardBadge("cup_runners");
       {const _opp=home?a:h;if(wnr===G.userTeam&&T(_opp)&&(T(_opp).tier||0)<(T(G.userTeam).tier||0))awardBadge("giant_killers");}
       if(wnr===G.userTeam){const prize=KO_PRIZE[c.koStage];T(G.userTeam).budget+=prize;
         logAdd(`${CUP}: ${isFinal?"CHAMPIONS \u2014 the cup is yours!":"won the "+KO_NAMES[c.koStage]+"."}`,prize);
         if(!QUIET)toast(`${CUP} ${KO_NAMES[c.koStage]}: ${line} \u2014 ${isFinal?"you win the cup!":"you advance!"} +${money(prize)}`);}
       else{c.userOut=true;logAdd(`${CUP}: ${isFinal?"beaten in the final \u2014 runner-up.":"knocked out in the "+KO_NAMES[c.koStage]+"."}`);
         if(!QUIET)toast(`${CUP} ${KO_NAMES[c.koStage]}: ${line} \u2014 ${isFinal?"you are the cup runner-up.":"you are out."}`);}
     }
   }
   c.koAlive=winners;c.koStage++;
   if(winners.length===1){c.winner=winners[0];
     logAdd(`${T(c.winner).name} lifted ${CUP}.`);}
   else nextKoUserGame();
 }
}
function cupShort(){
 const c=G.cup;
 if(c.winner!==null)return c.winner===G.userTeam?"Champions!":"Concluded";
 if(c.userOut)return "Out";

/* ======================= SEASON TURNOVER ======================= */

function stockClub(t){

   const same=G.freeAgents.filter(_free).map(P).filter(p=>p.pos===pos&&p.region===t.region).sort((a,b)=>a.ovr-b.ovr);
   const any=G.freeAgents.filter(_free).map(P).filter(p=>p.pos===pos&&p.region!==t.region).sort((a,b)=>a.ovr-b.ovr);
   const avail=[...same,...any];
   while(need>0&&avail.length){
     const p=avail.shift();
     // never sign someone another club still holds: detach everywhere first
     G.teams.forEach(tt=>{tt.squad=tt.squad.filter(id=>id!==p.id);
       if(tt.academy)tt.academy=tt.academy.filter(id=>id!==p.id);
       if(tt.unhappy)tt.unhappy=tt.unhappy.filter(id=>id!==p.id);});
     joinClub(p,t.id);p.team=t.id;t.squad.push(p.id);
     G.freeAgents=G.freeAgents.filter(x=>x!==p.id);need--;
   }
   while(need>0){
     const p=newPlayer(G.nextPid++,pos,ri(18,30),t.region);joinClub(p,t.id);p.team=t.id;t.squad.push(p.id);G.players.push(p);
     need--;
   }
 }
 rebuildIndex();
}

const PRESTIGE_MAX=100;
function conradFloor(t){
 // Recent Conrad Cups are the single strongest prestige signal. A reigning continental
 // champion holds a high floor; back-to-back winners sit near the very top and cannot
 // be eroded by seasonal decay.
 if(!t)return 0;
 const recent=(G.cups.continental||[]).filter(e=>e.winner===t.name&&e.region===t.region&&e.season>=G.season-3).length;
 return recent>=2?92:recent>=1?82:0;
}
function updatePrestige(RT){
 // everything decays a little each season, so past glory fades without new results
 G.teams.forEach(t=>{t.prestige=Math.max(0,(t.prestige||0)*0.94);});
 REGIONS.forEach(r=>{
   RT[r.key].forEach((tbl,tier)=>{
     const weight=[1,0.5,0.25][tier];
     tbl.forEach((t,rank)=>{
       let gain=0;
       if(rank===0)gain=12*weight;            // champions
       else if(rank===1)gain=7*weight;
       else if(rank<PER_TIER/2)gain=3*weight; // respectable top half
       else if(rank>=PER_TIER-2)gain=-2;      // relegation form hurts everywhere
       t.prestige=clamp((t.prestige||0)+gain,0,PRESTIGE_MAX);
     });
   });
 });
 // regional cup winner
 if(G.cup&&G.cup.winner!==null&&T(G.cup.winner))
   T(G.cup.winner).prestige=clamp((T(G.cup.winner).prestige||0)+6,0,PRESTIGE_MAX);
 // recent continental champions hold their floor against decay
 G.teams.forEach(t=>{const fl=conradFloor(t);if((t.prestige||0)<fl)t.prestige=fl;});
}

function sparkline(vals,h){

   const x=(i/(vals.length-1))*w;
   const y=ht-4-((v-min)/rng)*(ht-8);
   return x.toFixed(1)+","+y.toFixed(1);}).join(" ");
 const last=vals[vals.length-1],lx=w,ly=(ht-4-((last-min)/rng)*(ht-8)).toFixed(1);

   <polyline points="${pts}" fill="none" stroke="var(--honey)" stroke-width="2" vector-effect="non-scaling-stroke"/>
   <circle cx="${lx-2}" cy="${ly}" r="3" fill="var(--honey2)"/></svg>`;
}

function simulateRegionalCup(regionKey,RT){

   clubs.push({t,seed:t.st.Pts+(2-tier)*100})));

function ageAndRenew(){

function transferFee(p){
 // Headline is OVR x £1M, but the fee shifts with age and potential so a
 // young, high-ceiling player costs well above an aging one at the same OVR.
 const base=p.ovr*XFER_PER_OVR;
 let mult=1;
 if(p.age<=21)mult=1.30; else if(p.age<=25)mult=1.12; else if(p.age<=29)mult=1.0;
 else if(p.age<=32)mult=0.78; else if(p.age<=35)mult=0.55; else mult=0.38;
 if(p.pot-p.ovr>=10&&p.age<24)mult*=1.15;      // wonderkid premium
 // the selling club's identity moves the asking price
 const seller=p.team!=null?T(p.team):null;
 if(seller&&seller.id!==G.userTeam){
   if(seller.trait==="selling")mult*=0.75;      // motivated seller
   if(seller.trait==="hoarder")mult*=1.65;      // will not be moved cheaply
   if(seller.trait==="youth"&&p.age<24)mult*=1.35;  // protects its prospects
 }
 const fee=Math.max(500000,Math.round(base*mult/100000)*100000);
 // The current universe GOAT is a franchise asset \u2014 he draws crowds and sells shirts,
 // so no club lets him go cheaply. His fee never falls below \u00A3200M.
 if(universeGoatId()===p.id)return Math.max(200000000,fee);
 return fee;
}

 joinClub(p,t.id);
 if(fee>=100000000)awardBadge("big_spender");

/* Every club in this universe is sitting on a squad worth far more than its cash on
   hand, so a rival funds a signing the way a real club does: cash, plus what it would
   raise by moving on the fringe players it no longer needs. This is what makes AI bids
   possible at all, since rival budgets alone never approach a market fee. */
function aiTransferPower(t){
 if(!t||t.id===G.userTeam)return 0;
 const sq=squadOf(t).filter(Boolean).sort((a,b)=>a.ovr-b.ovr);
 const spare=Math.max(0,sq.length-SQUAD_MIN);
 const raise=sq.slice(0,Math.min(3,spare)).reduce((s,p)=>s+Math.round(transferFee(p)*0.85),0);
 return Math.max(0,t.budget)+raise;
}
/* Called after an AI bid lands: the buyer sells fringe players at market to cover the
   fee and to open a squad slot if it is at the cap. Keeps rival books honest and feeds
   the free-agent pool, so the world keeps moving instead of quietly breaking the cap. */
function aiFundAndMakeRoom(t,exceptId){
 if(!t||t.id===G.userTeam)return;
 let guard=0;
 while((t.budget<0||t.squad.length>SQUAD_MAX)&&t.squad.length>SQUAD_MIN&&guard++<8){
   const keepers=squadOf(t).filter(x=>x&&x.pos==="GK").length;
   const out=squadOf(t).filter(Boolean)
     .filter(p=>p.id!==exceptId&&(p.pos!=="GK"||keepers>2))
     .sort((a,b)=>a.ovr-b.ovr)[0];
   if(!out)break;
   t.budget+=Math.round(transferFee(out)*0.85);
   detachPlayer(out);out.team=null;G.freeAgents.push(out.id);
 }
}
function genOffers(){
 // AI bids for your players, a fresh batch every day of the window. Rivals shop the
 // whole squad, not just the headline names, and they pay market price. A bidder must
 // be able to fund the deal and must actually be getting an upgrade in that position.
 G.offers=[];const t=userTeamObj();if(!t)return;
 const squad=squadOf(t).filter(Boolean);
 if(!squad.length)return;
 // Bids keep arriving even when the squad is at the floor: rivals do not know or care
 // that you cannot sell. The window screen greys those offers out instead of hiding them.
 const targets=shuffle(squad.slice()).slice(0,10);
 const want=ri(2,4);                          // 2-3 offers on a typical day, 4 on a busy one
 for(const p of targets){
   if(G.offers.length>=want)break;
   const base=transferFee(p);
   const premium=isUnhappy(p)?rnd(.55,.75):rnd(.95,1.45);   // agitators fetch less
   const fee=Math.round(base*premium);
   const pool=G.teams.filter(x=>x.id!==G.userTeam&&x.tier<=p_tierPref(p)
     &&aiTransferPower(x)>=fee
     &&squadOf(x).filter(Boolean).some(q=>q.pos===p.pos&&q.ovr<p.ovr-1));
   const buyer=pick(pool);
   if(!buyer)continue;
   G.offers.push({pid:p.id,from:buyer.id,fee});
 }
}

/* Scans every price and returns the one that maximises gate revenue for a given
   fixture (attendance falls as the price rises, so there is a revenue-maximising
   point). Restores G.ticketPrice before returning. */
function optimalTicketPrice(t,oppId,cupStage){
 // The revenue optimum sits at the clearing price (up to ~\u00A3450 on the biggest nights),
 // so scan the full manual range to catch every case.
 const save=G.ticketPrice;let best=save,bestRev=-1;
 for(let p=5;p<=500;p++){G.ticketPrice=p;const rev=attendance(t,oppId,cupStage)*p;
   if(rev>bestRev){bestRev=rev;best=p;}}
 G.ticketPrice=save;return best;
}

function signPlayer(p){
 const t=userTeamObj();
 if(inTheRed())return toast("Signings are frozen while the club is in the red.");
 if(t.budget<p.value)return toast("Not enough in the budget.");
 if(t.squad.length>=SQUAD_MAX)return toast(`Squad is full (${SQUAD_MAX} max). Sell or release a player to make room.`);
 t.budget-=p.value;G.freeAgents=G.freeAgents.filter(x=>x!==p.id);
 p.team=t.id;t.squad.push(p.id);
 p.wage=wageOf(p);p.contract=newContractYears();delete p.demand;delete p.runningDown;
 joinClub(p,t.id);
 {const bs=G.badgeStats||(G.badgeStats={});
  bs.faSigns=(bs.faSigns||0)+1;if(bs.faSigns>=10)awardBadge("free_agent_king");
  bs.windowSigns=(bs.windowSigns||0)+1;if(bs.windowSigns>=5)awardBadge("window_warrior");
  if(p.region!==t.region)awardBadge("cross_region");
  if(G.superScout&&(G.superShort||[]).includes(p.id))awardBadge("chief_scout");}
 logAdd(`Signed ${p.name}.`,-p.value);
 toast(`Signed ${p.name} for ${money(p.value)}.`);squadCapNotice();saveGame(true);render();
}
function releasePlayer(p){
 const t=userTeamObj();
 if(!p||p.team!==G.userTeam)return;
 if(t.squad.length<=SQUAD_MIN)return toast(`Cannot go below ${SQUAD_MIN} players.`);
 if(p.pos==="GK"&&squadOf(t).filter(x=>x.pos==="GK").length<=2)return toast("Keep at least 2 keepers.");
 if(!confirm(`Release ${p.name}? They leave for free and their wage comes off the books.`))return;
 t.squad=t.squad.filter(x=>x!==p.id);p.team=null;G.freeAgents.push(p.id);
 if(t.unhappy)t.unhappy=t.unhappy.filter(x=>x!==p.id);delete p.unhappySince;
 if(G.xi)G.xi=G.xi.filter(id=>id!==p.id);
 G.badgeStats=G.badgeStats||{};G.badgeStats.releasedThisSeason=true;
 logAdd(`Released ${p.name}.`);
 toast(`${p.name} released.`);saveGame(true);render();
}

   tc.appendChild($(`<h3 style="font-size:15px;margin-bottom:4px">Club identity</h3>`));
   if(isScouted(id)&&traitOf(t))
     tc.appendChild($(`<div class="small"><b class="gold">${traitOf(t).label}</b></div>
       <div class="small muted" style="margin-top:3px">${traitOf(t).desc}</div>`));
   else
     tc.appendChild($(`<div class="small muted">Unknown. Scout this club to learn how they do business.</div>`));
   w.appendChild(tc);
 }
 w.appendChild(trophyCard(t));
 w.appendChild(clubLegendsCard(t,"Club goalscoring record"));

 if(me){w.appendChild($(`<div class="card small muted center">This is your club. Manage it from the Squad and Market tabs.</div>`));return;}

 // scouting gate
 const seen=isScouted(id);
 const sInfo=scoutInfo();
 if(!seen){
   const sc=$(`<div class="card center"></div>`);
   sc.appendChild($(`<div class="small" style="margin-bottom:8px">Their squad is hidden. Scout them to reveal the roster${sInfo.pot?" and player potential":""} for the rest of this season.</div>`));
   const b=$(`<button class="btn">Scout squad \u00B7 ${money(sInfo.cost)}</button>`);
   b.disabled=userTeamObj().budget<sInfo.cost;
   b.onclick=()=>buyScout(id);sc.appendChild(b);
   if(!sInfo.pot)sc.appendChild($(`<div class="small muted" style="margin-top:6px">Without a scout on staff you can see names and ratings, but not potential. Hire a Bronze, Silver or Gold scout in the Office.</div>`));
   w.appendChild(sc);
   return;
 }

 // roster revealed
 const open=inWindow();
 const rc=$(`<div class="card"></div>`);
 rc.appendChild($(`<h3 style="font-size:15px;margin-bottom:4px">Squad</h3>
   <div class="small muted" style="margin-bottom:6px">Fees scale with rating, age and potential. ${open?`Window Day ${G.window.day} of 3 \u00B7 no limit on approaches.`:"Buying opens in the pre-season window."}</div>`));
 const showPot=sInfo.pot;
 const rows=squadOf(t).sort((a,b)=>b.ovr-a.ovr).map(p=>{
   const fee=transferFee(p);
   const can=open&&userTeamObj().budget>=fee&&userTeamObj().squad.length<SQUAD_MAX;
   return `<tr><td class="l"><span class="pname" data-p="${p.id}">${p.name}</span></td>`+
     `<td><span class="pos ${p.pos}">${p.pos}</span></td><td>${ageCell(p)}</td>`+
     `<td class="gold">${p.ovr}</td><td class="muted">${showPot?p.pot:"?"}</td>`+
     `<td>${money(fee)}</td>`+
     `<td><button class="btn sm ${can?'':'sec'}" data-buy="${p.id}" ${can?'':'disabled'}>Buy</button></td></tr>`;
 }).join("");
 const rt=$(`<table><thead><tr><th class="l">Player</th><th></th><th>Age</th><th>OVR</th><th>POT</th><th>Fee</th><th></th></tr></thead><tbody>${rows}</tbody></table>`);
 rt.querySelectorAll("[data-buy]").forEach(b=>b.onclick=e=>{e.stopPropagation();buyPlayer(P(+b.dataset.buy))});
 wireNames(rt);rc.appendChild(rt);
 w.appendChild(rc);
}

/* boot */
if(loadGame()&&G.userTeam!==null){TAB="club";render()}
else{G=null;renderStart()}
</script>
</body>
</html>
